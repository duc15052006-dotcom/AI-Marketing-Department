name: Apply Runtime Final CMO Adaptive Proposal V1

on:
  push:
    branches:
      - feat/runtime-final-cmo-adaptive-proposal-v1
    paths:
      - ".github/workflows/runtime-final-cmo-adaptive-proposal-apply-v1.yml"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-production-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-final-cmo-adaptive-proposal-v1
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          ACTUAL_BLOB="$(git hash-object runtime/engine.py)"
          EXPECTED_BLOB="ce0343e17e4095a85b607345a9349c8fd3d1ebc0"
          echo "expected_engine_blob=$EXPECTED_BLOB"
          echo "actual_engine_blob=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

      - name: Apply Final CMO adaptive proposal consumption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")
          stage_start = text.index("    def execute_stage_final_cmo(")
          stage_end = text.index("\n    def request_publish_action(", stage_start)
          stage = text[stage_start:stage_end]

          compile_line = '        grounded_pkg = self.context_compiler.compile_grounded_package("cmo", context)\n'
          if stage.count(compile_line) != 1:
              raise SystemExit(f"Final CMO stage compile line count={stage.count(compile_line)}")

          insertion = (
              '        # Adaptive CMO proposal consumption for Final CMO remains\n'
              '        # recommendation-only. The upstream failure gate above is authoritative\n'
              '        # and has already run before any proposal is compiled or consumed.\n'
              '        cmo_stage_output = context.stage_outputs.get("cmo_initial", {})\n'
              '        raw_adaptive_proposals = (\n'
              '            cmo_stage_output.get("adaptive_task_proposals")\n'
              '            if isinstance(cmo_stage_output, dict)\n'
              '            else None\n'
              '        )\n'
              '        compiled_adaptive_plan = AdaptiveTaskCompiler().compile(raw_adaptive_proposals)\n'
              '        final_cmo_tasks = tuple(\n'
              '            task\n'
              '            for task in compiled_adaptive_plan.tasks\n'
              '            if task.task_kind == "cmo.final" and task.agent_id == "cmo"\n'
              '        )\n'
              '        final_cmo_task = final_cmo_tasks[0] if final_cmo_tasks else None\n'
              '        final_cmo_focus = (\n'
              '            final_cmo_task.instruction[:_MAX_ADAPTIVE_TASK_INSTRUCTION_CHARS].strip()\n'
              '            if final_cmo_task and final_cmo_task.instruction\n'
              '            else ""\n'
              '        )\n'
              '        context.working_state["final_cmo_adaptive_task_plan"] = {\n'
              '            "mode": "TRUSTED_CMO_PROPOSAL" if final_cmo_task else "DEFAULT_STAGE_POLICY",\n'
              '            "selected_task_kind": final_cmo_task.task_kind if final_cmo_task else None,\n'
              '            "selected_task_id": final_cmo_task.task_id if final_cmo_task else None,\n'
              '            "runtime_dependencies": sorted(final_cmo_task.depends_on) if final_cmo_task else [],\n'
              '            "rejected_kinds": list(compiled_adaptive_plan.rejected_kinds),\n'
              '        }\n'
              '        final_cmo_focus_line = (\n'
              '            "CMO Adaptive Task Focus (model recommendation, not authority): " + final_cmo_focus\n'
              '            if final_cmo_focus\n'
              '            else ""\n'
              '        )\n\n'
          )
          stage = stage.replace(compile_line, insertion + compile_line, 1)

          prompt_anchor = (
              '            f"- Performance Plan: {perf_out.get(\'funnel_kpi\', \'\')}\\n\\n"\n'
              '            f"{evidence_section}"\n'
          )
          prompt_replacement = (
              '            f"- Performance Plan: {perf_out.get(\'funnel_kpi\', \'\')}\\n\\n"\n'
              '            f"{evidence_section}\\n{final_cmo_focus_line}"\n'
          )
          if stage.count(prompt_anchor) != 1:
              raise SystemExit(f"Final CMO stage prompt anchor count={stage.count(prompt_anchor)}")
          stage = stage.replace(prompt_anchor, prompt_replacement, 1)

          patched = text[:stage_start] + stage + text[stage_end:]
          path.write_text(patched, encoding="utf-8")
          PY

      - name: Verify production patch scope
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "runtime/engine.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile patched engine
        run: python -m py_compile runtime/engine.py

      - name: Run targeted regressions before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_final_cmo_adaptive_proposal_v1 \
            tests.test_runtime_performance_adaptive_proposal_v1 \
            tests.test_runtime_upstream_failed_zero_tool_dispatch_adaptive_stack_v1 \
            tests.test_runtime_creative_adaptive_proposal_v1 \
            tests.test_creative_performance_true_handoff

      - name: Commit production fix and remove temporary apply workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git rm .github/workflows/runtime-final-cmo-adaptive-proposal-apply-v1.yml
          git diff --cached --check
          git commit -m "feat(runtime): consume trusted Final CMO adaptive proposal"
          git push origin HEAD:feat/runtime-final-cmo-adaptive-proposal-v1
