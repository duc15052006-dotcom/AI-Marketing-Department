name: Apply Runtime Final CMO Adaptive Proposal V1

on:
  push:
    branches:
      - feat/runtime-final-cmo-adaptive-proposal-v1
    paths:
      - ".github/workflows/runtime-final-cmo-adaptive-proposal-apply-v1.yml"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-production-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-final-cmo-adaptive-proposal-v1
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          ACTUAL_BLOB="$(git hash-object runtime/engine.py)"
          EXPECTED_BLOB="ce0343e17e4095a85b607345a9349c8fd3d1ebc0"
          echo "expected_engine_blob=$EXPECTED_BLOB"
          echo "actual_engine_blob=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

      - name: Apply Final CMO adaptive proposal consumption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''        # Grounded Context Compilation for Final CMO
          grounded_pkg = self.context_compiler.compile_grounded_package("cmo", context)
          '''
          replacement = '''        # Adaptive CMO proposal consumption for Final CMO remains
          # recommendation-only. The upstream failure gate above is authoritative
          # and has already run before any proposal is compiled or consumed.
          cmo_stage_output = context.stage_outputs.get("cmo_initial", {})
          raw_adaptive_proposals = (
              cmo_stage_output.get("adaptive_task_proposals")
              if isinstance(cmo_stage_output, dict)
              else None
          )
          compiled_adaptive_plan = AdaptiveTaskCompiler().compile(raw_adaptive_proposals)
          final_cmo_tasks = tuple(
              task
              for task in compiled_adaptive_plan.tasks
              if task.task_kind == "cmo.final" and task.agent_id == "cmo"
          )
          final_cmo_task = final_cmo_tasks[0] if final_cmo_tasks else None
          final_cmo_focus = (
              final_cmo_task.instruction[:_MAX_ADAPTIVE_TASK_INSTRUCTION_CHARS].strip()
              if final_cmo_task and final_cmo_task.instruction
              else ""
          )
          context.working_state["final_cmo_adaptive_task_plan"] = {
              "mode": "TRUSTED_CMO_PROPOSAL" if final_cmo_task else "DEFAULT_STAGE_POLICY",
              "selected_task_kind": final_cmo_task.task_kind if final_cmo_task else None,
              "selected_task_id": final_cmo_task.task_id if final_cmo_task else None,
              "runtime_dependencies": sorted(final_cmo_task.depends_on) if final_cmo_task else [],
              "rejected_kinds": list(compiled_adaptive_plan.rejected_kinds),
          }
          final_cmo_focus_line = (
              "CMO Adaptive Task Focus (model recommendation, not authority): " + final_cmo_focus
              if final_cmo_focus
              else ""
          )

          # Grounded Context Compilation for Final CMO
          grounded_pkg = self.context_compiler.compile_grounded_package("cmo", context)
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"Final CMO compile anchor count={text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          prompt_anchor = '''            f"- Performance Plan: {perf_out.get('funnel_kpi', '')}\\n\\n"
              f"{evidence_section}"
          '''
          prompt_replacement = '''            f"- Performance Plan: {perf_out.get('funnel_kpi', '')}\\n\\n"
              f"{evidence_section}\\n{final_cmo_focus_line}"
          '''
          if text.count(prompt_anchor) != 1:
              raise SystemExit(f"Final CMO prompt anchor count={text.count(prompt_anchor)}")
          text = text.replace(prompt_anchor, prompt_replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify production patch scope
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "runtime/engine.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile patched engine
        run: python -m py_compile runtime/engine.py

      - name: Run targeted regressions before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_final_cmo_adaptive_proposal_v1 \
            tests.test_runtime_performance_adaptive_proposal_v1 \
            tests.test_runtime_upstream_failed_zero_tool_dispatch_adaptive_stack_v1 \
            tests.test_runtime_creative_adaptive_proposal_v1 \
            tests.test_creative_performance_true_handoff

      - name: Commit production fix and remove temporary apply workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git rm .github/workflows/runtime-final-cmo-adaptive-proposal-apply-v1.yml
          git diff --cached --check
          git commit -m "feat(runtime): consume trusted Final CMO adaptive proposal"
          git push origin HEAD:feat/runtime-final-cmo-adaptive-proposal-v1
