name: Model Gateway Fallback Stream Close Apply

on:
  push:
    branches:
      - test/model-gateway-fallback-stream-close-v1

permissions:
  contents: write

jobs:
  apply-production-fix:
    if: startsWith(github.event.head_commit.message, 'ci(models): apply fallback stream cleanup fix')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/model-gateway-fallback-stream-close-v1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Patch abandoned stream cleanup guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('integrations/models/gateway.py')
          text = path.read_text(encoding='utf-8')

          old_degrade = '''                if first_delta.finish_reason == "stream_unsupported" and first_delta.content == "" and not candidate_visible_content:\n                    try:\n                        sync_resp = adapter.generate(req_copy)\n'''
          new_degrade = '''                if first_delta.finish_reason == "stream_unsupported" and first_delta.content == "" and not candidate_visible_content:\n                    try:\n                        close_stream = getattr(stream_gen, "close", None)\n                        if callable(close_stream):\n                            close_stream()\n                        sync_resp = adapter.generate(req_copy)\n'''

          old_error = '''                    elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):\n                        self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)\n\n                    if strict_model_pin or len(candidates) == 1:\n                        yield normalize_public_stream_delta(first_delta, cand_provider, cand_model)\n'''
          new_error = '''                    elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):\n                        self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)\n\n                    close_stream = getattr(stream_gen, "close", None)\n                    if callable(close_stream):\n                        close_stream()\n\n                    if strict_model_pin or len(candidates) == 1:\n                        yield normalize_public_stream_delta(first_delta, cand_provider, cand_model)\n'''

          old_empty = '''                    last_error = empty_err\n                    last_error_provider = cand_provider\n                    last_error_model = cand_model\n                    if strict_model_pin or len(candidates) == 1:\n                        yield normalize_public_stream_delta(\n                            StreamDelta(content="", finish_reason="error", error=empty_err),\n                            cand_provider,\n                            cand_model,\n                        )\n                        return\n                    continue\n\n                # 4. First delta has visible content\n'''
          new_empty = '''                    last_error = empty_err\n                    last_error_provider = cand_provider\n                    last_error_model = cand_model\n                    close_stream = getattr(stream_gen, "close", None)\n                    if callable(close_stream):\n                        close_stream()\n                    if strict_model_pin or len(candidates) == 1:\n                        yield normalize_public_stream_delta(\n                            StreamDelta(content="", finish_reason="error", error=empty_err),\n                            cand_provider,\n                            cand_model,\n                        )\n                        return\n                    continue\n\n                # 4. First delta has visible content\n'''

          for label, old in (("degrade", old_degrade), ("error", old_error), ("empty", old_empty)):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} locator count={count}; refusing patch')

          text = text.replace(old_degrade, new_degrade, 1)
          text = text.replace(old_error, new_error, 1)
          text = text.replace(old_empty, new_empty, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify causal cleanup regression
        run: |
          python -m compileall -q integrations/models/gateway.py tests/test_model_gateway_fallback_stream_close_v1.py
          python -m unittest -v tests.test_model_gateway_fallback_stream_close_v1

      - name: Commit production fix only
        shell: bash
        run: |
          git diff -- integrations/models/gateway.py
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M integrations/models/gateway.py$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): close abandoned stream before fallback"
          git push origin HEAD:test/model-gateway-fallback-stream-close-v1
