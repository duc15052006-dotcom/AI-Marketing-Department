name: Brain Evidence Observation Causal Provenance Bootstrap

on:
  push:
    branches:
      - fix/brain-evidence-observation-causal-provenance-v1
    paths:
      - ".github/workflows/brain-evidence-observation-causal-provenance-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-production-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with ancestry
        uses: actions/checkout@v4
        with:
          ref: fix/brain-evidence-observation-causal-provenance-v1
          fetch-depth: 4

      - name: Verify bootstrap ancestry remains on hosted RED head
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "b1e4676bf3b9282c53155b8bf26b94405b1a0b89"
          test "$(git rev-parse HEAD^^)" = "93af5caffd37f1d8a7d36e9243bc8907c6986979"
          test "$(git rev-parse HEAD^^^)" = "7f9b7a140ac105e686d944380619cc9e67810437"

      - name: Apply minimal production patch and remove bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          models_path = Path("tools/evidence/models.py")
          models = models_path.read_text(encoding="utf-8")
          old_models = (
              '    run_id: str = ""\n'
              '    business_id: str = ""\n'
              '    project_id: str = ""\n'
              '\n'
              '    source_platform: str\n'
          )
          new_models = (
              '    run_id: str = ""\n'
              '    business_id: str = ""\n'
              '    project_id: str = ""\n'
              '\n'
              '    # Causal execution provenance is copied verbatim from the source ObservationRecord.\n'
              '    # EvidenceBuilder is not an authority source and must never mint or replace either ID.\n'
              '    execution_id: str = ""\n'
              '    action_intent_id: Optional[str] = None\n'
              '\n'
              '    source_platform: str\n'
          )
          if models.count(old_models) != 1:
              raise SystemExit("models.py patch anchor mismatch")
          models_path.write_text(models.replace(old_models, new_models, 1), encoding="utf-8")

          builder_path = Path("tools/evidence/builder.py")
          builder = builder_path.read_text(encoding="utf-8")
          old_builder = (
              '            run_id=obs.run_id,\n'
              '            business_id=obs.business_id,\n'
              '            project_id=obs.project_id,\n'
              '            source_platform=obs.source_platform,\n'
          )
          new_builder = (
              '            run_id=obs.run_id,\n'
              '            business_id=obs.business_id,\n'
              '            project_id=obs.project_id,\n'
              '            execution_id=obs.execution_id,\n'
              '            action_intent_id=obs.action_intent_id,\n'
              '            source_platform=obs.source_platform,\n'
          )
          if builder.count(old_builder) != 1:
              raise SystemExit("builder.py patch anchor mismatch")
          builder_path.write_text(builder.replace(old_builder, new_builder, 1), encoding="utf-8")

          Path(".github/workflows/brain-evidence-observation-causal-provenance-bootstrap.yml").unlink()
          PY

      - name: Commit exact production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/evidence/models.py tools/evidence/builder.py .github/workflows/brain-evidence-observation-causal-provenance-bootstrap.yml
          git diff --cached --check
          git diff --cached -- tools/evidence/models.py tools/evidence/builder.py
          git commit -m "fix(brain): preserve observation causal provenance in evidence"
          git push origin HEAD:fix/brain-evidence-observation-causal-provenance-v1
