name: Apply Runtime Business Scope Convergence Repair

on:
  pull_request:
    paths:
      - ".github/workflows/_apply_runtime_business_scope_convergence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2

      - name: Verify exact RED parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "274f85ee7fd4e798fae18b309d9612e35dbbc357"

      - name: Apply minimal business-scope-required repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/security.py")
          text = path.read_text(encoding="utf-8")
          old = '''            # Check business_id match (if bound in record)
          if record.business_id and business_id and record.business_id != business_id:
              return PolicyDecision(
                  allowed=False,
                  requires_human_approval=True,
                  error_code="APPROVAL_BUSINESS_MISMATCH",
                  reason=f"APPROVAL_BUSINESS_MISMATCH: Approval is bound to business '{record.business_id}', not '{business_id}'.",
              )
          '''.replace("          ", "")
          new = '''            # Check business_id scope and match (if bound in record)
          if record.business_id and not business_id:
              return PolicyDecision(
                  allowed=False,
                  requires_human_approval=True,
                  error_code="APPROVAL_BUSINESS_SCOPE_REQUIRED",
                  reason=f"APPROVAL_BUSINESS_SCOPE_REQUIRED: Approval is bound to business '{record.business_id}', but the request has no business scope.",
              )

          if record.business_id and record.business_id != business_id:
              return PolicyDecision(
                  allowed=False,
                  requires_human_approval=True,
                  error_code="APPROVAL_BUSINESS_MISMATCH",
                  reason=f"APPROVAL_BUSINESS_MISMATCH: Approval is bound to business '{record.business_id}', not '{business_id}'.",
              )
          '''.replace("          ", "")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one business-scope anchor, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify repair before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/security.py tests/test_runtime_approval_business_scope_required_v1.py tests/test_runtime_approval_run_scope_canonical_v1.py
          python -m unittest -v tests.test_runtime_approval_business_scope_required_v1
          python -m unittest -v tests.test_runtime_approval_business_scope_authority_v1 tests.test_runtime_approval_project_scope_authority_v1 tests.test_runtime_approval_run_scope_required_v1 tests.test_runtime_approval_run_scope_canonical_v1 tests.test_prod_sec_01_api_and_approval_boundary tests.test_prod_sec_01rr_human_intent_boundary
          git diff --check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply_runtime_business_scope_convergence.yml
          git add tools/security.py
          git commit -m "fix(runtime): require business scope for bound approvals"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
