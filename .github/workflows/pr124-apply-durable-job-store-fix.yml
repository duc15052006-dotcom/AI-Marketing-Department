name: PR124 Apply Durable Job Store Fix

on:
  push:
    branches:
      - fix/app-backend-durable-job-store-wiring-v1
    paths:
      - .github/workflows/pr124-apply-durable-job-store-fix.yml

permissions:
  contents: write

jobs:
  apply-production-fix:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/app-backend-durable-job-store-wiring-v1
          fetch-depth: 0

      - name: Apply guarded one-file production patch
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          path = Path("app_api/server.py")
          text = path.read_text(encoding="utf-8")

          import_old = "from runtime.queue import ResourceLimiter, RunManager"
          import_new = "from runtime.job_store import SQLiteJobRepository\nfrom runtime.queue import ResourceLimiter, RunManager"
          if text.count(import_old) != 1:
              raise SystemExit(f"IMPORT_MATCH_COUNT={text.count(import_old)} expected=1")
          if "from runtime.job_store import SQLiteJobRepository" in text:
              raise SystemExit("JOB_STORE_IMPORT_ALREADY_PRESENT")
          text = text.replace(import_old, import_new, 1)

          helper_marker = "\n\ndef write_backend_state(host: str, port: int) -> None:"
          helper = (
              "\n\ndef get_job_store_file_path() -> Path:\n"
              "    \"\"\"Return the durable queue database in the canonical per-user runtime directory.\"\"\"\n"
              "    return get_backend_state_file_path().with_name(\"jobs.sqlite3\")\n"
          )
          if text.count(helper_marker) != 1:
              raise SystemExit(f"HELPER_MARKER_COUNT={text.count(helper_marker)} expected=1")
          if "def get_job_store_file_path()" in text:
              raise SystemExit("JOB_STORE_PATH_HELPER_ALREADY_PRESENT")
          text = text.replace(helper_marker, helper + helper_marker, 1)

          manager_old = '''        self.resource_limiter = ResourceLimiter()
          self.run_manager = RunManager(
              runtime=self.runtime,
              max_workers=2,
              resource_limiter=self.resource_limiter,
          )'''
          manager_new = '''        self.resource_limiter = ResourceLimiter()
          self.job_repository = SQLiteJobRepository(get_job_store_file_path())
          self.run_manager = RunManager(
              runtime=self.runtime,
              max_workers=2,
              resource_limiter=self.resource_limiter,
              job_repository=self.job_repository,
          )'''
          if text.count(manager_old) != 1:
              raise SystemExit(f"RUN_MANAGER_MATCH_COUNT={text.count(manager_old)} expected=1")
          text = text.replace(manager_old, manager_new, 1)

          path.write_text(text, encoding="utf-8")
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q app_api/server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit exact production fix
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- app_api/server.py)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app_api/server.py
            git commit -m "fix(runtime): wire durable job repository into production backend"
            git push origin HEAD:fix/app-backend-durable-job-store-wiring-v1
          } else {
            Write-Error "NO_PRODUCTION_DIFF_CREATED"
            exit 1
          }
