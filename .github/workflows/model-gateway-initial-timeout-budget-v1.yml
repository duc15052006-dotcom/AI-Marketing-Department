name: Model Gateway Initial Timeout Budget V1

on:
  push:
    branches:
      - test/model-gateway-initial-timeout-budget-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-gateway-initial-timeout-budget-v1-qualify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-production-fix:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(models) apply initial timeout fix')
    name: Apply minimal gateway deadline fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/model-gateway-initial-timeout-budget-v1

      - name: Patch exact timeout guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('integrations/models/gateway.py')
          text = path.read_text(encoding='utf-8')

          old_sync = '''            if remaining_timeout <= 0.001 and attempt_count > 0:\n                logger.warning("Gateway timeout budget exhausted across fallback candidates.")\n                break\n\n            attempt_count += 1\n'''
          new_sync = '''            if remaining_timeout <= 0.001:\n                if attempt_count > 0:\n                    logger.warning("Gateway timeout budget exhausted across fallback candidates.")\n                    break\n                return ModelResponse(\n                    request_id=norm_req.request_id,\n                    provider="gateway",\n                    model_name=norm_req.model_name,\n                    status=ModelResponseStatus.TIMEOUT,\n                    error="TIMEOUT: Total gateway timeout budget exhausted before provider dispatch.",\n                    usage=ModelUsage(usage_source="NOT_AVAILABLE"),\n                    latency_ms=(time.perf_counter() - start_time) * 1000.0,\n                )\n\n            attempt_count += 1\n'''

          old_stream = '''            if remaining_timeout <= 0.001 and cand_idx > 0:\n                logger.warning("Gateway stream timeout budget exhausted across fallback candidates.")\n                break\n\n            # 1. Retrieve Provider Definition\n'''
          new_stream = '''            if remaining_timeout <= 0.001:\n                if cand_idx > 0:\n                    logger.warning("Gateway stream timeout budget exhausted across fallback candidates.")\n                    break\n                yield normalize_public_stream_delta(\n                    StreamDelta(\n                        content="",\n                        finish_reason="error",\n                        error=ModelStreamError(\n                            code="TIMEOUT",\n                            category="TIMEOUT",\n                            safe_message="TIMEOUT: Total gateway timeout budget exhausted before provider dispatch.",\n                            retryable=False,\n                            http_status=408,\n                        ),\n                    ),\n                    "gateway",\n                    norm_req.model_name,\n                )\n                return\n\n            # 1. Retrieve Provider Definition\n'''

          if text.count(old_sync) != 1:
              raise SystemExit(f'sync locator count={text.count(old_sync)}; refusing patch')
          if text.count(old_stream) != 1:
              raise SystemExit(f'stream locator count={text.count(old_stream)}; refusing patch')

          text = text.replace(old_sync, new_sync, 1).replace(old_stream, new_stream, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted causal regression before commit
        run: |
          python -m compileall -q integrations/models/gateway.py tests/test_model_gateway_initial_timeout_budget_v1.py
          python -m unittest -v tests.test_model_gateway_initial_timeout_budget_v1

      - name: Commit production fix
        shell: bash
        run: |
          git diff -- integrations/models/gateway.py
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M integrations/models/gateway.py$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): stop dispatch after initial timeout budget"
          git push origin HEAD:test/model-gateway-initial-timeout-budget-v1

  focused-regression:
    name: Ubuntu Python 3.12 focused — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: causal-initial-timeout-budget
            module: tests.test_model_gateway_initial_timeout_budget_v1
          - label: previous-stream-timeout-budget
            module: tests.test_model_gateway_stream_timeout_budget_v1
          - label: provider-registry
            module: tests.test_prod_model_gateway_01_provider_registry
          - label: model-streaming
            module: tests.test_prod_model_streaming_01
          - label: structured-provider-stream-error
            module: tests.test_prod_structured_provider_stream_error_01
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        run: |
          echo "github_sha=${{ github.sha }}"
          echo "github_ref=${{ github.ref }}"
          echo "module=${{ matrix.module }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile model and regression sources
        run: |
          python -m compileall -q integrations/models tests/test_model_gateway_initial_timeout_budget_v1.py tests/test_model_gateway_stream_timeout_budget_v1.py

      - name: Run focused regression — ${{ matrix.label }}
        run: python -m unittest -v ${{ matrix.module }}

      - name: Verify clean checkout after tests
        if: always()
        run: git diff --exit-code

  full-hermetic-windows:
    name: Windows Python 3.12 full hermetic discovery
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        shell: pwsh
        run: |
          "github_sha=${{ github.sha }}"
          "github_ref=${{ github.ref }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connectors creative_engine governance integrations knowledge memory runtime schemas scripts tools workspace tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          $outputFile = Join-Path $env:RUNNER_TEMP "full-hermetic-unittest.log"
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath $outputFile
          $testExit = $LASTEXITCODE
          Get-Content $outputFile |
            Select-String -Pattern '^Ran \d+ tests', '^OK(?: \(skipped=\d+\))?$' |
            ForEach-Object { Write-Host "CANONICAL_TEST_SUMMARY=$($_.Line)" }
          if ($testExit -ne 0) { exit $testExit }

      - name: Verify clean checkout after tests
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
