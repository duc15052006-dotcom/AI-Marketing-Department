name: TMP PR89 Trusted Scope Repair V7

on:
  push:
    branches:
      - test/pr89-trusted-scope-repair-v7

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate repair
        shell: python {0}
        run: |
          from pathlib import Path
          import base64

          def read_lines(path):
              return Path(path).read_text(encoding="utf-8").splitlines()

          def write_lines(path, lines):
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          def insert_after_unique(path, exact_line, new_lines):
              lines = read_lines(path)
              hits = [i for i, line in enumerate(lines) if line == exact_line]
              if len(hits) != 1:
                  raise SystemExit(f"ANCHOR_COUNT_MISMATCH {path}: {exact_line!r}: {len(hits)}")
              i = hits[0]
              lines[i + 1:i + 1] = new_lines
              write_lines(path, lines)

          def insert_before_unique(path, exact_line, new_lines):
              lines = read_lines(path)
              hits = [i for i, line in enumerate(lines) if line == exact_line]
              if len(hits) != 1:
                  raise SystemExit(f"ANCHOR_COUNT_MISMATCH {path}: {exact_line!r}: {len(hits)}")
              i = hits[0]
              lines[i:i] = new_lines
              write_lines(path, lines)

          def insert_after_in_region(path, region_start, region_end, exact_line, new_lines):
              lines = read_lines(path)
              starts = [i for i, line in enumerate(lines) if line == region_start]
              if len(starts) != 1:
                  raise SystemExit(f"REGION_START_MISMATCH {path}: {region_start!r}: {len(starts)}")
              start = starts[0]
              ends = [i for i in range(start + 1, len(lines)) if lines[i] == region_end]
              if not ends:
                  raise SystemExit(f"REGION_END_MISMATCH {path}: {region_end!r}")
              end = ends[0]
              hits = [i for i in range(start, end + 1) if lines[i] == exact_line]
              if len(hits) != 1:
                  raise SystemExit(f"REGION_ANCHOR_MISMATCH {path}: {exact_line!r}: {len(hits)}")
              i = hits[0]
              lines[i + 1:i + 1] = new_lines
              write_lines(path, lines)

          insert_after_unique("runtime/context.py", "    user_id: Optional[str] = None", [
              "    trusted_knowledge_scope: Optional[str] = None",
              "    trusted_memory_scope: Optional[str] = None",
          ])
          insert_after_unique("runtime/context.py", "    project_id: Optional[str] = Field(default=None, description=\"Optional associated workspace project ID\")", [
              "    trusted_knowledge_scope: Optional[str] = Field(default=None, description=\"Trusted legacy knowledge scope bound at run creation\")",
              "    trusted_memory_scope: Optional[str] = Field(default=None, description=\"Trusted legacy memory scope bound at run creation\")",
          ])
          insert_after_unique("runtime/context.py", "            \"user_id\",", [
              "            \"trusted_knowledge_scope\",",
              "            \"trusted_memory_scope\",",
          ])
          insert_after_unique("runtime/context.py", "            user_id=self.user_id,", [
              "            trusted_knowledge_scope=self.trusted_knowledge_scope,",
              "            trusted_memory_scope=self.trusted_memory_scope,",
          ])

          insert_after_unique("runtime/scope_bridge.py", "    campaign_id = _clean(authority.campaign_id)", [
              "    trusted_knowledge_scope = _clean(authority.trusted_knowledge_scope)",
              "    trusted_memory_scope = _clean(authority.trusted_memory_scope)",
          ])
          insert_before_unique("runtime/scope_bridge.py", "    return RuntimeCanonicalScopePlan(", [
              "    # Exact legacy aliases are accepted only after a trusted workspace binds",
              "    # them into immutable RuntimeContext authority at run creation.",
              "    if trusted_knowledge_scope and trusted_knowledge_scope.upper() != \"GLOBAL\":",
              "        if trusted_knowledge_scope not in knowledge_keys:",
              "            knowledge_keys.append(trusted_knowledge_scope)",
              "    if trusted_memory_scope and trusted_memory_scope.upper() != \"GLOBAL\":",
              "        if trusted_memory_scope not in memory_keys:",
              "            memory_keys.append(trusted_memory_scope)",
              "",
          ])

          insert_after_in_region("runtime/engine.py", "    def start_run(", "    ) -> RuntimeContext:", "        project_id: Optional[str] = None,", [
              "        trusted_knowledge_scope: Optional[str] = None,",
              "        trusted_memory_scope: Optional[str] = None,",
          ])
          insert_after_in_region("runtime/engine.py", "    def start_run(", "            context = RuntimeContext(", "                project_id=project_id,", [
              "                trusted_knowledge_scope=trusted_knowledge_scope,",
              "                trusted_memory_scope=trusted_memory_scope,",
          ])
          insert_after_in_region("workspace/operator.py", "    def create_run(", "        if biz:", "            user_id=user_id,", [
              "            trusted_knowledge_scope=biz.knowledge_scope if biz else None,",
              "            trusted_memory_scope=biz.memory_scope if biz else None,",
          ])

          test_b64 = ""
          Path("tests/test_runtime_trusted_legacy_scope_authority_v1.py").write_bytes(base64.b64decode(test_b64))
      - name: Compile candidate patch
        shell: pwsh
        run: python -m py_compile runtime/context.py runtime/scope_bridge.py runtime/engine.py workspace/operator.py tests/test_runtime_trusted_legacy_scope_authority_v1.py tests/test_phase6_2_pilot_and_v1_release.py
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Run targeted regressions
        shell: pwsh
        run: python -m unittest tests.test_runtime_builder_canonical_lineage_scope_v1 tests.test_runtime_trusted_legacy_scope_authority_v1 tests.test_context_compiler_dual_scope_read_v1 tests.test_runtime_canonical_scope_plan_v1 tests.test_runtime_builder_scope_isolation_v1 tests.test_phase6_2_pilot_and_v1_release -v
      - name: Verify patch hygiene
        shell: pwsh
        run: git diff --check
      - name: Commit validated candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/context.py runtime/scope_bridge.py runtime/engine.py workspace/operator.py tests/test_runtime_trusted_legacy_scope_authority_v1.py
          git commit -m "test: validated PR89 trusted legacy scope repair"
          git push origin HEAD:test/pr89-trusted-scope-repair-v7
