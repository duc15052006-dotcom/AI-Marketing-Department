name: Capability Registry Policy Immutability V2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-registry-policy-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Capability registry policy immutability V2
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $expectedHead = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actualHead = (git rev-parse HEAD).Trim()
          "expected_head_sha=$expectedHead" | Tee-Object -FilePath .ci-results/capability-registry-policy-v2-identity.txt
          "actual_head_sha=$actualHead" | Tee-Object -FilePath .ci-results/capability-registry-policy-v2-identity.txt -Append
          "github_ref=${{ github.ref }}" | Tee-Object -FilePath .ci-results/capability-registry-policy-v2-identity.txt -Append
          "github_event_name=${{ github.event_name }}" | Tee-Object -FilePath .ci-results/capability-registry-policy-v2-identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/capability-registry-policy-v2-identity.txt -Append
          if ($actualHead -ne $expectedHead) {
            Write-Error "EXACT_HEAD_MISMATCH: expected $expectedHead but checked out $actualHead"
            exit 1
          }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run capability registry policy immutability adversarial V2
        shell: pwsh
        run: |
          python -m unittest -v tests.test_capability_registry_policy_immutability_adversarial_v2 `
            2>&1 | Tee-Object -FilePath .ci-results/capability-registry-policy-immutability-v2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-registry-policy-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
