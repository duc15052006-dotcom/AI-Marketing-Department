name: Temporary Cleanup Collaboration Source Independence V1

on:
  pull_request:
    branches:
      - fix/brain-collaboration-proposal-evidence-authority-v1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brain-collaboration-source-independence-v1
          fetch-depth: 0
      - name: Remove duplicate helper block if present
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('brain/collaboration.py')
          text = path.read_text()
          marker = 'def _canonical_support_source_ids(\n'
          starts = []
          cursor = 0
          while True:
              idx = text.find(marker, cursor)
              if idx < 0:
                  break
              starts.append(idx)
              cursor = idx + len(marker)
          if len(starts) > 2:
              raise SystemExit(f'unexpected helper duplication count: {len(starts)}')
          if len(starts) == 2:
              class_anchor = text.find('class CollaborationDecision(BaseModel):', starts[1])
              if class_anchor < 0:
                  raise SystemExit('CollaborationDecision anchor missing after duplicate helper')
              text = text[:starts[1]] + text[class_anchor:]
              path.write_text(text)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- brain/collaboration.py; then
            echo 'No duplicate helper remains.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brain/collaboration.py
          git commit -m 'fix(brain): remove duplicate source-independence helper'
          git push origin HEAD:fix/brain-collaboration-source-independence-v1
