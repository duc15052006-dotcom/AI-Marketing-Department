name: Offline Regression CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Windows Python 3.12 offline regression
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record CI identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          "github_sha=${{ github.sha }}" | Tee-Object -FilePath .ci-results/identity.txt
          "github_ref=${{ github.ref }}" | Tee-Object -FilePath .ci-results/identity.txt -Append
          "runner_os=${{ runner.os }}" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          git rev-parse HEAD 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests 2>&1 | Tee-Object -FilePath .ci-results/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repair regressions
        timeout-minutes: 12
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_structure `
            tests.test_prod_verifier_02_sidecar_boundary.TestImportFirewall `
            tests.test_tool_gateway_idempotency_01 `
            tests.test_free_only_cost_authority_02 `
            tests.test_secret_sanitization_03 `
            tests.test_settings_connection_redaction_03b `
            tests.test_tool_receipt_provenance_04 `
            tests.test_local_openai_noauth_05 `
            tests.test_local_noauth_diagnostics_05c `
            tests.test_sse_parser_06 `
            tests.test_sse_response_wrapper_06b `
            tests.test_provider_response_schema_07 `
            tests.test_governance_import_cycle_11 `
            tests.test_stream_error_redaction_10 `
            tests.test_creative_performance_true_handoff `
            2>&1 | Tee-Object -FilePath .ci-results/repair-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified streaming regressions
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_prod_model_streaming_01 `
            tests.test_prod_structured_provider_stream_error_01 `
            tests.test_prod_python_streaming_endpoint_01 `
            tests.test_prod_runtime_progress_01 `
            2>&1 | Tee-Object -FilePath .ci-results/streaming-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified model settings regressions
        timeout-minutes: 20
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01 `
            2>&1 | Tee-Object -FilePath .ci-results/model-settings-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified provider registry regressions
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_gateway_01_provider_registry `
            2>&1 | Tee-Object -FilePath .ci-results/provider-registry-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run execution-mode provenance regression
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m unittest -v tests.test_receipt_execution_mode_provenance_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/execution-mode-provenance-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run idempotency prepare-failure regression
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m unittest -v tests.test_idempotency_prepare_failure_orphan_reservation_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/idempotency-prepare-failure-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run idempotency intent-dispatch transition regression
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m unittest -v tests.test_idempotency_intent_dispatch_transition_failure_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/idempotency-intent-dispatch-transition-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run idempotency ledger-dispatch transition regression
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m unittest -v tests.test_idempotency_ledger_dispatch_transition_failure_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/idempotency-ledger-dispatch-transition-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run retired provider alias history regression
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m unittest -v tests.test_idempotency_retired_provider_alias_history_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/idempotency-retired-provider-alias-history-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run REAL consequential idempotency-key requirement regression
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m unittest -v tests.test_real_consequential_idempotency_key_required_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/real-consequential-idempotency-key-required-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath .ci-results/full-unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-regression-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
