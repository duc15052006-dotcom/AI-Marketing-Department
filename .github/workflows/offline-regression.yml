name: Offline Regression CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Windows Python 3.12 offline regression
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      AI_MARKETING_MEMORY_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record and verify exact CI identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $expectedHead = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actualHead = (git rev-parse HEAD).Trim()
          $branch = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          "expected_head_sha=$expectedHead" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_head_sha=$actualHead" | Tee-Object -FilePath .ci-results/identity.txt -Append
          "commit_sha=$actualHead" | Tee-Object -FilePath .ci-results/identity.txt -Append
          "github_ref=$branch" | Tee-Object -FilePath .ci-results/identity.txt -Append
          "github_event_name=$eventName" | Tee-Object -FilePath .ci-results/identity.txt -Append
          "runner_os=${{ runner.os }}" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          Write-Host "Expected CI head: $expectedHead"
          Write-Host "Actual CI head: $actualHead"
          Write-Host "CI ref: $branch"
          if ($actualHead -ne $expectedHead) {
            Write-Error "EXACT_HEAD_MISMATCH: expected $expectedHead but checked out $actualHead"
            exit 1
          }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests 2>&1 | Tee-Object -FilePath .ci-results/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repair regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_structure `
            tests.test_prod_verifier_02_sidecar_boundary.TestImportFirewall `
            tests.test_tool_gateway_idempotency_01 `
            tests.test_free_only_cost_authority_02 `
            tests.test_secret_sanitization_03 `
            tests.test_settings_connection_redaction_03b `
            tests.test_tool_receipt_provenance_04 `
            tests.test_local_openai_noauth_05 `
            tests.test_local_noauth_diagnostics_05c `
            tests.test_sse_parser_06 `
            tests.test_sse_response_wrapper_06b `
            tests.test_provider_response_schema_07 `
            tests.test_governance_import_cycle_11 `
            tests.test_stream_error_redaction_10 `
            tests.test_creative_performance_true_handoff `
            2>&1 | Tee-Object -FilePath .ci-results/repair-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified streaming regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_prod_model_streaming_01 `
            tests.test_prod_structured_provider_stream_error_01 `
            tests.test_prod_python_streaming_endpoint_01 `
            tests.test_prod_runtime_progress_01 `
            2>&1 | Tee-Object -FilePath .ci-results/streaming-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified model settings regressions
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01 `
            2>&1 | Tee-Object -FilePath .ci-results/model-settings-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified provider registry regressions
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_gateway_01_provider_registry `
            2>&1 | Tee-Object -FilePath .ci-results/provider-registry-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run stacked PR exact-head CI regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_stacked_pr_exact_head_ci_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/stacked-pr-exact-head-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run job artifact hash restart regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_job_artifact_hash_restart_contract_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/job-artifact-hash-restart-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run knowledge ingest authority default regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_knowledge_ingest_authority_default_adversarial_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/knowledge-ingest-authority-default-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run production knowledge restart durability regression v3
        shell: pwsh
        run: |
          python -m unittest -v tests.test_production_knowledge_restart_durability_adversarial_v3 `
            2>&1 | Tee-Object -FilePath .ci-results/production-knowledge-restart-durability-v3.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run checkpoint semantic hash integrity regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_checkpoint_semantic_hash_integrity_adversarial_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/checkpoint-semantic-hash-integrity-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run production app backend durable job-store wiring regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_app_backend_durable_job_store_wiring_adversarial_v1 `
            2>&1 | Tee-Object -FilePath .ci-results/app-backend-durable-job-store-wiring-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run plugin manifest policy immutability regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_plugin_manifest_policy_immutability_adversarial_v2 `
            2>&1 | Tee-Object -FilePath .ci-results/plugin-manifest-policy-immutability-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Intelligence discovered-page follow-up regression v2
        shell: pwsh
        run: |
          python -m unittest -v tests.test_intelligence_follow_search_results_adversarial_v2 `
            2>&1 | Tee-Object -FilePath .ci-results/intelligence-follow-search-results-v2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic unittest discovery
        shell: pwsh
        run: |
          python -m unittest discover -v 2>&1 | Tee-Object -FilePath .ci-results/full-hermetic-unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
