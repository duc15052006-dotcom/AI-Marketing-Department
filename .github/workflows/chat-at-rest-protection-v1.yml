name: Chat At-Rest Protection V1

on:
  pull_request:
    paths:
      - "chat/**"
      - "integrations/models/secret_store.py"
      - "tests/test_chat_at_rest_protection_adversarial_v1.py"
      - ".github/workflows/chat-at-rest-protection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-at-rest-protection-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-at-rest-protection-v1:
    name: Chat payload at-rest protection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_head="$(git rev-parse HEAD)"
          echo "expected_head_sha=$expected_head"
          echo "actual_head_sha=$actual_head"
          test "$actual_head" = "$expected_head"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Run chat at-rest adversarial regression
        shell: bash
        run: python -m unittest -v tests.test_chat_at_rest_protection_adversarial_v1
