name: Chat At-Rest Protection V1

on:
  pull_request:
    paths:
      - "chat/**"
      - "integrations/models/secret_store.py"
      - "tests/test_chat_at_rest_protection_adversarial_v1.py"
      - ".github/workflows/chat-at-rest-protection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-at-rest-protection-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-at-rest-protection-v1:
    name: Chat payload at-rest protection
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: pwsh
        run: |
          $expectedHead = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actualHead = (git rev-parse HEAD).Trim()
          Write-Host "expected_head_sha=$expectedHead"
          Write-Host "actual_head_sha=$actualHead"
          if ($actualHead -ne $expectedHead) {
            throw "CI checkout does not match expected PR head"
          }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Run chat at-rest adversarial regression
        shell: pwsh
        run: python -m unittest -v tests.test_chat_at_rest_protection_adversarial_v1
