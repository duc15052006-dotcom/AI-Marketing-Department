name: Apply Runtime Creative Adaptive Proposal V1

on:
  push:
    branches:
      - feat/runtime-creative-adaptive-proposal-v1
    paths:
      - ".github/workflows/runtime-creative-adaptive-proposal-apply-v1.yml"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-production-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD:runtime/engine.py)" = "1be3a2eae637dc4c7da13dfaf6cf7eaed749e840"

      - name: Apply exact Creative proposal integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")

          insertion_anchor = "        # Dynamic LLM Creative Synthesis\n"
          if text.count(insertion_anchor) != 1:
              raise SystemExit(f"unexpected Creative synthesis anchor count: {text.count(insertion_anchor)}")

          integration = '''        # Adaptive CMO proposal consumption for Creative remains recommendation-only.\n        # The failed-Strategist gate above is authoritative and is evaluated before\n        # proposal compilation so model output can never bypass stage ordering.\n        cmo_stage_output = context.stage_outputs.get("cmo_initial", {})\n        raw_adaptive_proposals = (\n            cmo_stage_output.get("adaptive_task_proposals")\n            if isinstance(cmo_stage_output, dict)\n            else None\n        )\n        compiled_adaptive_plan = AdaptiveTaskCompiler().compile(raw_adaptive_proposals)\n        creative_tasks = tuple(\n            task\n            for task in compiled_adaptive_plan.tasks\n            if task.task_kind == "creative.angles" and task.agent_id == "creative"\n        )\n        creative_task = creative_tasks[0] if creative_tasks else None\n        creative_focus = (\n            creative_task.instruction[:_MAX_ADAPTIVE_TASK_INSTRUCTION_CHARS].strip()\n            if creative_task and creative_task.instruction\n            else ""\n        )\n        context.working_state["creative_adaptive_task_plan"] = {\n            "mode": "TRUSTED_CMO_PROPOSAL" if creative_task else "DEFAULT_STAGE_POLICY",\n            "selected_task_kind": creative_task.task_kind if creative_task else None,\n            "selected_task_id": creative_task.task_id if creative_task else None,\n            "runtime_dependencies": sorted(creative_task.depends_on) if creative_task else [],\n            "rejected_kinds": list(compiled_adaptive_plan.rejected_kinds),\n        }\n\n'''
          text = text.replace(insertion_anchor, integration + insertion_anchor, 1)

          old_prompt = '''        strat_pos = context.stage_outputs.get("strategist", {}).get("positioning", "")\n        evidence_section = grounded_pkg.render_prompt_section()\n        user_prompt = f"Objective: {context.objective}\\nPositioning Strategy: {strat_pos}\\n\\n{evidence_section}".strip()\n'''
          new_prompt = '''        strat_pos = context.stage_outputs.get("strategist", {}).get("positioning", "")\n        evidence_section = grounded_pkg.render_prompt_section()\n        prompt_parts = [\n            f"Objective: {context.objective}",\n            f"Positioning Strategy: {strat_pos}",\n        ]\n        if creative_focus:\n            prompt_parts.append(\n                "CMO Adaptive Task Focus (model recommendation, not authority): "\n                + creative_focus\n            )\n        prompt_parts.append(evidence_section)\n        user_prompt = "\\n\\n".join(prompt_parts).strip()\n'''
          if text.count(old_prompt) != 1:
              raise SystemExit(f"unexpected Creative prompt anchor count: {text.count(old_prompt)}")
          text = text.replace(old_prompt, new_prompt, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify production patch scope
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "runtime/engine.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile patched engine
        run: python -m py_compile runtime/engine.py

      - name: Run targeted regressions before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_creative_adaptive_proposal_v1 \
            tests.test_runtime_strategist_adaptive_proposal_v1 \
            tests.test_runtime_cmo_adaptive_task_proposals_v1 \
            tests.test_runtime_dependency_scheduler_v1

      - name: Commit production integration and remove temporary apply workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git rm .github/workflows/runtime-creative-adaptive-proposal-apply-v1.yml
          git commit -m "feat(runtime): consume trusted Creative proposal"
          git push origin HEAD:feat/runtime-creative-adaptive-proposal-v1
