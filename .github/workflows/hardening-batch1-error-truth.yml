name: Hardening Batch 1 - Error Truth

on:
  push:
    branches:
      - phase/full-hardening-v2

permissions:
  contents: write

concurrency:
  group: hardening-batch1-error-truth
  cancel-in-progress: true

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Apply batch1 patch
        run: python scripts/batch1_error_truth.py

      - name: Compile touched production modules
        run: python -m compileall -q integrations/models runtime chat app_api

      - name: Focused batch1 tests
        run: |
          pytest -q \
            tests/test_batch1_error_truth.py \
            tests/test_prod_vietnamese_input_tolerance_01.py::TestVietnameseInputTolerance01::test_13_chat_engine_error_sanitization_no_winerror_leak \
            tests/test_prod_vietnamese_input_tolerance_01.py::TestVietnameseInputTolerance01::test_15_arbitrary_query_does_not_receive_fake_offline_success \
            tests/test_prod_structured_provider_stream_error_01.py

      - name: Security grep
        run: |
          ! grep -n 'safe_msg = meta.get("safe_message") or sanitize_secrets(response.error' integrations/models/gateway.py
          ! grep -n 'clean_err = sanitize_secrets(response.error' integrations/models/gateway.py
          git diff --check

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: prevent raw provider details from reaching public chat errors"
            git push origin HEAD:phase/full-hardening-v2
          fi
