name: Runtime Tool Idempotency Cache Concurrency V1

on:
  pull_request:
    paths:
      - "runtime/engine.py"
      - "tests/test_runtime_tool_idempotency_cache_concurrency_v1.py"
      - ".github/workflows/runtime-tool-idempotency-cache-concurrency-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-idempotency-cache-concurrency-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact head identity
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tool idempotency cache concurrency regression
        run: python -m unittest -v tests.test_runtime_tool_idempotency_cache_concurrency_v1
