name: Maintenance Patch Bool10

on:
  push:
    branches:
      - fix/governance-bool-hardening-10

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow governance patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('integrations/models/settings_manager.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''    normalize_agent_id,\n    validate_base_url,\n)'''
          new_import = '''    normalize_agent_id,\n    validate_base_url,\n    validate_strict_bool,\n)'''
          assert old_import in text, 'registry import anchor changed'
          text = text.replace(old_import, new_import, 1)

          old_post = '''    def __post_init__(self) -> None:\n        super().__post_init__()\n        # Normalize global target'''
          new_post = '''    def __post_init__(self) -> None:\n        super().__post_init__()\n        try:\n            self.free_only_mode = validate_strict_bool(\n                self.free_only_mode,\n                "ModelSettings.free_only_mode",\n            )\n        except ValueError as exc:\n            raise ModelSettingsValidationError(str(exc)) from exc\n\n        # Normalize global target'''
          assert old_post in text, 'ModelSettings post-init anchor changed'
          text = text.replace(old_post, new_post, 1)

          old_update = '''            if "free_only_mode" in updates:\n                current_dict["free_only_mode"] = bool(updates["free_only_mode"])'''
          new_update = '''            if "free_only_mode" in updates:\n                # Preserve the caller value until ModelSettings validation.\n                # Never coerce None/strings/integers through Python truthiness: an\n                # invalid value such as None must not silently disable FREE_ONLY.\n                current_dict["free_only_mode"] = updates["free_only_mode"]'''
          assert old_update in text, 'free_only update anchor changed'
          text = text.replace(old_update, new_update, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_governance_bool_hardening_10.py')
          test.write_text('''import json\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom integrations.models.settings_manager import (\n    ModelSettings,\n    ModelSettingsManager,\n    ModelSettingsValidationError,\n    PersistedSettingsCorruptionError,\n)\n\n\nclass GovernanceBoolHardening10Tests(unittest.TestCase):\n    def test_model_settings_accepts_real_booleans(self):\n        self.assertIs(ModelSettings(free_only_mode=True).free_only_mode, True)\n        self.assertIs(ModelSettings(free_only_mode=False).free_only_mode, False)\n\n    def test_model_settings_rejects_non_boolean_free_only_values(self):\n        for bad in (None, "", "false", "true", 0, 1, [], {}):\n            with self.subTest(value=bad):\n                with self.assertRaises(ModelSettingsValidationError):\n                    ModelSettings(free_only_mode=bad)\n\n    def test_persisted_non_boolean_free_only_fails_closed(self):\n        with tempfile.TemporaryDirectory() as td:\n            path = Path(td) / "model_settings.json"\n            path.write_text(json.dumps({"free_only_mode": None}), encoding="utf-8")\n            with self.assertRaises(PersistedSettingsCorruptionError):\n                ModelSettingsManager(settings_file_path=path)\n\n    def test_update_non_boolean_cannot_disable_free_only(self):\n        with tempfile.TemporaryDirectory() as td:\n            path = Path(td) / "model_settings.json"\n            mgr = ModelSettingsManager(settings_file_path=path)\n            before = mgr.get_settings()\n            self.assertIs(before.free_only_mode, True)\n\n            for bad in (None, "", "false", "true", 0, 1):\n                with self.subTest(value=bad):\n                    with self.assertRaises(ModelSettingsValidationError):\n                        mgr.update_settings(\n                            {"free_only_mode": bad},\n                            expected_revision=before.settings_revision,\n                        )\n                    after = mgr.get_settings()\n                    self.assertIs(after.free_only_mode, True)\n                    self.assertEqual(after.settings_revision, before.settings_revision)\n\n    def test_update_real_false_is_explicitly_allowed(self):\n        with tempfile.TemporaryDirectory() as td:\n            path = Path(td) / "model_settings.json"\n            mgr = ModelSettingsManager(settings_file_path=path)\n            before = mgr.get_settings()\n            after = mgr.update_settings(\n                {"free_only_mode": False},\n                expected_revision=before.settings_revision,\n            )\n            self.assertIs(after.free_only_mode, False)\n            self.assertEqual(after.settings_revision, before.settings_revision + 1)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          Path('.github/workflows/_maintenance_patch_bool10.yml').unlink()
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/settings_manager.py tests/test_governance_bool_hardening_10.py .github/workflows/_maintenance_patch_bool10.yml
          git commit -m "fix: reject malformed free-only governance booleans"
          git push origin HEAD:fix/governance-bool-hardening-10
