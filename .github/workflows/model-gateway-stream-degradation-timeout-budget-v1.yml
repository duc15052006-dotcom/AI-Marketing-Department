name: Model Gateway Stream Degradation Timeout Budget V1

on:
  push:
    branches:
      - test/model-gateway-stream-degradation-timeout-budget-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-gateway-stream-degradation-timeout-budget-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    name: Ubuntu Python 3.12 apply stream degradation timeout fix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        run: |
          echo "github_sha=${{ github.sha }}"
          echo "github_ref=${{ github.ref }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply exact minimal gateway patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")
          marker = "degradation_remaining_timeout = total_timeout - (time.perf_counter() - start_time)"
          if marker in text:
              print("Production fix already present; no patch needed.")
              raise SystemExit(0)

          old = '''                if first_delta.finish_reason == "stream_unsupported" and first_delta.content == "" and not candidate_visible_content:\n                    try:\n                        sync_resp = adapter.generate(req_copy)\n'''
          new = '''                if first_delta.finish_reason == "stream_unsupported" and first_delta.content == "" and not candidate_visible_content:\n                    degradation_remaining_timeout = total_timeout - (time.perf_counter() - start_time)\n                    if degradation_remaining_timeout <= 0.001:\n                        timeout_err = ModelStreamError(\n                            code="TIMEOUT",\n                            category="TIMEOUT",\n                            safe_message=f"TIMEOUT: Gateway timeout budget exhausted before synchronous degradation for '{cand_provider}'.",\n                            retryable=True,\n                            http_status=408,\n                        )\n                        last_error = timeout_err\n                        last_error_provider = cand_provider\n                        last_error_model = cand_model\n                        if strict_model_pin or len(candidates) == 1:\n                            yield normalize_public_stream_delta(\n                                StreamDelta(content="", finish_reason="error", error=timeout_err),\n                                cand_provider,\n                                cand_model,\n                            )\n                            return\n                        continue\n\n                    req_copy.timeout_seconds = max(\n                        min(float(req_copy.timeout_seconds), degradation_remaining_timeout),\n                        0.001,\n                    )\n                    try:\n                        sync_resp = adapter.generate(req_copy)\n'''
          if old not in text:
              raise SystemExit("stream_unsupported degradation locator not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Applied stream degradation timeout budget patch.")
          PY

      - name: Compile causal sources
        run: python -m compileall -q integrations/models tests/test_model_gateway_stream_degradation_timeout_budget_v1.py

      - name: Run causal regression
        run: python -m unittest -v tests.test_model_gateway_stream_degradation_timeout_budget_v1

      - name: Show production diff
        run: git diff -- integrations/models/gateway.py

      - name: Commit production fix when needed
        run: |
          if git diff --quiet -- integrations/models/gateway.py; then
            echo "Production fix already present on this exact head."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): bound stream sync degradation by total timeout"
          git push origin HEAD:${GITHUB_REF_NAME}
