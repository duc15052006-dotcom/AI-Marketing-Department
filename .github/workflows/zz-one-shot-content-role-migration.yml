name: One-shot Content Role Migration

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
    paths:
      - '.github/workflows/zz-one-shot-content-role-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - name: Apply canonical Content migration
        run: python .github/scripts/zz_migrate_content_role.py

      - name: Compile migrated sources
        run: python -m compileall -q runtime integrations brain tests

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git commit -m "fix(runtime): preserve CMO strategy authority across Content handoff"
          git push origin HEAD:fix/brain-content-canonical-role-v1

# one-shot revision: semantic-authority-v2
