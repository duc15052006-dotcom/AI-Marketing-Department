name: Convergence Backend Lifecycle Hotfix

on:
  pull_request:
    branches:
      - integration/brain-nonbrain-convergence-v1
    paths:
      - ".github/workflows/convergence-backend-lifecycle-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-convergence-head:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/brain-nonbrain-mergework-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering convergence SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify branch and stale-run guards
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "integration/brain-nonbrain-mergework-v1"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch origin integration/brain-nonbrain-mergework-v1
          test "$(git rev-parse origin/integration/brain-nonbrain-mergework-v1)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" != "main"

      - name: Apply idempotent convergence hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once_or_keep(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(f"{label} mismatch; refusing unsafe patch")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Production composition durability + restart recovery + canonical ID
          # ------------------------------------------------------------------
          server_path = Path("app_api/server.py")
          server = server_path.read_text(encoding="utf-8")
          old_job_path = '''def get_job_store_file_path() -> Path:\n    """Return the durable queue database in the canonical per-user runtime directory."""\n    return get_backend_state_file_path().with_name("jobs.sqlite3")\n'''
          receipt_path = '''def get_receipt_store_file_path() -> Path:\n    """Return the durable execution receipt / intent journal database path."""\n    return get_backend_state_file_path().with_name("execution_receipts.sqlite3")\n'''
          if receipt_path not in server:
              if server.count(old_job_path) != 1:
                  raise SystemExit("job path helper mismatch; refusing unsafe receipt-path patch")
              server = server.replace(old_job_path, old_job_path + "\n\n" + receipt_path, 1)

          receipt_legacy = "        self.receipt_repo = ExecutionReceiptRepository()\n"
          receipt_durable = "        self.receipt_repo = ExecutionReceiptRepository(\n            database_path=get_receipt_store_file_path()\n        )\n"
          receipt_recovered = receipt_durable + "        self.execution_recovery_assessments = (\n            self.receipt_repo.reconcile_unfinished_intents()\n        )\n"
          if receipt_recovered not in server:
              if receipt_durable in server:
                  server = server.replace(receipt_durable, receipt_recovered, 1)
              elif receipt_legacy in server:
                  server = server.replace(receipt_legacy, receipt_recovered, 1)
              else:
                  raise SystemExit("receipt repository composition mismatch; refusing unsafe patch")

          close_legacy = '''        self.run_manager.shutdown(wait=True, cancel_pending=True)\n        self.job_repository.close()\n        self.provider_preflight_repository.close()\n        self.provider_operation_repository.close()\n        self.connection_manager.close()\n        self.dynamic_tool_gateway.close()\n'''
          close_repo_hardened = '''        self.run_manager.shutdown(wait=True, cancel_pending=True)\n        for repository in (self.learning_repo, self.memory_repo, self.knowledge_repo):\n            close_repository = getattr(repository, "close", None)\n            if callable(close_repository):\n                close_repository()\n        self.job_repository.close()\n        self.provider_preflight_repository.close()\n        self.provider_operation_repository.close()\n        self.connection_manager.close()\n        self.dynamic_tool_gateway.close()\n'''
          close_final = '''        self.run_manager.shutdown(wait=True, cancel_pending=True)\n        for repository in (self.learning_repo, self.memory_repo, self.knowledge_repo):\n            close_repository = getattr(repository, "close", None)\n            if callable(close_repository):\n                close_repository()\n        self.job_repository.close()\n        self.provider_preflight_repository.close()\n        self.provider_operation_repository.close()\n        self.connection_manager.close()\n        self.dynamic_tool_gateway.close()\n        self.receipt_repo.close()\n'''
          if close_final not in server:
              if close_repo_hardened in server:
                  server = server.replace(close_repo_hardened, close_final, 1)
              elif close_legacy in server:
                  server = server.replace(close_legacy, close_final, 1)
              else:
                  raise SystemExit("backend close block mismatch; refusing unsafe lifecycle patch")

          old_agents = '"permanent_agents": ["cmo", "intelligence", "strategist", "creative", "performance"]'
          new_agents = '"permanent_agents": ["cmo", "intelligence", "content", "creative", "performance"]'
          if new_agents not in server:
              if server.count(old_agents) != 1:
                  raise SystemExit("canonical agent status block mismatch; refusing unsafe patch")
              server = server.replace(old_agents, new_agents, 1)
          server_path.write_text(server, encoding="utf-8")

          # ------------------------------------------------------------
          # Runtime transient-cache, pause/resume, cancellation isolation
          # ------------------------------------------------------------
          engine_path = Path("runtime/engine.py")
          engine = engine_path.read_text(encoding="utf-8")

          engine = replace_once_or_keep(
              engine,
              '''        self._lock = threading.Lock()\n        self._active_contexts: Dict[str, RuntimeContext] = {}\n''',
              '''        self._lock = threading.Lock()\n        self._run_state_condition = threading.Condition(self._lock)\n        self._active_contexts: Dict[str, RuntimeContext] = {}\n''',
              "runtime run-state condition",
          )

          old_control = '''    def cancel_run(self, run_id: str) -> bool:\n        """Mark an active run as CANCELLED to prevent subsequent stage execution."""\n        with self._lock:\n            self._cancelled_run_ids.add(run_id)\n            if run_id in self._active_contexts:\n                ctx = self._active_contexts[run_id]\n                ctx.status = RuntimeStatus.CANCELLED\n                ctx.create_checkpoint()\n                return True\n            return False\n\n    def is_cancelled(self, run_id: str) -> bool:\n'''
          new_control = '''    def pause_run(\n        self,\n        run_id: str,\n        *,\n        working_state_updates: Optional[Dict[str, Any]] = None,\n    ) -> bool:\n        """Cooperatively pause an active run at the next stage boundary."""\n        with self._run_state_condition:\n            ctx = self._active_contexts.get(run_id)\n            if ctx is None or ctx.status in (\n                RuntimeStatus.COMPLETED, RuntimeStatus.FAILED, RuntimeStatus.CANCELLED\n            ):\n                return False\n            if working_state_updates:\n                ctx.working_state.update(dict(working_state_updates))\n            if ctx.status != RuntimeStatus.PAUSED:\n                ctx.status = RuntimeStatus.PAUSED\n                ctx.create_checkpoint()\n            self._run_state_condition.notify_all()\n            return True\n\n    def resume_run(self, run_id: str) -> bool:\n        """Resume a cooperatively paused active run."""\n        with self._run_state_condition:\n            ctx = self._active_contexts.get(run_id)\n            if ctx is None or ctx.status != RuntimeStatus.PAUSED:\n                return False\n            ctx.status = RuntimeStatus.RUNNING\n            ctx.create_checkpoint()\n            self._run_state_condition.notify_all()\n            return True\n\n    def cancel_run(self, run_id: str, reason: str = "Cancelled by operator") -> bool:\n        """Cancel an active run and wake a worker blocked in pause."""\n        with self._run_state_condition:\n            self._cancelled_run_ids.add(run_id)\n            ctx = self._active_contexts.get(run_id)\n            if ctx is None:\n                self._run_state_condition.notify_all()\n                return False\n            ctx.status = RuntimeStatus.CANCELLED\n            if reason:\n                ctx.working_state["cancellation_reason"] = str(reason)\n            ctx.create_checkpoint()\n            self._run_state_condition.notify_all()\n            return True\n\n    def _wait_if_paused(self, context: RuntimeContext) -> bool:\n        """Block only between stages; return True when cancellation wins."""\n        with self._run_state_condition:\n            while (\n                context.status == RuntimeStatus.PAUSED\n                and context.run_id not in self._cancelled_run_ids\n            ):\n                self._run_state_condition.wait()\n            return (\n                context.run_id in self._cancelled_run_ids\n                or context.status == RuntimeStatus.CANCELLED\n            )\n\n    def is_cancelled(self, run_id: str) -> bool:\n'''
          engine = replace_once_or_keep(engine, old_control, new_control, "runtime cooperative control plane")

          old_check = '''        def _check_cancellation() -> bool:\n            if self.is_cancelled(context.run_id) or context.status == RuntimeStatus.CANCELLED:\n                context.status = RuntimeStatus.CANCELLED\n                return True\n            return False\n'''
          new_check = '''        def _check_cancellation() -> bool:\n            if self._wait_if_paused(context):\n                context.status = RuntimeStatus.CANCELLED\n                return True\n            if self.is_cancelled(context.run_id) or context.status == RuntimeStatus.CANCELLED:\n                context.status = RuntimeStatus.CANCELLED\n                return True\n            return False\n'''
          engine = replace_once_or_keep(engine, old_check, new_check, "execute-run cooperative pause gate")

          old_helper_anchor = '''        return self.tool_gateway.execute(request, **semantic_kwargs)\n\n\n    @staticmethod\n    def _ordered_unique_scope_keys(values: List[str]) -> List[str]:\n'''
          new_helper_anchor = '''        return self.tool_gateway.execute(request, **semantic_kwargs)\n\n    def _get_cached_tool_receipt(self, key: str) -> Optional[ExecutionReceipt]:\n        """Read one run-scoped tool receipt cache entry under runtime lock."""\n        with self._lock:\n            return self._executed_tool_idempotency_keys.get(key)\n\n    def _cache_tool_receipt(self, key: str, receipt: ExecutionReceipt) -> None:\n        """Publish one run-scoped tool receipt cache entry under runtime lock."""\n        with self._lock:\n            self._executed_tool_idempotency_keys[key] = receipt\n\n    @staticmethod\n    def _ordered_unique_scope_keys(values: List[str]) -> List[str]:\n'''
          engine = replace_once_or_keep(engine, old_helper_anchor, new_helper_anchor, "runtime cache helper anchor")

          cache_patterns = [
              ('''            if page_idem_key in self._executed_tool_idempotency_keys:\n                page_receipt = self._executed_tool_idempotency_keys[page_idem_key]\n            else:\n''', '''            page_receipt = self._get_cached_tool_receipt(page_idem_key)\n            if page_receipt is None:\n''', '''                self._executed_tool_idempotency_keys[page_idem_key] = page_receipt\n''', '''                self._cache_tool_receipt(page_idem_key, page_receipt)\n''', "read-page tool cache"),
              ('''        if idem_key in self._executed_tool_idempotency_keys:\n            search_receipt = self._executed_tool_idempotency_keys[idem_key]\n        else:\n''', '''        search_receipt = self._get_cached_tool_receipt(idem_key)\n        if search_receipt is None:\n''', '''            self._executed_tool_idempotency_keys[idem_key] = search_receipt\n''', '''            self._cache_tool_receipt(idem_key, search_receipt)\n''', "search tool cache"),
              ('''        if idem_key in self._executed_tool_idempotency_keys:\n            img_receipt = self._executed_tool_idempotency_keys[idem_key]\n        else:\n''', '''        img_receipt = self._get_cached_tool_receipt(idem_key)\n        if img_receipt is None:\n''', '''            self._executed_tool_idempotency_keys[idem_key] = img_receipt\n''', '''            self._cache_tool_receipt(idem_key, img_receipt)\n''', "creative tool cache"),
              ('''        if idem_key in self._executed_tool_idempotency_keys:\n            analytics_receipt = self._executed_tool_idempotency_keys[idem_key]\n        else:\n''', '''        analytics_receipt = self._get_cached_tool_receipt(idem_key)\n        if analytics_receipt is None:\n''', '''            self._executed_tool_idempotency_keys[idem_key] = analytics_receipt\n''', '''            self._cache_tool_receipt(idem_key, analytics_receipt)\n''', "analytics tool cache"),
          ]
          for old_head, new_head, old_set, new_set, label in cache_patterns:
              engine = replace_once_or_keep(engine, old_head, new_head, label + " lookup")
              engine = replace_once_or_keep(engine, old_set, new_set, label + " store")

          engine = replace_once_or_keep(
              engine,
              '''                lineage_summary={"citations": [c.citation_id for c in self.lineage_inspector.get_all_citations()]},\n''',
              '''                lineage_summary={"citations": list(dict.fromkeys(context.knowledge_refs))},\n''',
              "run-scoped artifact lineage",
          )

          old_terminal_cleanup = '''            if context.status in (RuntimeStatus.COMPLETED, RuntimeStatus.FAILED, RuntimeStatus.CANCELLED):\n                self._active_contexts.pop(context.run_id, None)\n                self._cancelled_run_ids.discard(context.run_id)\n\n            return artifact\n'''
          new_terminal_cleanup = '''            if context.status in (RuntimeStatus.COMPLETED, RuntimeStatus.FAILED, RuntimeStatus.CANCELLED):\n                self._active_contexts.pop(context.run_id, None)\n                self._cancelled_run_ids.discard(context.run_id)\n                cache_prefix = f"{context.run_id}:"\n                for cache_key in [\n                    key for key in self._executed_tool_idempotency_keys\n                    if key.startswith(cache_prefix)\n                ]:\n                    self._executed_tool_idempotency_keys.pop(cache_key, None)\n                self.lineage_inspector.remove_receipts_for_run(context.run_id)\n                if not self._active_contexts:\n                    self.lineage_inspector = LineageInspector()\n\n            return artifact\n'''
          engine = replace_once_or_keep(engine, old_terminal_cleanup, new_terminal_cleanup, "terminal run isolation cleanup")
          engine_path.write_text(engine, encoding="utf-8")

          # ----------------------------------------------------------
          # Operator control plane delegates status authority to runtime
          # ----------------------------------------------------------
          operator_path = Path("workspace/operator.py")
          operator = operator_path.read_text(encoding="utf-8")
          old_reject = '''    def reject_gated_action(self, run_id: str, reason: str = "Rejected by operator") -> bool:\n        """Record human rejection of a gated action."""\n        ctx = self.runtime._active_contexts.get(run_id)\n        if not ctx:\n            return False\n        ctx.status = RuntimeStatus.PAUSED\n        ctx.working_state["rejection_reason"] = reason\n        ctx.create_checkpoint()\n        return True\n'''
          new_reject = '''    def reject_gated_action(self, run_id: str, reason: str = "Rejected by operator") -> bool:\n        """Record rejection and cooperatively pause through runtime authority."""\n        return self.runtime.pause_run(\n            run_id,\n            working_state_updates={"rejection_reason": reason},\n        )\n'''
          operator = replace_once_or_keep(operator, old_reject, new_reject, "operator rejection control")

          old_controls = '''    def pause_run(self, run_id: str) -> bool:\n        ctx = self.runtime._active_contexts.get(run_id)\n        if not ctx:\n            return False\n        ctx.status = RuntimeStatus.PAUSED\n        ctx.create_checkpoint()\n        return True\n\n    def resume_run(self, run_id: str) -> bool:\n        ctx = self.runtime._active_contexts.get(run_id)\n        if not ctx:\n            return False\n        ctx.status = RuntimeStatus.RUNNING\n        ctx.create_checkpoint()\n        return True\n\n    def cancel_run(self, run_id: str, reason: str = "Cancelled by operator") -> bool:\n        ctx = self.runtime._active_contexts.get(run_id)\n        if not ctx:\n            return False\n        ctx.status = RuntimeStatus.CANCELLED\n        ctx.working_state["cancellation_reason"] = reason\n        ctx.create_checkpoint()\n        return True\n'''
          new_controls = '''    def pause_run(self, run_id: str) -> bool:\n        return self.runtime.pause_run(run_id)\n\n    def resume_run(self, run_id: str) -> bool:\n        return self.runtime.resume_run(run_id)\n\n    def cancel_run(self, run_id: str, reason: str = "Cancelled by operator") -> bool:\n        return self.runtime.cancel_run(run_id, reason=reason)\n'''
          operator = replace_once_or_keep(operator, old_controls, new_controls, "operator pause/resume/cancel delegation")
          operator_path.write_text(operator, encoding="utf-8")

          # ----------------------------------------------------------
          # Deterministic and run-scoped receipt lineage
          # ----------------------------------------------------------
          lineage_path = Path("runtime/lineage.py")
          lineage = lineage_path.read_text(encoding="utf-8")
          lineage = replace_once_or_keep(
              lineage,
              '''from __future__ import annotations\n\nfrom typing import Any, Dict, List, Optional\n''',
              '''from __future__ import annotations\n\nimport hashlib\nfrom typing import Any, Dict, List, Optional\n''',
              "lineage deterministic hash import",
          )
          old_lineage_methods = '''    def get_all_receipts(self) -> List[ExecutionReceipt]:\n        return list(self._receipts_by_id.values())\n\n    def trace_claim_to_receipt(self, claim: str, receipt_id: str) -> LineageTrace:\n        """Trace an assertion back to an underlying tool execution receipt."""\n        trace = LineageTrace(target_claim=claim)\n        receipt = self._receipts_by_id.get(receipt_id)\n\n        if not receipt:\n            trace.valid = False\n            trace.missing_links.append(f"EXECUTION_RECEIPT_NOT_FOUND: {receipt_id}")\n            return trace\n\n        # Build lineage chain\n        trace.chain.append(\n            LineageNode(\n                node_id=f"CLAIM-{hash(claim)}",\n'''
          new_lineage_methods = '''    def get_all_receipts(self) -> List[ExecutionReceipt]:\n        return list(self._receipts_by_id.values())\n\n    def remove_receipts_for_run(self, run_id: str) -> None:\n        """Discard only transient receipt indexes owned by one terminal run."""\n        for execution_id in [\n            execution_id\n            for execution_id, receipt in self._receipts_by_id.items()\n            if receipt.run_id == run_id\n        ]:\n            self._receipts_by_id.pop(execution_id, None)\n\n    @staticmethod\n    def _claim_node_id(claim: str) -> str:\n        digest = hashlib.sha256(str(claim).encode("utf-8")).hexdigest()\n        return f"CLAIM-{digest}"\n\n    def trace_claim_to_receipt(\n        self,\n        claim: str,\n        receipt_id: str,\n        *,\n        run_id: Optional[str] = None,\n    ) -> LineageTrace:\n        """Trace a claim to a receipt, optionally enforcing exact run scope."""\n        trace = LineageTrace(target_claim=claim)\n        receipt = self._receipts_by_id.get(receipt_id)\n\n        if not receipt:\n            trace.valid = False\n            trace.missing_links.append(f"EXECUTION_RECEIPT_NOT_FOUND: {receipt_id}")\n            return trace\n        if run_id is not None and receipt.run_id != run_id:\n            trace.valid = False\n            trace.missing_links.append(\n                f"RUN_SCOPE_MISMATCH: expected {run_id}, got {receipt.run_id}"\n            )\n            return trace\n\n        # Build lineage chain\n        trace.chain.append(\n            LineageNode(\n                node_id=self._claim_node_id(claim),\n'''
          lineage = replace_once_or_keep(lineage, old_lineage_methods, new_lineage_methods, "receipt lineage scoping")
          lineage = replace_once_or_keep(
              lineage,
              '''                node_id=f"CLAIM-{hash(claim)}",\n                node_type="CLAIM",\n                title=claim,\n                parent_ids=[citation.citation_id],\n''',
              '''                node_id=self._claim_node_id(claim),\n                node_type="CLAIM",\n                title=claim,\n                parent_ids=[citation.citation_id],\n''',
              "knowledge lineage deterministic claim id",
          )
          lineage_path.write_text(lineage, encoding="utf-8")

          # Existing approved-publish regression now verifies exact run scope.
          phase_path = Path("tests/test_phase6_1_v1_connectors_and_workspace.py")
          phase = phase_path.read_text(encoding="utf-8")
          phase = replace_once_or_keep(
              phase,
              '''        trace = self.runtime.lineage_inspector.trace_claim_to_receipt("Published Campaign", receipt.execution_id)\n''',
              '''        trace = self.runtime.lineage_inspector.trace_claim_to_receipt(\n            "Published Campaign", receipt.execution_id, run_id=ctx.run_id\n        )\n''',
              "approved-publish run-scoped lineage regression",
          )
          phase_path.write_text(phase, encoding="utf-8")

          # ----------------------------------------------------------
          # Existing durable job-store lifecycle regression extension
          # ----------------------------------------------------------
          job_test_path = Path("tests/test_app_backend_durable_job_store_wiring_adversarial_v1.py")
          job_test = job_test_path.read_text(encoding="utf-8")
          old_env = '            env = {"APPDATA": tmpdir, "LOCALAPPDATA": tmpdir}\n'
          new_env = '''            env = {\n                "APPDATA": tmpdir,\n                "LOCALAPPDATA": tmpdir,\n                "AI_MARKETING_KNOWLEDGE_EPHEMERAL": "0",\n                "AI_MARKETING_MEMORY_EPHEMERAL": "0",\n                "AI_MARKETING_LEARNING_EPHEMERAL": "0",\n            }\n'''
          if new_env not in job_test:
              if job_test.count(old_env) != 1:
                  raise SystemExit("durability test env block mismatch; refusing unsafe patch")
              job_test = job_test.replace(old_env, new_env, 1)
          lifecycle_assertion = '''                for repository in (first.learning_repo, first.memory_repo, first.knowledge_repo):\n                    self.assertIsNone(\n                        getattr(repository, "_connection", None),\n                        "DepartmentAppBackend.close() must release every owned durable SQLite repository.",\n                    )\n'''
          if lifecycle_assertion not in job_test:
              old_first_close = '                first.close()\n\n                second = DepartmentAppBackend()\n'
              if job_test.count(old_first_close) != 1:
                  raise SystemExit("durability first-close block mismatch; refusing unsafe patch")
              job_test = job_test.replace(
                  old_first_close,
                  "                first.close()\n" + lifecycle_assertion + "\n                second = DepartmentAppBackend()\n",
                  1,
              )
          job_test_path.write_text(job_test, encoding="utf-8")

          # ----------------------------------------------------------
          # New adversarial regression tests
          # ----------------------------------------------------------
          Path("tests/test_production_receipt_restart_durability_adversarial_v1.py").write_text('''"""Production composition must persist and conservatively recover execution authority."""\nfrom __future__ import annotations\nimport os, tempfile, unittest\nfrom pathlib import Path\nfrom unittest.mock import patch\nfrom app_api.server import DepartmentAppBackend\nfrom tools.receipts import ExecutionIntentState, ExecutionMode, ExecutionReceipt, ExecutionStatus\n\nclass ProductionReceiptRestartDurabilityAdversarialV1Tests(unittest.TestCase):\n    @staticmethod\n    def _env(tmpdir: str) -> dict[str, str]:\n        return {"APPDATA": tmpdir, "LOCALAPPDATA": tmpdir, "AI_MARKETING_KNOWLEDGE_EPHEMERAL": "0", "AI_MARKETING_MEMORY_EPHEMERAL": "0", "AI_MARKETING_LEARNING_EPHEMERAL": "0"}\n\n    def test_receipt_repository_is_durable_closed_and_recovered(self) -> None:\n        with tempfile.TemporaryDirectory() as tmpdir, patch.dict(os.environ, self._env(tmpdir), clear=False):\n            first = DepartmentAppBackend(); first_repo = first.receipt_repo\n            self.assertTrue(first_repo.durable); self.assertIsNotNone(first_repo.database_path); assert first_repo.database_path is not None\n            self.assertTrue(first_repo.database_path.is_relative_to(Path(tmpdir).resolve()))\n            saved = first_repo.save_receipt(ExecutionReceipt(run_id="RUN-RECEIPT-RESTART-1", agent_id="intelligence", capability_id="web_search", provider="test-provider", request_hash="receipt-restart-hash", status=ExecutionStatus.BLOCKED, execution_mode=ExecutionMode.MOCK, error_class="TEST_BLOCK", error_message="durability probe"))\n            first_path = first_repo.database_path; first.close(); self.assertTrue(first_repo._closed)\n            second = DepartmentAppBackend()\n            try:\n                self.assertTrue(second.receipt_repo.durable); self.assertEqual(second.receipt_repo.database_path, first_path)\n                restored = second.receipt_repo.get_receipt(saved.execution_id); self.assertIsNotNone(restored); assert restored is not None\n                self.assertEqual(restored.run_id, "RUN-RECEIPT-RESTART-1"); self.assertEqual(restored.error_class, "TEST_BLOCK")\n            finally: second.close()\n\n    def test_dispatching_intent_becomes_ambiguous_on_backend_restart_without_replay(self) -> None:\n        with tempfile.TemporaryDirectory() as tmpdir, patch.dict(os.environ, self._env(tmpdir), clear=False):\n            first = DepartmentAppBackend()\n            intent = first.receipt_repo.prepare_execution_intent(request_id="REQ-CRASH-1", run_id="RUN-CRASH-1", agent_id="cmo", capability_id="social_publishing", provider="sandbox", request_hash="crash-hash")\n            first.receipt_repo.mark_execution_intent_dispatching(intent.intent_id)\n            first.close()\n            second = DepartmentAppBackend()\n            try:\n                recovered = second.receipt_repo.get_execution_intent(intent.intent_id); self.assertIsNotNone(recovered); assert recovered is not None\n                self.assertEqual(recovered.state, ExecutionIntentState.AMBIGUOUS)\n                self.assertEqual(recovered.dispatch_count, 1)\n                self.assertTrue(any(a.intent_id == intent.intent_id and a.outcome.value == "AMBIGUOUS_EXTERNAL_ACTION_OUTCOME" for a in second.execution_recovery_assessments))\n                self.assertIsNone(recovered.receipt_execution_id)\n            finally: second.close()\n\nif __name__ == "__main__": unittest.main()\n''', encoding="utf-8")

          Path("tests/test_runtime_run_isolation_cleanup_adversarial_v1.py").write_text('''"""Adversarial regression for run-scoped lineage and transient tool-cache cleanup."""\nfrom __future__ import annotations\nimport os, unittest\nfrom unittest.mock import patch\nfrom knowledge.models import KnowledgeCitation\nfrom runtime.context import RuntimeContext, RuntimeStatus\nfrom runtime.engine import FiveAgentDepartmentRuntime\nfrom tools.capabilities import CapabilityRegistry\nfrom tools.receipts import ExecutionMode, ExecutionReceipt, ExecutionStatus\nfrom tools.tool_gateway import ToolGateway\n\nclass RuntimeRunIsolationCleanupAdversarialV1Tests(unittest.TestCase):\n    @staticmethod\n    def _receipt(run_id: str) -> ExecutionReceipt:\n        return ExecutionReceipt(run_id=run_id, agent_id="intelligence", capability_id="web_search", provider="test", request_hash=f"hash-{run_id}", status=ExecutionStatus.BLOCKED, execution_mode=ExecutionMode.MOCK)\n    def test_completed_artifact_uses_only_context_lineage_and_clears_its_transient_cache(self) -> None:\n        env = {"AI_MARKETING_KNOWLEDGE_EPHEMERAL": "1", "AI_MARKETING_MEMORY_EPHEMERAL": "1", "AI_MARKETING_LEARNING_EPHEMERAL": "1"}\n        with patch.dict(os.environ, env, clear=False):\n            runtime = FiveAgentDepartmentRuntime(tool_gateway=ToolGateway(capability_registry=CapabilityRegistry()))\n            run_id = "RUN-ISOLATION-A"; context = RuntimeContext(run_id=run_id, objective="isolation probe", status=RuntimeStatus.FAILED)\n            context.stage_outputs["final_cmo"] = {"status": "FAILED"}; context.knowledge_refs = ["CIT-CURRENT-RUN"]\n            runtime.lineage_inspector.add_citation(KnowledgeCitation(citation_id="CIT-OTHER-RUN", knowledge_id="KNOW-OTHER")); runtime._active_contexts[run_id] = context\n            own_key = f"{run_id}:intelligence:web_search:isolation probe"; other_key = "RUN-ISOLATION-B:intelligence:web_search:other"\n            runtime._executed_tool_idempotency_keys[own_key] = self._receipt(run_id); runtime._executed_tool_idempotency_keys[other_key] = self._receipt("RUN-ISOLATION-B")\n            artifact = runtime.complete_run(context)\n            self.assertEqual(artifact.lineage_summary.get("citations"), ["CIT-CURRENT-RUN"]); self.assertNotIn(own_key, runtime._executed_tool_idempotency_keys); self.assertIn(other_key, runtime._executed_tool_idempotency_keys); self.assertEqual(runtime.lineage_inspector.get_all_citations(), [])\n\nif __name__ == "__main__": unittest.main()\n''', encoding="utf-8")

          Path("tests/test_runtime_pause_resume_control_plane_adversarial_v1.py").write_text('''"""Runtime pause/resume must suspend actual stage progression, not only flip an enum."""\nfrom __future__ import annotations\nimport os, threading, unittest\nfrom unittest.mock import patch\nfrom runtime.engine import FiveAgentDepartmentRuntime\nfrom tools.capabilities import CapabilityRegistry\nfrom tools.tool_gateway import ToolGateway\n\nclass RuntimePauseResumeControlPlaneAdversarialV1Tests(unittest.TestCase):\n    @staticmethod\n    def _runtime() -> FiveAgentDepartmentRuntime:\n        return FiveAgentDepartmentRuntime(tool_gateway=ToolGateway(capability_registry=CapabilityRegistry()))\n\n    @staticmethod\n    def _install_stage_probes(runtime, stage1_entered, release_stage1, stage2_entered):\n        def stage1(ctx):\n            stage1_entered.set(); release_stage1.wait(3); ctx.stage_outputs["cmo_initial"] = {"status": "SUCCESS"}; return ctx.stage_outputs["cmo_initial"]\n        def stage2(ctx):\n            stage2_entered.set(); ctx.stage_outputs["intelligence"] = {"status": "SUCCESS"}; return ctx.stage_outputs["intelligence"]\n        def simple(name):\n            def _stage(ctx, *args, **kwargs):\n                ctx.stage_outputs[name] = {"status": "SUCCESS"}; return ctx.stage_outputs[name]\n            return _stage\n        runtime.execute_stage_cmo_initial = stage1\n        runtime.execute_stage_intelligence = stage2\n        runtime.execute_stage_content = simple("content")\n        runtime.execute_stage_creative = simple("creative")\n        runtime.execute_stage_performance = simple("performance")\n        runtime.execute_stage_final_cmo = simple("final_cmo")\n        runtime.complete_run = lambda ctx: object()\n\n    def test_pause_blocks_next_stage_until_resume(self) -> None:\n        env = {"AI_MARKETING_KNOWLEDGE_EPHEMERAL": "1", "AI_MARKETING_MEMORY_EPHEMERAL": "1", "AI_MARKETING_LEARNING_EPHEMERAL": "1"}\n        with patch.dict(os.environ, env, clear=False):\n            runtime = self._runtime(); ctx = runtime.start_run("pause probe")\n            stage1_entered = threading.Event(); release_stage1 = threading.Event(); stage2_entered = threading.Event()\n            self._install_stage_probes(runtime, stage1_entered, release_stage1, stage2_entered)\n            worker = threading.Thread(target=lambda: runtime.execute_run(ctx), daemon=True); worker.start()\n            self.assertTrue(stage1_entered.wait(2)); self.assertTrue(runtime.pause_run(ctx.run_id)); release_stage1.set()\n            self.assertFalse(stage2_entered.wait(0.25), "Stage 2 advanced while run was PAUSED")\n            self.assertTrue(runtime.resume_run(ctx.run_id)); self.assertTrue(stage2_entered.wait(2))\n            worker.join(2); self.assertFalse(worker.is_alive())\n\n    def test_cancel_wakes_paused_worker_without_advancing_next_stage(self) -> None:\n        env = {"AI_MARKETING_KNOWLEDGE_EPHEMERAL": "1", "AI_MARKETING_MEMORY_EPHEMERAL": "1", "AI_MARKETING_LEARNING_EPHEMERAL": "1"}\n        with patch.dict(os.environ, env, clear=False):\n            runtime = self._runtime(); ctx = runtime.start_run("cancel paused probe")\n            stage1_entered = threading.Event(); release_stage1 = threading.Event(); stage2_entered = threading.Event()\n            self._install_stage_probes(runtime, stage1_entered, release_stage1, stage2_entered)\n            worker = threading.Thread(target=lambda: runtime.execute_run(ctx), daemon=True); worker.start()\n            self.assertTrue(stage1_entered.wait(2)); self.assertTrue(runtime.pause_run(ctx.run_id)); release_stage1.set()\n            self.assertFalse(stage2_entered.wait(0.25)); self.assertTrue(runtime.cancel_run(ctx.run_id, reason="test cancel"))\n            worker.join(2); self.assertFalse(worker.is_alive()); self.assertFalse(stage2_entered.is_set())\n\nif __name__ == "__main__": unittest.main()\n''', encoding="utf-8")

          Path("tests/test_runtime_lineage_scope_adversarial_v1.py").write_text('''"""Lineage claim identity must be deterministic and receipt tracing must respect run scope."""\nfrom __future__ import annotations\nimport hashlib, unittest\nfrom runtime.lineage import LineageInspector\nfrom tools.receipts import ExecutionMode, ExecutionReceipt, ExecutionStatus\n\nclass RuntimeLineageScopeAdversarialV1Tests(unittest.TestCase):\n    def test_claim_id_is_deterministic_and_cross_run_receipt_is_rejected(self) -> None:\n        receipt = ExecutionReceipt(run_id="RUN-A", agent_id="cmo", capability_id="social_publishing", provider="sandbox", request_hash="lineage-hash", status=ExecutionStatus.SUCCESS, execution_mode=ExecutionMode.MOCK)\n        inspector = LineageInspector(receipts=[receipt]); claim = "Published Campaign"\n        trace = inspector.trace_claim_to_receipt(claim, receipt.execution_id, run_id="RUN-A")\n        self.assertTrue(trace.valid); self.assertEqual(trace.chain[0].node_id, "CLAIM-" + hashlib.sha256(claim.encode("utf-8")).hexdigest())\n        cross = inspector.trace_claim_to_receipt(claim, receipt.execution_id, run_id="RUN-B")\n        self.assertFalse(cross.valid); self.assertTrue(any("RUN_SCOPE_MISMATCH" in item for item in cross.missing_links))\n        inspector.remove_receipts_for_run("RUN-A"); self.assertEqual(inspector.get_all_receipts(), [])\n\nif __name__ == "__main__": unittest.main()\n''', encoding="utf-8")
