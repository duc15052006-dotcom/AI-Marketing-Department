name: Convergence Backend Lifecycle Hotfix

on:
  pull_request:
    branches:
      - integration/brain-nonbrain-convergence-v1
    paths:
      - ".github/workflows/convergence-backend-lifecycle-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-convergence-head:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/brain-nonbrain-mergework-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout guarded convergence head
        uses: actions/checkout@v4
        with:
          ref: integration/brain-nonbrain-mergework-v1
          fetch-depth: 0

      - name: Verify branch guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "integration/brain-nonbrain-mergework-v1"
          test "$(git branch --show-current)" = "integration/brain-nonbrain-mergework-v1"
          test "$(git branch --show-current)" != "main"

      - name: Apply exact backend lifecycle and canonical-agent fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server_path = Path('app_api/server.py')
          server = server_path.read_text(encoding='utf-8')

          old_close = '''        self.run_manager.shutdown(wait=True, cancel_pending=True)\n        self.job_repository.close()\n        self.provider_preflight_repository.close()\n        self.provider_operation_repository.close()\n        self.connection_manager.close()\n        self.dynamic_tool_gateway.close()\n'''
          new_close = '''        self.run_manager.shutdown(wait=True, cancel_pending=True)\n        for repository in (self.learning_repo, self.memory_repo, self.knowledge_repo):\n            close_repository = getattr(repository, "close", None)\n            if callable(close_repository):\n                close_repository()\n        self.job_repository.close()\n        self.provider_preflight_repository.close()\n        self.provider_operation_repository.close()\n        self.connection_manager.close()\n        self.dynamic_tool_gateway.close()\n'''
          if server.count(old_close) != 1:
              raise SystemExit('backend close block mismatch; refusing unsafe patch')
          server = server.replace(old_close, new_close, 1)

          old_agents = '"permanent_agents": ["cmo", "intelligence", "strategist", "creative", "performance"]'
          new_agents = '"permanent_agents": ["cmo", "intelligence", "content", "creative", "performance"]'
          if server.count(old_agents) != 1:
              raise SystemExit('canonical agent status block mismatch; refusing unsafe patch')
          server = server.replace(old_agents, new_agents, 1)
          server_path.write_text(server, encoding='utf-8')

          test_path = Path('tests/test_app_backend_durable_job_store_wiring_adversarial_v1.py')
          test = test_path.read_text(encoding='utf-8')
          old_env = '            env = {"APPDATA": tmpdir, "LOCALAPPDATA": tmpdir}\n'
          new_env = '''            env = {\n                "APPDATA": tmpdir,\n                "LOCALAPPDATA": tmpdir,\n                "AI_MARKETING_KNOWLEDGE_EPHEMERAL": "0",\n                "AI_MARKETING_MEMORY_EPHEMERAL": "0",\n                "AI_MARKETING_LEARNING_EPHEMERAL": "0",\n            }\n'''
          if test.count(old_env) != 1:
              raise SystemExit('durability test env block mismatch; refusing unsafe patch')
          test = test.replace(old_env, new_env, 1)

          old_first_close = '                first.close()\n\n                second = DepartmentAppBackend()\n'
          new_first_close = '''                first.close()\n                for repository in (first.learning_repo, first.memory_repo, first.knowledge_repo):\n                    self.assertIsNone(\n                        getattr(repository, "_connection", None),\n                        "DepartmentAppBackend.close() must release every owned durable SQLite repository.",\n                    )\n\n                second = DepartmentAppBackend()\n'''
          if test.count(old_first_close) != 1:
              raise SystemExit('durability first-close block mismatch; refusing unsafe patch')
          test = test.replace(old_first_close, new_first_close, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate targeted lifecycle and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app_api/server.py tests/test_app_backend_durable_job_store_wiring_adversarial_v1.py
          python -m unittest -v tests.test_app_backend_durable_job_store_wiring_adversarial_v1

      - name: Remove temporary workflow and commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/convergence-backend-lifecycle-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_api/server.py tests/test_app_backend_durable_job_store_wiring_adversarial_v1.py .github/workflows/convergence-backend-lifecycle-hotfix.yml
          git diff --cached --check
          git commit -m "fix(runtime): release backend repositories on shutdown"
          test "$(git branch --show-current)" = "integration/brain-nonbrain-mergework-v1"
          git push origin HEAD:integration/brain-nonbrain-mergework-v1
