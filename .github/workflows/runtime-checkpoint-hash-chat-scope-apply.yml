name: Runtime Checkpoint Hash Chat Scope Apply

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-checkpoint-hash-chat-scope-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: 1
  PYTHONDONTWRITEBYTECODE: 1
  EXPECTED_CONTEXT_BLOB: "e7d3e1e667a666b4f19386da564236a29f1831f4"
  TARGET_BRANCH: "fix/runtime-checkpoint-hash-chat-scope-v1"

jobs:
  guarded-apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/runtime-checkpoint-hash-chat-scope-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact source identity and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_BLOB="$(git hash-object runtime/context.py)"
          echo "expected_context_blob=$EXPECTED_CONTEXT_BLOB"
          echo "actual_context_blob=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_CONTEXT_BLOB"
          test -z "$(git status --porcelain)"

      - name: Apply one-field production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/context.py")
          text = path.read_text(encoding="utf-8")
          old = '''        pending_approval_id = self.pending_approval_id or ""\n        business_id = self.business_id or ""\n        project_id = self.project_id or ""\n        raw = f"{self.run_id}:{business_id}:{project_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{pending_approval_id}:{working_state_json}"\n'''
          new = '''        pending_approval_id = self.pending_approval_id or ""\n        business_id = self.business_id or ""\n        project_id = self.project_id or ""\n        chat_id = self.chat_id or ""\n        raw = f"{self.run_id}:{business_id}:{project_id}:{chat_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{pending_approval_id}:{working_state_json}"\n'''
          if text.count(old) != 1:
              raise SystemExit(f"PATCH_GUARD_FAILED: expected exactly one hash anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff -- runtime/context.py
          test "$(git diff --name-only | tr -d '\r')" = "runtime/context.py"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile touched production source
        run: python -m py_compile runtime/context.py

      - name: Run guarded targeted regressions
        run: |
          python -m unittest -v \
            tests.test_runtime_checkpoint_hash_chat_scope_v1 \
            tests.test_runtime_checkpoint_hash_project_scope_v1 \
            tests.test_runtime_checkpoint_hash_business_scope_v1 \
            tests.test_runtime_checkpoint_hash_pending_approval_v1 \
            tests.test_runtime_checkpoint_hash_working_state_v1 \
            tests.test_runtime_checkpoint_deep_snapshot_v1 \
            tests.test_structure

      - name: Commit production fix and remove temporary apply workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-checkpoint-hash-chat-scope-apply.yml
          git add runtime/context.py
          echo "staged files:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/runtime-checkpoint-hash-chat-scope-apply.yml runtime/context.py "
          git commit -m "fix(runtime): bind checkpoint hash to chat scope"
          git push origin "HEAD:${TARGET_BRANCH}"
