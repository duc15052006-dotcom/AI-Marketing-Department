name: Runtime TypeError Stage Retry Qualification

on:
  push:
    branches:
      - fix/runtime-typeerror-stage-retry-v1

permissions:
  contents: read

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile touched Python
        run: |
          python -m py_compile runtime/engine.py tests/test_runtime_typeerror_stage_retry_v1.py
      - name: Run targeted regressions
        run: |
          python -m unittest -v \
            tests.test_runtime_typeerror_stage_retry_v1 \
            tests.test_runtime_intelligence_adaptive_fanout_v1

  current-head:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: targeted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Record exact head identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = git rev-parse HEAD
          $expected = "${{ github.sha }}"
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "HEAD_MISMATCH: expected=$expected actual=$actual" }
      - name: Run exact full hermetic discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload current evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-typeerror-stage-retry-current-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  literal-base:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d96b0d697c8bbf0b900b78065c8c2ecd540471fc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Record literal base identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = git rev-parse HEAD
          $expected = "d96b0d697c8bbf0b900b78065c8c2ecd540471fc"
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "BASE_HEAD_MISMATCH: expected=$expected actual=$actual" }
      - name: Run exact baseline full hermetic discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload literal-base evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-typeerror-stage-retry-literal-base-d96b0d6
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
