name: Temporary Performance Inconclusive Auth Patch

on:
  push:
    branches: [fix/performance-inconclusive-auth-14]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/performance-inconclusive-auth-14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Apply exact production patch and regression assertion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          engine_old = '''        blocked = 0

        if self._detect_performance_inconclusive(perf_out):
            blocked += 1
            claim_actions["performance"] = "HOLD"
            blocking_reasons.append(
                "PERFORMANCE_INCONCLUSIVE: Performance reported an inconclusive/"
                "insufficient-evidence result; deployment cannot be authorized."
            )

        # COLLAB-06 / GOV-02: structural (prose-independent) performance state.
        perf_handoff = (context.working_state.get("stage_handoffs", {}) or {}).get("performance", {}) or {}
        if isinstance(perf_handoff, dict):
            if perf_handoff.get("performance_inconclusive"):
                blocked += 1
                blocking_reasons.append(
                    "PERFORMANCE_INCONCLUSIVE_STRUCTURAL: Performance handoff carries an "
                    "INCONCLUSIVE flag; prose cannot override it."
                )
            execution_state = str(perf_handoff.get("experiment_execution_state", "EXPERIMENT_PROPOSED")).upper()
            eval_status = str(perf_handoff.get("evaluation_status", "NOT_EVALUATED")).upper()
            eval_origin = str(perf_handoff.get("evaluation_data_origin", "NO_DATA")).upper()
'''
          engine_new = '''        blocked = 0
        performance_inconclusive_blocked = False

        if self._detect_performance_inconclusive(perf_out):
            blocked += 1
            performance_inconclusive_blocked = True
            claim_actions["performance"] = "HOLD"
            blocking_reasons.append(
                "PERFORMANCE_INCONCLUSIVE: Performance reported an inconclusive/"
                "insufficient-evidence result; deployment cannot be authorized."
            )

        # COLLAB-06 / GOV-02: structural (prose-independent) performance state.
        perf_handoff = (context.working_state.get("stage_handoffs", {}) or {}).get("performance", {}) or {}
        if isinstance(perf_handoff, dict):
            if perf_handoff.get("performance_inconclusive"):
                if not performance_inconclusive_blocked:
                    blocked += 1
                    blocking_reasons.append(
                        "PERFORMANCE_INCONCLUSIVE_STRUCTURAL: Performance handoff carries an "
                        "INCONCLUSIVE flag; prose cannot override it."
                    )
                performance_inconclusive_blocked = True
                claim_actions["performance"] = "HOLD"
            execution_state = str(perf_handoff.get("experiment_execution_state", "EXPERIMENT_PROPOSED")).upper()
            eval_status = str(perf_handoff.get("evaluation_status", "NOT_EVALUATED")).upper()
            eval_origin = str(perf_handoff.get("evaluation_data_origin", "NO_DATA")).upper()

            if eval_status == "INCONCLUSIVE" and not performance_inconclusive_blocked:
                blocked += 1
                performance_inconclusive_blocked = True
                claim_actions["performance"] = "HOLD"
                blocking_reasons.append(
                    "PERFORMANCE_EVALUATION_INCONCLUSIVE_STRUCTURAL: Performance evaluation is "
                    "structurally INCONCLUSIVE; deployment cannot be authorized."
                )
'''
          replace_once('runtime/engine.py', engine_old, engine_new)

          test_old = '''        self.assertIn(f"creative_id: {ctx.working_state['creative_spec']['creative_id']}", final_prompt)
        self.assertEqual(final_out["approval_status"], "BLOCKED")
'''
          test_new = '''        self.assertIn(f"creative_id: {ctx.working_state['creative_spec']['creative_id']}", final_prompt)
        self.assertEqual(final_out["approval_status"], "BLOCKED")
        self.assertEqual(final_out["status"], "NOT_READY")
        reasons = " ".join(final_out["claim_audit"]["blocking_reasons"])
        self.assertIn("PERFORMANCE_EVALUATION_INCONCLUSIVE_STRUCTURAL", reasons)
'''
          replace_once('tests/test_creative_performance_true_handoff.py', test_old, test_new)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile runtime/engine.py tests/test_creative_performance_true_handoff.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat
      - name: Run targeted governance regressions
        shell: pwsh
        env:
          RUN_LIVE_PROVIDER_TESTS: '0'
          RUN_REAL_MODEL_TEST: '0'
          RUN_LIVE_MODEL_TESTS: '0'
        run: |
          python -m unittest -v `
            tests.test_creative_performance_true_handoff `
            tests.test_structured_epistemic_handoff `
            tests.test_collaboration_adversarial_final `
            tests.test_prod_core_authority_01a
      - name: Commit tested patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py tests/test_creative_performance_true_handoff.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: block structurally inconclusive performance evaluation"
          git push origin HEAD:fix/performance-inconclusive-auth-14
