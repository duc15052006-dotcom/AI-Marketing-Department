name: Runtime Persistent Worker Wake Cycle V1

on:
  pull_request:
    paths:
      - "runtime/mission.py"
      - "runtime/mission_store.py"
      - "runtime/mission_scheduler.py"
      - "runtime/mission_lease.py"
      - "runtime/mission_dispatch.py"
      - "runtime/mission_checkpoint.py"
      - "runtime/persistent_worker.py"
      - "tests/test_runtime_persistent_worker_wake_cycle_v1.py"
      - ".github/workflows/runtime-persistent-worker-wake-cycle-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
  AI_MARKETING_MEMORY_EPHEMERAL: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  persistent-worker-wake-cycle:
    name: persistent-worker-wake-cycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact head identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = (git rev-parse HEAD).Trim()
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          "expected=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "exact-head mismatch: expected=$expected actual=$actual" }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile persistent-worker contract and adjacent runtime
        shell: pwsh
        run: |
          $files = @(
            "runtime/mission.py",
            "runtime/mission_store.py",
            "runtime/mission_scheduler.py",
            "runtime/mission_lease.py",
            "runtime/mission_dispatch.py",
            "runtime/mission_checkpoint.py",
            "tests/test_runtime_persistent_worker_wake_cycle_v1.py"
          )
          if (Test-Path "runtime/persistent_worker.py") {
            $files += "runtime/persistent_worker.py"
          }
          python -m py_compile $files 2>&1 | Tee-Object -FilePath .ci-results/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run persistent worker wake-cycle contract
        id: targeted
        continue-on-error: true
        shell: pwsh
        run: |
          python -m unittest -v tests.test_runtime_persistent_worker_wake_cycle_v1 2>&1 | Tee-Object -FilePath .ci-results/targeted.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run adjacent Mission continuity regressions
        shell: pwsh
        run: |
          python -m unittest -v tests.test_runtime_durable_mission_checkpoint_v1 tests.test_runtime_fenced_mission_persistence_v1 tests.test_runtime_mission_wake_dispatch_v1 tests.test_runtime_durable_mission_lease_v1 tests.test_runtime_durable_mission_scheduler_v1 tests.test_runtime_mission_store_durability_v1 2>&1 | Tee-Object -FilePath .ci-results/adjacent.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run canonical full hermetic unittest discovery
        if: runner.os == 'Windows' && steps.targeted.outcome == 'success'
        timeout-minutes: 45
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath .ci-results/full-unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exact-head persistent-worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-persistent-worker-wake-cycle-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Enforce persistent worker wake-cycle gate
        if: always()
        shell: pwsh
        run: |
          $outcome = "${{ steps.targeted.outcome }}"
          if ($outcome -ne "success") {
            throw "Persistent worker wake-cycle contract is RED: targeted outcome=$outcome"
          }
