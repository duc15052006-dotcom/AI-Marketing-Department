name: Production Marketing Catalog Wiring V1

on:
  pull_request:
    paths:
      - "app_api/server.py"
      - "tests/test_app_backend_durable_job_store_wiring_adversarial_v1.py"
      - "tests/test_production_marketing_catalog_wiring_adversarial_v1.py"
      - ".github/workflows/production-marketing-catalog-wiring-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-marketing-catalog-wiring-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-marketing-catalog:
    name: Production marketing catalog (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      AI_MARKETING_MEMORY_EPHEMERAL: "1"
      AI_MARKETING_LEARNING_EPHEMERAL: "1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_head_sha=${expected}"
          echo "actual_head_sha=${actual}"
          test "${actual}" = "${expected}"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile and run production marketing catalog regressions
        run: |
          python -m compileall -q app_api connectors connections tools tests/test_production_marketing_catalog_wiring_adversarial_v1.py
          python -m unittest -v tests.test_production_marketing_catalog_wiring_adversarial_v1 tests.test_app_backend_durable_job_store_wiring_adversarial_v1 tests.test_production_dynamic_tool_gateway_wiring_adversarial_v1 tests.test_marketing_provider_catalog_v1 tests.test_marketing_live_boundary_v1 tests.test_provider_operation_tracker_v1 tests.test_provider_operation_tracker_adversarial_v1 tests.test_marketing_gateway_sandbox_v1
