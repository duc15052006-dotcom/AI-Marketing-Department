name: Branch Patch Performance Two Pass

on:
  push:
    branches:
      - fix/performance-two-pass-44

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/performance-two-pass-44
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply exact Performance 5A 5B patch
        shell: pwsh
        run: |
          python scripts/patch_performance_two_pass_32.py
          python -m compileall -q runtime tests/test_performance_two_pass_32.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run targeted Performance regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_performance_two_pass_32 `
            tests.test_performance_real_telemetry_30 `
            tests.test_creative_performance_true_handoff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified runtime patch
        shell: pwsh
        run: |
          git diff --exit-code -- . ':!runtime/engine.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add runtime/engine.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No runtime patch to commit."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement Performance 5A/5B runtime passes [performance-two-pass-patched]"
          git push origin HEAD:fix/performance-two-pass-44
