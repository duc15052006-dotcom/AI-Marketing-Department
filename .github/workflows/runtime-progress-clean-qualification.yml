name: Runtime Progress Clean Qualification

on:
  push:
    branches:
      - fix/runtime-progress-emitter-concurrency-v1

permissions:
  contents: read

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  current-head:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Record exact head identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = git rev-parse HEAD
          $expected = "${{ github.sha }}"
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "HEAD_MISMATCH: expected=$expected actual=$actual" }
      - name: Run targeted progress regressions
        shell: pwsh
        run: |
          python -m unittest -v tests.test_runtime_progress_emitter_concurrency_v1 tests.test_prod_runtime_progress_01 2>&1 | Tee-Object -FilePath .ci-results/targeted.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run exact full hermetic discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload current evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-progress-current-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  literal-base:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f2853c6427f6f49942c09b07d3a8b198292ab1e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Record literal base identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = git rev-parse HEAD
          $expected = "4f2853c6427f6f49942c09b07d3a8b198292ab1e"
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "BASE_HEAD_MISMATCH: expected=$expected actual=$actual" }
      - name: Run exact baseline full hermetic discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload literal-base evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-progress-literal-base-4f2853c
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
