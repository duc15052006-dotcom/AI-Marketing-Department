name: Candidate Final Main Reconciliation V1

on:
  push:
    branches: [integration/final-main-reconciliation-v1]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Reconcile main hardening and run targeted regressions
        run: python scripts/_candidate_final_main_reconcile.py
