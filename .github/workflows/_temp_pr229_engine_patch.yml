name: TEMP PR229 engine patch

on:
  push:
    branches:
      - fix/runtime-evidence-citation-provenance-v1

permissions:
  contents: write

jobs:
  patch-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact provenance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")

          old_init = '        research_grounding_section = ""\n        canonical_obs_data = getattr(search_receipt, "observation_record", None)\n        if canonical_obs_data is not None and search_receipt.status == ExecutionStatus.SUCCESS:\n'
          new_init = '        research_grounding_section = ""\n        # Rebuild this runtime-owned index on every Intelligence execution so a\n        # retried stage can never retain stale citation provenance.\n        context.working_state["research_evidence_causal_index"] = {}\n        canonical_obs_data = getattr(search_receipt, "observation_record", None)\n        if canonical_obs_data is not None and search_receipt.status == ExecutionStatus.SUCCESS:\n'

          old_item = '            obs_record = ObservationRecord(**canonical_obs_data)\n            ev_item = EvidenceBuilder.observation_to_evidence(obs_record)\n            ev_bundle = EvidenceBuilder.assemble_bundle(\n'
          new_item = '            obs_record = ObservationRecord(**canonical_obs_data)\n            ev_item = EvidenceBuilder.observation_to_evidence(obs_record)\n            context.working_state["research_evidence_causal_index"][ev_item.evidence_id] = {\n                "observation_id": ev_item.observation_id,\n                "execution_id": ev_item.execution_id,\n                "action_intent_id": ev_item.action_intent_id,\n            }\n            ev_bundle = EvidenceBuilder.assemble_bundle(\n'

          old_lineage = '                lineage_summary={"citations": [c.citation_id for c in self.lineage_inspector.get_all_citations()]},\n'
          new_lineage = '                lineage_summary={\n                    "citations": [c.citation_id for c in self.lineage_inspector.get_all_citations()],\n                    "evidence_causal_index": {\n                        evidence_id: {\n                            "observation_id": lineage.get("observation_id"),\n                            "execution_id": lineage.get("execution_id"),\n                            "action_intent_id": lineage.get("action_intent_id"),\n                        }\n                        for evidence_id, lineage in sorted(\n                            context.working_state.get("research_evidence_causal_index", {}).items()\n                        )\n                        if isinstance(evidence_id, str) and isinstance(lineage, dict)\n                    },\n                },\n'

          replacements = (
              (old_init, new_init, "Intelligence causal-index initialization"),
              (old_item, new_item, "canonical EvidenceItem causal mapping"),
              (old_lineage, new_lineage, "sealed artifact causal index"),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ABORTED: {label} marker count={count}, expected=1")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and commit clean final tree
        run: |
          set -euo pipefail
          git diff --check
          git diff -- runtime/engine.py
          git rm .github/workflows/_temp_pr229_engine_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git commit -m "fix(runtime): seal evidence causal provenance"
          git push origin HEAD:refs/heads/fix/runtime-evidence-citation-provenance-v1
