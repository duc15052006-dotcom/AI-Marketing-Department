name: TEMP PR229 engine patch

on:
  push:
    branches:
      - fix/runtime-evidence-citation-provenance-v1

permissions:
  contents: write

jobs:
  patch-engine:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact provenance patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")

          old_init = '''        research_grounding_section = ""
        canonical_obs_data = getattr(search_receipt, "observation_record", None)
        if canonical_obs_data is not None and search_receipt.status == ExecutionStatus.SUCCESS:
'''
          new_init = '''        research_grounding_section = ""
        # Rebuild this runtime-owned index on every Intelligence execution so a
        # retried stage can never retain stale citation provenance.
        context.working_state["research_evidence_causal_index"] = {}
        canonical_obs_data = getattr(search_receipt, "observation_record", None)
        if canonical_obs_data is not None and search_receipt.status == ExecutionStatus.SUCCESS:
'''

          old_item = '''            obs_record = ObservationRecord(**canonical_obs_data)
            ev_item = EvidenceBuilder.observation_to_evidence(obs_record)
            ev_bundle = EvidenceBuilder.assemble_bundle(
'''
          new_item = '''            obs_record = ObservationRecord(**canonical_obs_data)
            ev_item = EvidenceBuilder.observation_to_evidence(obs_record)
            context.working_state["research_evidence_causal_index"][ev_item.evidence_id] = {
                "observation_id": ev_item.observation_id,
                "execution_id": ev_item.execution_id,
                "action_intent_id": ev_item.action_intent_id,
            }
            ev_bundle = EvidenceBuilder.assemble_bundle(
'''

          old_lineage = '''                lineage_summary={"citations": [c.citation_id for c in self.lineage_inspector.get_all_citations()]},
'''
          new_lineage = '''                lineage_summary={
                    "citations": [c.citation_id for c in self.lineage_inspector.get_all_citations()],
                    "evidence_causal_index": {
                        evidence_id: {
                            "observation_id": lineage.get("observation_id"),
                            "execution_id": lineage.get("execution_id"),
                            "action_intent_id": lineage.get("action_intent_id"),
                        }
                        for evidence_id, lineage in sorted(
                            context.working_state.get(
                                "research_evidence_causal_index", {}
                            ).items()
                        )
                        if isinstance(evidence_id, str) and isinstance(lineage, dict)
                    },
                },
'''

          replacements = (
              (old_init, new_init, "Intelligence causal-index initialization"),
              (old_item, new_item, "canonical EvidenceItem causal mapping"),
              (old_lineage, new_lineage, "sealed artifact causal index"),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ABORTED: {label} marker count={count}, expected=1")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit exact production patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- runtime/engine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git commit -m "fix(runtime): seal evidence causal provenance"
          git push origin HEAD:refs/heads/fix/runtime-evidence-citation-provenance-v1
