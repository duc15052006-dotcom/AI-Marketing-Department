name: Runtime Cancelled Publish Zero Dispatch Apply

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-cancelled-publish-zero-dispatch-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_ENGINE_BLOB: "92945f0822d810c5a36a8ec0d7608f00e9705947"
  TARGET_BRANCH: "fix/runtime-cancelled-publish-zero-dispatch-v1"

jobs:
  guarded-apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/runtime-cancelled-publish-zero-dispatch-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact source identity and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_BLOB="$(git hash-object runtime/engine.py)"
          echo "expected_engine_blob=$EXPECTED_ENGINE_BLOB"
          echo "actual_engine_blob=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_ENGINE_BLOB"
          test -z "$(git status --porcelain)"

      - name: Apply pre-dispatch cancellation gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def request_publish_action(self, context: RuntimeContext, platform: str = "linkedin", approval_token: Optional[str] = None) -> ExecutionReceipt:\n        """Attempt to execute a publishing action, triggering Human Approval Gate if unapproved."""\n        pub_req = ToolRequest(\n'''
          new = '''    def request_publish_action(self, context: RuntimeContext, platform: str = "linkedin", approval_token: Optional[str] = None) -> ExecutionReceipt:\n        """Attempt to execute a publishing action, triggering Human Approval Gate if unapproved."""\n        if self.is_cancelled(context.run_id) or context.status == RuntimeStatus.CANCELLED:\n            context.status = RuntimeStatus.CANCELLED\n            raise RuntimeError("RUN_CANCELLED_BY_OPERATOR")\n\n        pub_req = ToolRequest(\n'''
          if text.count(old) != 1:
              raise SystemExit(f"PATCH_GUARD_FAILED: expected exactly one publish anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          test "$(git diff --name-only | tr -d '\r')" = "runtime/engine.py"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile touched production source
        run: python -m py_compile runtime/engine.py

      - name: Run guarded targeted regressions
        run: |
          python -m unittest -v \
            tests.test_runtime_cancelled_publish_zero_dispatch_v1 \
            tests.test_runtime_upstream_failed_zero_tool_dispatch_adaptive_stack_v1 \
            tests.test_structure

      - name: Commit production fix and remove temporary apply workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-cancelled-publish-zero-dispatch-apply.yml
          git add runtime/engine.py
          echo "staged files:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/runtime-cancelled-publish-zero-dispatch-apply.yml runtime/engine.py "
          git commit -m "fix(runtime): block publish dispatch after cancellation"
          git push origin "HEAD:${TARGET_BRANCH}"
