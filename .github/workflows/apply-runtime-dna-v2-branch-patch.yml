name: Apply Runtime DNA V2 Branch Patch

on:
  push:
    branches: [fix/runtime-full-agent-dna-39-v2]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[dna-v2-patched]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-full-agent-dna-39-v2
          fetch-depth: 0

      - name: Apply exact runtime DNA wiring
        shell: python
        run: |
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from runtime.artifacts import DepartmentRunArtifact, MemoryWriteCandidate\n"
          import_line = "from runtime.agent_prompt import AgentDnaLoadError, compose_runtime_agent_system_prompt\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f"IMPORT_ANCHOR_COUNT={text.count(import_anchor)}")
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          call_anchor = "        system_instruction = system_instruction + HANDOFF_PROMPT_INSTRUCTION\n"
          if text.count(call_anchor) != 1:
              raise SystemExit(f"CALL_ANCHOR_COUNT={text.count(call_anchor)}")
          if "compose_runtime_agent_system_prompt(agent_name, system_instruction)" not in text:
              replacement = (
                  "        try:\n"
                  "            system_instruction = compose_runtime_agent_system_prompt(agent_name, system_instruction)\n"
                  "        except AgentDnaLoadError as exc:\n"
                  "            return None, str(exc)\n\n"
                  + call_anchor
              )
              text = text.replace(call_anchor, replacement, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify exact patch shape
        shell: bash
        run: |
          git diff --check
          git diff -- runtime/engine.py
          test "$(grep -c 'from runtime.agent_prompt import AgentDnaLoadError, compose_runtime_agent_system_prompt' runtime/engine.py)" -eq 1
          test "$(grep -c 'compose_runtime_agent_system_prompt(agent_name, system_instruction)' runtime/engine.py)" -eq 1
          python -m py_compile runtime/engine.py runtime/agent_prompt.py tests/test_runtime_agent_dna_wiring_28.py

      - name: Commit branch-only patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-runtime-dna-v2-branch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py .github/workflows/apply-runtime-dna-v2-branch-patch.yml
          git commit -m "Wire full Agent DNA into production runtime [dna-v2-patched]"
          git push origin HEAD:fix/runtime-full-agent-dna-39-v2
