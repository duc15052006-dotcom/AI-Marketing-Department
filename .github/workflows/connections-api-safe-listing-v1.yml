name: Connections API Safe Listing V1

on:
  pull_request:
    paths:
      - "app_api/server.py"
      - "tests/test_connections_api_safe_profile_listing_adversarial_v1.py"
      - ".github/workflows/connections-api-safe-listing-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connections-api-safe-listing-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-profile-listing:
    name: Safe connection profile listing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      AI_MARKETING_MEMORY_EPHEMERAL: "1"
      AI_MARKETING_LEARNING_EPHEMERAL: "1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_head_sha=${expected}"
          echo "actual_head_sha=${actual}"
          test "${actual}" = "${expected}"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile and run safe-listing regressions
        run: |
          python -m compileall -q app_api tests/test_connections_api_safe_profile_listing_adversarial_v1.py
          python -m unittest -v tests.test_connections_api_safe_profile_listing_adversarial_v1 tests.test_production_connection_profile_restart_durability_adversarial_v1 tests.test_connections_secret_profiles_v1 tests.test_connector_connection_authority_v1 tests.test_prod_sec_01_api_and_approval_boundary
