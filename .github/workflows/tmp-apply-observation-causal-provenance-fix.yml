name: tmp apply observation causal provenance fix

on:
  push:
    branches:
      - fix/brain-observation-action-intent-provenance-v1

permissions:
  contents: write

jobs:
  apply-production-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: fix/brain-observation-action-intent-provenance-v1
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply exact production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path("tools/observation/models.py")
          text = models.read_text(encoding="utf-8")
          old = '''    run_id: str = Field(default="", description="Trusted execution run ID from RuntimeContext")
              business_id: str = Field(default="", description="Trusted business scope from RuntimeContext")
              project_id: str = Field(default="", description="Trusted project scope from RuntimeContext")

              def __post_init__(self) -> None:
          '''
          new = '''    run_id: str = Field(default="", description="Trusted execution run ID from RuntimeContext")
              business_id: str = Field(default="", description="Trusted business scope from RuntimeContext")
              project_id: str = Field(default="", description="Trusted project scope from RuntimeContext")

              # Causal execution provenance is bound only by the outer ToolGateway.
              # Observation backends may construct records with these fields empty,
              # but adapters/model payloads never become authority for either ID.
              execution_id: str = Field(
                  default="",
                  description="Actual outer ExecutionReceipt identity that produced this observation",
              )
              action_intent_id: Optional[str] = Field(
                  default=None,
                  description="Canonical Brain ActionIntent identity when semantic authority was validated",
              )

              def __post_init__(self) -> None:
          '''
          if text.count(old) != 1:
              raise SystemExit(f"models precondition failed: expected 1 marker, got {text.count(old)}")
          models.write_text(text.replace(old, new, 1), encoding="utf-8")

          gateway = Path("tools/tool_gateway.py")
          text = gateway.read_text(encoding="utf-8")
          old = '''        if adapter_res and adapter_res.success:
                      mode = self._resolve_execution_mode(adapter, cap.capability_id, adapter_res)
                      receipt = ExecutionReceipt(
                          run_id=request.run_id,
          '''
          new = '''        if adapter_res and adapter_res.success:
                      mode = self._resolve_execution_mode(adapter, cap.capability_id, adapter_res)

                      # The outer gateway owns causal execution identity. Observation
                      # adapters may report empirical content, but cannot self-attest the
                      # execution or Brain ActionIntent that authorized that content.
                      execution_id = f"EXEC-{uuid.uuid4().hex[:12].upper()}"
                      bound_observation_record = None
                      if adapter_res.observation_record is not None:
                          bound_observation_record = dict(adapter_res.observation_record)
                          bound_observation_record["execution_id"] = execution_id
                          bound_observation_record["action_intent_id"] = semantic_intent_id

                      receipt = ExecutionReceipt(
                          execution_id=execution_id,
                          run_id=request.run_id,
          '''
          if text.count(old) != 1:
              raise SystemExit(f"gateway precondition failed: expected 1 receipt marker, got {text.count(old)}")
          text = text.replace(old, new, 1)
          old_obs = '''                observation_record=adapter_res.observation_record,
          '''
          new_obs = '''                observation_record=bound_observation_record,
          '''
          if text.count(old_obs) != 1:
              raise SystemExit(f"gateway observation precondition failed: expected 1 marker, got {text.count(old_obs)}")
          gateway.write_text(text.replace(old_obs, new_obs, 1), encoding="utf-8")
          PY

      - name: Verify patch before commit
        shell: bash
        run: |
          python -m py_compile tools/observation/models.py tools/tool_gateway.py tools/receipts.py
          python -m unittest -v \
            tests.test_brain_observation_action_intent_provenance_v1 \
            tests.test_brain_action_intent_execution_intent_provenance_v1 \
            tests.test_brain_action_intent_receipt_provenance_v1 \
            tests.test_brain_canonical_action_intent_tool_gateway_v1
          git diff --check
          rm .github/workflows/tmp-apply-observation-causal-provenance-fix.yml
          python - <<'PY'
          import subprocess
          names = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          expected = {
              "tools/observation/models.py",
              "tools/tool_gateway.py",
              ".github/workflows/tmp-apply-observation-causal-provenance-fix.yml",
          }
          if names != expected:
              raise SystemExit(f"unexpected production bootstrap diff: {sorted(names)}")
          PY

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/observation/models.py tools/tool_gateway.py .github/workflows/tmp-apply-observation-causal-provenance-fix.yml
          git commit -m "fix(brain): bind causal provenance into observations"
          git push origin HEAD:fix/brain-observation-action-intent-provenance-v1
