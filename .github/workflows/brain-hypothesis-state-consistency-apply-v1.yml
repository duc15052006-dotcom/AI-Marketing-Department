name: Brain Hypothesis State Consistency Apply V1

on:
  push:
    branches:
      - fix/brain-hypothesis-state-consistency-v1
    paths:
      - .github/workflows/brain-hypothesis-state-consistency-apply-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brain-hypothesis-state-consistency-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python .ci/apply_hypothesis_state_consistency_v1.py
      - name: Compile and run focused regression
        run: |
          python -m py_compile brain/hypotheses.py tests/test_brain_hypothesis_state_consistency_v4.py
          python -m unittest -v tests.test_brain_hypothesis_state_consistency_v4
          python -m unittest -v tests.test_brain_hypothesis_portfolio_v1 tests.test_brain_research_agenda_use_boundary_revalidation_v1
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(brain): enforce hypothesis semantic-state consistency"
          git push origin HEAD:fix/brain-hypothesis-state-consistency-v1

# bootstrap-retry: 2
