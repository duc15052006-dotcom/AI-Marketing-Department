name: TMP PR89 Trusted Scope Repair V4

on:
  push:
    branches:
      - test/pr89-trusted-legacy-scope-repair

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Apply candidate repair
        shell: python {0}
        run: |
          from pathlib import Path
          import base64

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"ANCHOR_COUNT_MISMATCH {path}: expected 1, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("runtime/context.py", "    user_id: Optional[str] = None\n\n\nclass RuntimeContext(BaseModel):", "    user_id: Optional[str] = None\n    trusted_knowledge_scope: Optional[str] = None\n    trusted_memory_scope: Optional[str] = None\n\n\nclass RuntimeContext(BaseModel):")
          replace_once("runtime/context.py", "    project_id: Optional[str] = Field(default=None, description=\"Optional associated workspace project ID\")\n    created_at: datetime = Field(default_factory=lambda: datetime.now(timezone.utc))", "    project_id: Optional[str] = Field(default=None, description=\"Optional associated workspace project ID\")\n    trusted_knowledge_scope: Optional[str] = Field(default=None, description=\"Trusted legacy knowledge scope bound at run creation\")\n    trusted_memory_scope: Optional[str] = Field(default=None, description=\"Trusted legacy memory scope bound at run creation\")\n    created_at: datetime = Field(default_factory=lambda: datetime.now(timezone.utc))")
          replace_once("runtime/context.py", "            \"campaign_id\",\n            \"user_id\",\n        ):", "            \"campaign_id\",\n            \"user_id\",\n            \"trusted_knowledge_scope\",\n            \"trusted_memory_scope\",\n        ):")
          replace_once("runtime/context.py", "            campaign_id=self.campaign_id,\n            user_id=self.user_id,\n        )", "            campaign_id=self.campaign_id,\n            user_id=self.user_id,\n            trusted_knowledge_scope=self.trusted_knowledge_scope,\n            trusted_memory_scope=self.trusted_memory_scope,\n        )")

          replace_once("runtime/engine.py", "        knowledge_scopes = list(plan.knowledge_scope_keys)\n        memory_scopes = list(plan.memory_scope_keys)\n\n        project_id = str(plan.project_id or \"\").strip()", "        knowledge_scopes = list(plan.knowledge_scope_keys)\n        memory_scopes = list(plan.memory_scope_keys)\n\n        authority = context.scope\n        trusted_knowledge_scope = str(authority.trusted_knowledge_scope or \"\").strip()\n        trusted_memory_scope = str(authority.trusted_memory_scope or \"\").strip()\n        if trusted_knowledge_scope and trusted_knowledge_scope.upper() != \"GLOBAL\":\n            knowledge_scopes.append(trusted_knowledge_scope)\n        if trusted_memory_scope and trusted_memory_scope.upper() != \"GLOBAL\":\n            memory_scopes.append(trusted_memory_scope)\n\n        project_id = str(plan.project_id or \"\").strip()")
          replace_once("runtime/engine.py", "        trusted_run_id: Optional[str] = None,\n        chat_id: Optional[str] = None,\n        project_id: Optional[str] = None,\n        progress_sink: Optional[ProgressSink] = None,", "        trusted_run_id: Optional[str] = None,\n        chat_id: Optional[str] = None,\n        project_id: Optional[str] = None,\n        trusted_knowledge_scope: Optional[str] = None,\n        trusted_memory_scope: Optional[str] = None,\n        progress_sink: Optional[ProgressSink] = None,")
          replace_once("runtime/engine.py", "                user_id=user_id,\n                chat_id=chat_id,\n                project_id=project_id,\n                status=RuntimeStatus.RUNNING,", "                user_id=user_id,\n                chat_id=chat_id,\n                project_id=project_id,\n                trusted_knowledge_scope=trusted_knowledge_scope,\n                trusted_memory_scope=trusted_memory_scope,\n                status=RuntimeStatus.RUNNING,")

          replace_once("workspace/operator.py", "            objective=objective,\n            business_id=business_id,\n            campaign_id=cid,\n            user_id=user_id,\n        )", "            objective=objective,\n            business_id=business_id,\n            campaign_id=cid,\n            user_id=user_id,\n            trusted_knowledge_scope=biz.knowledge_scope if biz else None,\n            trusted_memory_scope=biz.memory_scope if biz else None,\n        )")

          test_b64 = ""
          Path("tests/test_runtime_trusted_legacy_scope_authority_v1.py").write_bytes(base64.b64decode(test_b64))
      - name: Compile candidate patch
        shell: pwsh
        run: python -m py_compile runtime/context.py runtime/engine.py workspace/operator.py tests/test_runtime_trusted_legacy_scope_authority_v1.py tests/test_phase6_2_pilot_and_v1_release.py
      - name: Run targeted regressions
        shell: pwsh
        run: python -m unittest tests.test_runtime_builder_canonical_lineage_scope_v1 tests.test_runtime_trusted_legacy_scope_authority_v1 tests.test_context_compiler_dual_scope_read_v1 tests.test_runtime_canonical_scope_plan_v1 tests.test_runtime_builder_scope_isolation_v1 tests.test_phase6_2_pilot_and_v1_release -v
      - name: Verify patch hygiene
        shell: pwsh
        run: git diff --check
      - name: Commit validated candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/context.py runtime/engine.py workspace/operator.py tests/test_runtime_trusted_legacy_scope_authority_v1.py
          git commit -m "test: validated PR89 trusted legacy scope repair"
          git push origin HEAD:test/pr89-trusted-legacy-scope-repair
