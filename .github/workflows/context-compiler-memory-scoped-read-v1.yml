name: Context Compiler Memory Scoped Read V1

on:
  pull_request:
    paths:
      - "runtime/context_compiler.py"
      - "tests/test_context_compiler_memory_scoped_read_adversarial_v1.py"
      - ".github/workflows/context-compiler-memory-scoped-read-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-compiler-memory-scoped-read-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-compiler-memory-scoped-read-v1:
    name: ContextCompiler exact Memory scope reads
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      AI_MARKETING_MEMORY_EPHEMERAL: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: pwsh
        run: |
          $expectedHead = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actualHead = (git rev-parse HEAD).Trim()
          Write-Host "expected_head_sha=$expectedHead"
          Write-Host "actual_head_sha=$actualHead"
          if ($actualHead -ne $expectedHead) {
            throw "CI checkout does not match expected PR head"
          }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Run ContextCompiler and stacked Memory regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_context_compiler_memory_scoped_read_adversarial_v1 `
            tests.test_context_compiler_dual_scope_read_v1 `
            tests.test_production_memory_restart_durability_adversarial_v1 `
            tests.test_memory_sqlite_persistence_secret_boundary_adversarial_v1
