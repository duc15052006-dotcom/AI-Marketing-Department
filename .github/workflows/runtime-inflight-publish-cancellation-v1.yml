name: Runtime Inflight Publish Cancellation V1

on:
  pull_request:
    paths:
      - "runtime/engine.py"
      - "tests/test_runtime_inflight_publish_cancellation_v1.py"
      - ".github/workflows/runtime-inflight-publish-cancellation-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  guarded-production-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Guard exact RED parent
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          PARENT="$(git rev-parse HEAD^)"
          echo "actual=$ACTUAL"
          echo "expected=$EXPECTED"
          echo "parent=$PARENT"
          test "$ACTUAL" = "$EXPECTED"
          if [ "$PARENT" = "c2ba7a881c23f8b4c858f06e85401d65cb247659" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        if: steps.guard.outputs.apply == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply canonical finalization repair
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def complete_run(self, context: RuntimeContext) -> DepartmentRunArtifact:\n        """Finalize the supervised run, record candidate memories and produce sealed artifact."""\n        context.current_stage = RuntimeStage.COMPLETED\n        if context.status not in (RuntimeStatus.FAILED, RuntimeStatus.CANCELLED):\n'''
          new = '''    def complete_run(self, context: RuntimeContext) -> DepartmentRunArtifact:\n        """Finalize the supervised run, record candidate memories and produce sealed artifact."""\n        # Cancellation is absorbing lifecycle authority. Sealing a cancelled run\n        # must preserve the stage at which cancellation won instead of relabeling\n        # that lifecycle as COMPLETED.\n        if context.status != RuntimeStatus.CANCELLED:\n            context.current_stage = RuntimeStage.COMPLETED\n        if context.status not in (RuntimeStatus.FAILED, RuntimeStatus.CANCELLED):\n'''
          if text.count(old) != 1:
              raise SystemExit("GUARD_FAILED: canonical complete_run preimage mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- runtime/engine.py

      - name: Prove focused regression GREEN before commit
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile runtime/engine.py tests/test_runtime_inflight_publish_cancellation_v1.py
          python -m unittest -v tests.test_runtime_inflight_publish_cancellation_v1

      - name: Commit production repair to invariant branch
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          test "$(git diff --cached --name-only)" = "runtime/engine.py"
          git commit -m "fix(runtime): preserve cancelled lifecycle during finalization"
          git push origin HEAD:fix/runtime-inflight-publish-cancellation-v1
