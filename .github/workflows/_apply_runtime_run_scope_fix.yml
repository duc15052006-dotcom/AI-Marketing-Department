name: Apply Runtime Run Scope Fix

on:
  pull_request:
    paths:
      - ".github/workflows/_apply_runtime_run_scope_fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2

      - name: Verify helper parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "82b383aa7c4dafcdfddbf3815d09c2f9295f70f6"

      - name: Apply canonical run-scope repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/security.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one anchor, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          project_helper = '''def _canonical_project_scope(project_id: Optional[str]) -> Optional[str]:
              """Return one canonical optional project scope or fail closed on malformed input."""
              if project_id is None:
                  return None
              if not isinstance(project_id, str):
                  raise ValueError("PROJECT_SCOPE_INVALID: project_id must be a non-empty canonical string or None")
              canonical = project_id.strip()
              if not canonical or canonical != project_id:
                  raise ValueError("PROJECT_SCOPE_INVALID: project_id must be non-empty and contain no surrounding whitespace")
              return canonical
          '''.replace("          ", "")

          helpers = project_helper + '''

          def _canonical_run_scope(run_id: Optional[str]) -> str:
              """Return one canonical run scope while preserving the legacy unbound empty value."""
              if run_id is None or run_id == "":
                  return ""
              if not isinstance(run_id, str):
                  raise ValueError("RUN_SCOPE_INVALID: run_id must be a canonical string or an unbound empty value")
              canonical = run_id.strip()
              if not canonical or canonical != run_id:
                  raise ValueError("RUN_SCOPE_INVALID: run_id must contain no surrounding whitespace")
              return canonical
          '''.replace("          ", "")
          replace_once(project_helper, helpers)

          replace_once(
              '    norm_params = json.dumps(parameters or {}, sort_keys=True, ensure_ascii=False, separators=(",", ":"))\n    scope = f"{capability_id.strip().lower()}:{run_id or \'\'}:{business_id or \'\'}"\n',
              '    norm_params = json.dumps(parameters or {}, sort_keys=True, ensure_ascii=False, separators=(",", ":"))\n    run_scope = _canonical_run_scope(run_id)\n    scope = f"{capability_id.strip().lower()}:{run_scope}:{business_id or \'\'}"\n',
          )

          replace_once(
              '        params = parameters or {}\n        project_scope = _canonical_project_scope(project_id)\n        fp = compute_request_fingerprint(\n            capability_id=capability_id,\n            parameters=params,\n            run_id=run_id,\n',
              '        params = parameters or {}\n        run_scope = _canonical_run_scope(run_id)\n        project_scope = _canonical_project_scope(project_id)\n        fp = compute_request_fingerprint(\n            capability_id=capability_id,\n            parameters=params,\n            run_id=run_scope,\n',
          )
          replace_once('                    and existing.run_id == run_id\n', '                    and existing.run_id == run_scope\n')
          replace_once('                run_id=run_id,\n                business_id=business_id,\n                project_id=project_scope,\n                created_at=now.isoformat(),\n', '                run_id=run_scope,\n                business_id=business_id,\n                project_id=project_scope,\n                created_at=now.isoformat(),\n')

          replace_once(
              '        expires_at = datetime.fromtimestamp(now.timestamp() + ttl_seconds, tz=timezone.utc).isoformat()\n        project_scope = _canonical_project_scope(project_id)\n        fp = compute_request_fingerprint(\n            capability_id=capability_id,\n            parameters=parameters or {},\n            run_id=run_id,\n',
              '        expires_at = datetime.fromtimestamp(now.timestamp() + ttl_seconds, tz=timezone.utc).isoformat()\n        run_scope = _canonical_run_scope(run_id)\n        project_scope = _canonical_project_scope(project_id)\n        fp = compute_request_fingerprint(\n            capability_id=capability_id,\n            parameters=parameters or {},\n            run_id=run_scope,\n',
          )
          replace_once('            run_id=run_id,\n            business_id=business_id,\n            project_id=project_scope,\n            request_fingerprint=fp,\n', '            run_id=run_scope,\n            business_id=business_id,\n            project_id=project_scope,\n            request_fingerprint=fp,\n')

          replace_once(
              '        if requires_approval:\n            if not approval_token:\n',
              '        if requires_approval:\n            try:\n                request_run_scope = _canonical_run_scope(run_id)\n            except ValueError as exc:\n                return PolicyDecision(\n                    allowed=False,\n                    requires_human_approval=True,\n                    error_code="RUN_SCOPE_INVALID",\n                    reason=str(exc),\n                )\n\n            if not approval_token:\n',
          )

          replace_once(
              '            # Check run_id match (if bound in record)\n            if record.run_id and not run_id:\n',
              '            # Check run_id match (if bound in record)\n            try:\n                approval_run_scope = _canonical_run_scope(record.run_id)\n            except ValueError as exc:\n                return PolicyDecision(\n                    allowed=False,\n                    requires_human_approval=True,\n                    error_code="APPROVAL_RUN_SCOPE_INVALID",\n                    reason=f"APPROVAL_RUN_SCOPE_INVALID: {exc}",\n                )\n\n            if approval_run_scope and not request_run_scope:\n',
          )
          replace_once("                    reason=f\"APPROVAL_RUN_SCOPE_REQUIRED: Approval is bound to run '{record.run_id}', but the request has no run scope.\",\n", "                    reason=f\"APPROVAL_RUN_SCOPE_REQUIRED: Approval is bound to run '{approval_run_scope}', but the request has no run scope.\",\n")
          replace_once(
              '            if record.run_id and run_id and record.run_id != run_id:\n',
              '            if approval_run_scope and request_run_scope and approval_run_scope != request_run_scope:\n',
          )
          replace_once("                    reason=f\"APPROVAL_RUN_MISMATCH: Approval is bound to run '{record.run_id}', not '{run_id}'.\",\n", "                    reason=f\"APPROVAL_RUN_MISMATCH: Approval is bound to run '{approval_run_scope}', not '{request_run_scope}'.\",\n")
          replace_once('                    run_id=run_id or record.run_id,\n', '                    run_id=request_run_scope or approval_run_scope,\n')

          path.write_text(text, encoding="utf-8")

      - name: Verify repair before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/security.py tests/test_runtime_approval_run_scope_canonical_v1.py
          python -m unittest -v tests.test_runtime_approval_run_scope_canonical_v1
          python -m unittest -v tests.test_runtime_approval_run_scope_required_v1 tests.test_runtime_approval_project_scope_authority_v1 tests.test_runtime_approval_business_scope_authority_v1 tests.test_tool_gateway_durable_intent_lifecycle_v1
          git diff --check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply_runtime_run_scope_fix.yml
          git add tools/security.py
          git commit -m "fix(runtime): canonicalize run approval scope"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
