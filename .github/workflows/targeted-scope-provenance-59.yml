name: Targeted Scope Provenance 59

on:
  push:
    branches:
      - fix/workspace-scope-provenance-isolation-59

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Apply guarded production patch
        shell: bash
        run: |
          if grep -q "Mirror ContextCompiler knowledge visibility" runtime/engine.py; then
            echo "Patch already applied"
          else
            echo '' | base64 -d > /tmp/patch_scope_59.py
            python /tmp/patch_scope_59.py
          fi
      - name: Run workspace scope provenance regression
        run: python -m unittest -v tests.test_workspace_scope_provenance_isolation_59
      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/knowledge_builder.py runtime/memory_builder.py runtime/engine.py tests/test_workspace_scope_provenance_isolation_59.py
          git commit -m "harden: isolate workspace provenance scopes"
          git push origin HEAD:fix/workspace-scope-provenance-isolation-59
