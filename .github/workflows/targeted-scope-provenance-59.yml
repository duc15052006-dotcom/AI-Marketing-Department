name: Targeted Scope Provenance 59

on:
  push:
    branches:
      - fix/workspace-scope-provenance-isolation-59

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run new scope regressions
        run: python -m unittest -v tests.test_workspace_scope_provenance_isolation_59
      - name: Run existing builder-related regressions
        shell: bash
        run: |
          mapfile -t files < <(grep -l -E 'KnowledgeContextBuilder|MemoryContextBuilder|knowledge_builder|memory_builder' tests/test_*.py | sort -u)
          printf 'Relevant test files:\n%s\n' "${files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No existing builder-related tests found' >&2
            exit 1
          fi
          modules=()
          for file in "${files[@]}"; do
            module="${file%.py}"
            modules+=("${module//\//.}")
          done
          python -m unittest -v "${modules[@]}"
