name: Knowledge Durability RED V3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-durability-red-v3:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact head identity
        shell: pwsh
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected_head_sha=$expected"
          Write-Host "actual_head_sha=$actual"
          if ($actual -ne $expected) { exit 1 }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run production knowledge restart durability regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_production_knowledge_restart_durability_adversarial_v3
