name: PR121 Apply Checkpoint Hash Fix

on:
  push:
    branches:
      - fix/checkpoint-semantic-hash-integrity-v1

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/checkpoint-semantic-hash-integrity-v1

      - name: Apply exact minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/context.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def calculate_checkpoint_hash(self) -> str:
              """Compute cryptographic hash of checkpoint state."""
              raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}"
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()
          '''
          new = '''    def calculate_checkpoint_hash(self) -> str:
              """Compute cryptographic hash of checkpoint state."""
              working_state = json.dumps(
                  self.working_state_snapshot,
                  sort_keys=True,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  default=str,
              )
              raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{working_state}"
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exact checkpoint hash block once, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/context.py
          git diff --cached --exit-code && { echo "No production diff produced"; exit 1; } || true
          git commit -m "fix: bind checkpoint hash to working state snapshot"
          git push origin HEAD:fix/checkpoint-semantic-hash-integrity-v1
