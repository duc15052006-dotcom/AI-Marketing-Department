name: PR121 Apply Checkpoint Hash Fix

on:
  push:
    branches:
      - fix/checkpoint-semantic-hash-integrity-v1

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/checkpoint-semantic-hash-integrity-v1

      - name: Apply exact minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/context.py")
          text = path.read_text(encoding="utf-8")
          old = '        raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}"'
          new = (
              '        working_state = json.dumps(\n'
              '            self.working_state_snapshot,\n'
              '            sort_keys=True,\n'
              '            ensure_ascii=False,\n'
              '            separators=(",", ":"),\n'
              '            default=str,\n'
              '        )\n'
              '        raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{working_state}"'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exact checkpoint hash line once, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/context.py
          if git diff --cached --quiet; then
            echo "No production diff produced"
            exit 1
          fi
          git commit -m "fix: bind checkpoint hash to working state snapshot"
          git push origin HEAD:fix/checkpoint-semantic-hash-integrity-v1
