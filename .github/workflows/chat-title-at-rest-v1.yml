name: Chat Title At-Rest V1

on:
  push:
    branches:
      - hardening/chat-title-at-rest-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat-title-at-rest:
    name: Guarded chat title at-rest applicator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact CI identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "actual_sha=${ACTUAL_SHA}"
          echo "expected_sha=${GITHUB_SHA}"
          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "hardening/chat-title-at-rest-v1"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip check

      - name: Apply exact guarded production patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="004bd93c7ddb9652714761d863d593f8f7df561c"
          ACTUAL_BLOB="$(git hash-object chat/repository.py)"
          echo "repository_blob=${ACTUAL_BLOB}"
          if [ "${ACTUAL_BLOB}" != "${EXPECTED_BLOB}" ]; then
            echo "already_patched=true" >> "${GITHUB_OUTPUT}"
            echo "Repository blob already moved; guarded applicator will not patch again."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("chat/repository.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed: expected one occurrence, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          migration = '''    def _migrate_plaintext_session_titles(self, conn: sqlite3.Connection) -> None:
              """Atomically protect session titles left plaintext by at_rest_v1."""
              marker = conn.execute(
                  "SELECT 1 FROM chat_payload_migrations WHERE migration_key = ?",
                  ("title_at_rest_v1",),
              ).fetchone()
              if marker:
                  return

              conn.execute("BEGIN IMMEDIATE")
              try:
                  for row in conn.execute(
                      "SELECT chat_id, title FROM chat_sessions"
                  ).fetchall():
                      conn.execute(
                          "UPDATE chat_sessions SET title = ? WHERE chat_id = ?",
                          (self._protect_text(row["title"]), row["chat_id"]),
                      )

                  conn.execute(
                      "INSERT INTO chat_payload_migrations (migration_key, applied_at) VALUES (?, ?)",
                      ("title_at_rest_v1", datetime.now(timezone.utc).isoformat()),
                  )
                  conn.commit()
              except Exception:
                  conn.rollback()
                  raise

'''

          replace_once(
              "    @contextmanager\n    def _get_connection(self) -> Generator[sqlite3.Connection, None, None]:\n",
              migration + "    @contextmanager\n    def _get_connection(self) -> Generator[sqlite3.Connection, None, None]:\n",
          )
          replace_once(
              "            self._migrate_v1_plaintext_payloads(conn)\n",
              "            self._migrate_v1_plaintext_payloads(conn)\n            self._migrate_plaintext_session_titles(conn)\n",
          )
          replace_once("                    session.title,\n", "                    self._protect_text(session.title),\n")
          replace_once("            params.append(title)\n", "            params.append(self._protect_text(title))\n")
          replace_once("            title=row[\"title\"],\n", "            title=self._unprotect_text(row[\"title\"]) or \"\",\n")

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "1"
          git status --porcelain | grep -Fx " M chat/repository.py"
          echo "already_patched=false" >> "${GITHUB_OUTPUT}"

      - name: Run title and parent at-rest regressions before commit
        if: steps.patch.outputs.already_patched == 'false'
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_chat_title_at_rest_adversarial_v1 \
            tests.test_chat_at_rest_protection_adversarial_v1

      - name: Commit and push production patch
        if: steps.patch.outputs.already_patched == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat/repository.py
          git commit -m "fix(chat): protect session titles at rest v1"
          git push origin HEAD:hardening/chat-title-at-rest-v1
