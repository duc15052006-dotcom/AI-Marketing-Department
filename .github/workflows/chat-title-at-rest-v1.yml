name: Chat Title At-Rest V1

on:
  push:
    branches:
      - hardening/chat-title-at-rest-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat-title-at-rest:
    name: Guarded chat title at-rest applicator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact CI identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "actual_sha=${ACTUAL_SHA}"
          echo "expected_sha=${GITHUB_SHA}"
          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "hardening/chat-title-at-rest-v1"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip check

      - name: Apply exact guarded production patch
        shell: bash
        run: python scripts/apply_chat_title_at_rest_patch.py

      - name: Verify patch discipline
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "1"
          git status --porcelain | grep -Fx " M chat/repository.py"

      - name: Run title and parent at-rest regressions before commit
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_chat_title_at_rest_adversarial_v1 \
            tests.test_chat_at_rest_protection_adversarial_v1

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat/repository.py
          git commit -m "fix(chat): protect session titles at rest v1"
          git push origin HEAD:hardening/chat-title-at-rest-v1
