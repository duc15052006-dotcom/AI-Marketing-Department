name: Checkpoint Index Metadata Targeted 60

on:
  push:
    branches: [fix/checkpoint-index-metadata-integrity-60]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  targeted:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Apply guarded checkpoint metadata patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("runtime/job_store.py")
          text = path.read_text(encoding="utf-8")
          old = '''                checkpoints.append(json.loads(payload_json))'''
          new = '''                payload = json.loads(payload_json)
                try:
                    payload_created_at = datetime.fromisoformat(str(payload["timestamp"])).isoformat()
                except (KeyError, TypeError, ValueError) as exc:
                    raise JobStoreIntegrityError(
                        f"CHECKPOINT_PAYLOAD_INVALID: checkpoint_id={row['checkpoint_id']} field=timestamp"
                    ) from exc

                trusted_metadata = {
                    "checkpoint_id": str(payload.get("checkpoint_id") or ""),
                    "run_id": str(payload.get("run_id") or ""),
                    "checkpoint_hash": str(payload.get("checkpoint_hash") or ""),
                    "created_at": payload_created_at,
                }
                for field, trusted_value in trusted_metadata.items():
                    if str(row[field]) != trusted_value:
                        trusted_checkpoint_id = trusted_metadata["checkpoint_id"] or "UNKNOWN"
                        raise JobStoreIntegrityError(
                            "CHECKPOINT_METADATA_INTEGRITY_MISMATCH: "
                            f"checkpoint_id={trusted_checkpoint_id} field={field}"
                        )
                checkpoints.append(payload)'''
          marker = "CHECKPOINT_METADATA_INTEGRITY_MISMATCH:"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("guard failed: unexpected checkpoint decode match count")
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif marker in text:
              print("checkpoint metadata patch already present")
          else:
              raise SystemExit("guard failed: checkpoint decode target not found")
          '@ | python -
      - name: Run targeted checkpoint durability regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_checkpoint_index_metadata_integrity_60 `
            tests.test_platform_job_durability_security_v1 `
            tests.test_platform_job_durability_recovery_v1 `
            tests.test_platform_job_queue_hardening_v1 `
            tests.test_phase4_3b_1_checkpoint_integrity
      - name: Commit production patch when green
        shell: pwsh
        run: |
          git diff --exit-code --quiet -- runtime/job_store.py
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No production patch to commit"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/job_store.py
          git commit -m "harden: bind checkpoint index metadata to hashed payload"
          git push origin HEAD:fix/checkpoint-index-metadata-integrity-60
