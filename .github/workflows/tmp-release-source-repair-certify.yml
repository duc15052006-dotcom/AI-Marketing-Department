name: Temporary Release Source Repair Certification

on:
  push:
    branches:
      - release/v1-productization-final

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
  AI_MARKETING_MEMORY_EPHEMERAL: "1"
  AI_MARKETING_LEARNING_EPHEMERAL: "1"

jobs:
  repair-certify:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1-productization-final
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Repair fail-closed build and deterministic socket mocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          build = Path("scripts/build_windows_release.ps1")
          text = build.read_text(encoding="utf-8")
          old = '$ErrorActionPreference = "Stop"\nSet-StrictMode -Version Latest\n'
          new = '$ErrorActionPreference = "Stop"\n$PSNativeCommandUseErrorActionPreference = $true\nSet-StrictMode -Version Latest\n'
          if old not in text:
              raise SystemExit("build_windows_release.ps1 fail-fast anchor not found")
          text = text.replace(old, new, 1)
          build.write_text(text, encoding="utf-8", newline="\n")

          main = Path("src-tauri/src/main.rs")
          text = main.read_text(encoding="utf-8")
          anchor = "mod tests {\n    use super::*;\n"
          helper = r'''

    fn drain_complete_http_request(stream: &mut std::net::TcpStream) {
        let _ = stream.set_read_timeout(Some(std::time::Duration::from_secs(2)));
        let mut request = Vec::new();
        let mut buf = [0u8; 1024];
        let mut expected_total: Option<usize> = None;

        loop {
            match stream.read(&mut buf) {
                Ok(0) => break,
                Ok(n) => {
                    request.extend_from_slice(&buf[..n]);
                    if expected_total.is_none() {
                        if let Some(idx) = request.windows(4).position(|w| w == b"\r\n\r\n") {
                            let header_end = idx + 4;
                            let headers = String::from_utf8_lossy(&request[..idx]);
                            let content_length = headers
                                .lines()
                                .find_map(|line| {
                                    let (name, value) = line.split_once(':')?;
                                    if name.trim().eq_ignore_ascii_case("content-length") {
                                        value.trim().parse::<usize>().ok()
                                    } else {
                                        None
                                    }
                                })
                                .unwrap_or(0);
                            expected_total = Some(header_end + content_length);
                        }
                    }
                    if expected_total.is_some_and(|expected| request.len() >= expected) {
                        break;
                    }
                }
                Err(err)
                    if matches!(
                        err.kind(),
                        std::io::ErrorKind::WouldBlock | std::io::ErrorKind::TimedOut
                    ) =>
                {
                    break;
                }
                Err(_) => break,
            }
        }
    }
'''
          if anchor not in text:
              raise SystemExit("Rust tests module anchor not found")
          text = text.replace(anchor, anchor + helper, 1)

          targets = [
              "test_loopback_stream_against_mock_server",
              "test_loopback_stream_status_errors",
              "test_loopback_stream_invalid_content_type",
              "test_loopback_stream_channel_send_failure_disconnects",
              "test_loopback_stream_headers_and_body_in_same_read",
              "test_response_header_limit_rejected",
          ]
          for name in targets:
              pattern = re.compile(
                  rf"(fn {re.escape(name)}\(\) \{{.*?if let Ok\(\(mut stream, _\)\) = listener\.accept\(\) \{{\n)"
                  r"\s+let mut (?:buf|req_buf) = \[0u8; \d+\];\n"
                  r"\s+let _ = stream\.read\(&mut (?:buf|req_buf)\);",
                  re.S,
              )
              text, count = pattern.subn(
                  r"\1                drain_complete_http_request(&mut stream);",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one socket-read patch in {name}, got {count}")

          main.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check
          git diff -- scripts/build_windows_release.ps1 src-tauri/src/main.rs

      - name: Create exact candidate commit and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-release-source-repair-certify.yml
          git add scripts/build_windows_release.ps1 src-tauri/src/main.rs
          git commit -m "ci(release): make Windows certification fail closed"
          $sha = (git rev-parse HEAD).Trim()
          "CANDIDATE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CANDIDATE_SHA=$sha"

      - name: Build and test exact Windows candidate
        shell: pwsh
        run: ./scripts/build_windows_release.ps1

      - name: Clean-install exact Windows candidate
        shell: pwsh
        run: ./scripts/smoke_installed_windows_release.ps1

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri\target\release\bundle"
          $files = Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not $files -or $files.Count -lt 1) { throw "No release installers found for checksum generation." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($PWD.Path, $file.FullName).Replace('\\', '/')
            "$hash  $relative"
          }
          $lines | Set-Content -Path "release-checksums.sha256" -Encoding utf8
          Get-Content "release-checksums.sha256"

      - name: Push certified candidate only after all gates pass
        shell: pwsh
        run: |
          $remote = (git ls-remote origin refs/heads/release/v1-productization-final).Split("`t")[0]
          $parent = (git rev-parse HEAD^).Trim()
          if ($remote -ne $parent) {
            throw "Release branch moved during certification: remote=$remote expected_parent=$parent"
          }
          git push origin HEAD:release/v1-productization-final
          Write-Host "CERTIFIED_AND_PUSHED_SHA=$env:CANDIDATE_SHA"

      - name: Upload certified installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-marketing-department-v1-windows-${{ env.CANDIDATE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            release-checksums.sha256
