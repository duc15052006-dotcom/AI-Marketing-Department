name: Candidate Fix Model Settings 5A5B Contract

on:
  push:
    branches: [integration/final-main-reconciliation-v1]

permissions:
  contents: write

jobs:
  fix-model-settings-contract:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: '1'
      AI_MARKETING_MEMORY_EPHEMERAL: '1'
      AI_MARKETING_LEARNING_EPHEMERAL: '1'
      RUN_LIVE_PROVIDER_TESTS: '0'
      RUN_REAL_MODEL_TEST: '0'
      RUN_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
      - name: Patch only stale active-run model-call assertion
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('tests/test_prod_model_settings_01.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertEqual(mock_a.generate.call_count, 6)'
          new = '        self.assertEqual(mock_a.generate.call_count, 7)'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected exactly one stale model-settings anchor, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -
      - name: Run complete certified model settings regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01
      - name: Remove temporary workflow and commit clean repair
        shell: pwsh
        run: |
          Remove-Item .github/workflows/candidate-fix-model-settings-5ab-contract.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_prod_model_settings_01.py .github/workflows/candidate-fix-model-settings-5ab-contract.yml
          git diff --cached --check
          git commit -m "test(settings): align active-run contract with Performance 5A/5B"
          git push origin HEAD:integration/final-main-reconciliation-v1
