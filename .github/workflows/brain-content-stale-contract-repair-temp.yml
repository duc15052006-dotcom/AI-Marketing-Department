name: Brain Content Stale Contract Repair Temp

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'ci(brain): stage exact stale Content contract repair'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Apply exact test-only canonical Content repairs
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          replacements = (
              ('RuntimeStage.STRATEGIST', 'RuntimeStage.CONTENT'),
              ('execute_stage_strategist', 'execute_stage_content'),
              ('ctx.stage_outputs["strategist"]', 'ctx.stage_outputs["content"]'),
              ("ctx.stage_outputs['strategist']", "ctx.stage_outputs['content']"),
              ('stage_outputs["strategist"]', 'stage_outputs["content"]'),
              ("stage_outputs['strategist']", "stage_outputs['content']"),
              ('compile_grounded_package("strategist"', 'compile_grounded_package("content"'),
              ("compile_grounded_package('strategist'", "compile_grounded_package('content'"),
              ('prompts_for(gw, "strategist")', 'prompts_for(gw, "content")'),
              ("prompts_for(gw, 'strategist')", "prompts_for(gw, 'content')"),
              ('if l == "strategist"', 'if l == "content"'),
              ("if l == 'strategist'", "if l == 'content'"),
              ('("strategist", "Marketing Strategist")', '("content", "Content Strategy, Copywriting & Distribution")'),
              ("('strategist', 'Marketing Strategist')", "('content', 'Content Strategy, Copywriting & Distribution')"),
              ('{"cmo", "intelligence", "strategist", "creative", "performance"}', '{"cmo", "intelligence", "content", "creative", "performance"}'),
              ("{'cmo', 'intelligence', 'strategist', 'creative', 'performance'}", "{'cmo', 'intelligence', 'content', 'creative', 'performance'}"),
          )

          changed = []
          for path in Path('tests').glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          exact = {
              'tests/test_prod_model_gateway_01_provider_registry.py': (
                  'self.assertEqual(normalize_agent_id("strategist"), "STRATEGIST")',
                  'self.assertEqual(normalize_agent_id("strategist"), "CONTENT")',
              ),
              'tests/test_runtime_agent_dna_wiring_28.py': (
                  '"content": "Marketing Strategy & Growth Architect"',
                  '"content": "Content Strategy, Copywriting & Distribution"',
              ),
              'tests/test_strategist_definition.py': (
                  '"do not fill the gap with plausible prose"',
                  '"Do not fill the gap with plausible prose"',
              ),
          }
          for rel, (old, new) in exact.items():
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(rel)
              elif new not in text:
                  raise SystemExit(f'expected assertion shape missing: {rel}')

          changed = sorted(set(changed))
          print('CHANGED=' + ','.join(changed))
          if not changed:
              raise SystemExit('no test repair changes produced')
          '@ | python -

      - name: Enforce test-only diff
        shell: pwsh
        run: |
          $bad = git diff --name-only | Where-Object { $_ -notlike 'tests/*' }
          if ($bad) { Write-Error "Non-test changes detected: $bad"; exit 1 }

      - name: Verify focused repaired contracts
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_strategist_definition `
            tests.test_prod_model_gateway_01_provider_registry `
            tests.test_runtime_agent_dna_wiring_28 `
            tests.test_collaboration_adversarial_final `
            tests.test_material_factual_claim_coverage

      - name: Commit verified test-only migration and remove this workflow
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/brain-content-stale-contract-repair-temp.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/brain-content-stale-contract-repair-temp.yml
          git commit -m 'test(brain): migrate stale contracts to canonical Content'
          git push origin HEAD:fix/brain-content-canonical-role-v1
