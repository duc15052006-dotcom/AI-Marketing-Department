name: Model Policy Default Fallback Authority V1

on:
  push:
    branches:
      - test/model-policy-default-fallback-authority-v1

permissions:
  contents: read

concurrency:
  group: model-policy-default-fallback-authority-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  causal-default-fallback-authority:
    name: Ubuntu Python 3.12 causal default fallback authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Record exact-head identity
        run: |
          echo "github_sha=${{ github.sha }}"
          git rev-parse HEAD
          python --version
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile causal sources
        run: python -m compileall -q integrations/models tests/test_model_policy_default_fallback_authority_v1.py
      - name: Run causal regression — default fallback authority
        run: python -m unittest -v tests.test_model_policy_default_fallback_authority_v1
      - name: Verify clean checkout after tests
        if: always()
        run: git diff --exit-code
