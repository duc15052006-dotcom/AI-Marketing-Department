name: Desktop Release Build V1

on:
  push:
    branches:
      - release/v1-productization-final
  pull_request:
    paths:
      - "app_api/**"
      - "brain/**"
      - "chat/**"
      - "config/**"
      - "connections/**"
      - "connectors/**"
      - "creative_engine/**"
      - "frontend/**"
      - "governance/**"
      - "integrations/**"
      - "knowledge/**"
      - "memory/**"
      - "observability/**"
      - "packaging/**"
      - "plugins/**"
      - "runtime/**"
      - "schemas/**"
      - "scripts/build_windows_release.ps1"
      - "scripts/smoke_packaged_model_connection.ps1"
      - "scripts/smoke_installed_windows_release.ps1"
      - "src-tauri/**"
      - "tools/**"
      - "workspace/**"
      - "requirements.txt"
      - "tests/test_release_productization_v1.py"
      - "README.md"
      - ".github/workflows/desktop-release-build-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-v1-installer:
    name: Windows v1 standalone installer certification
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      AI_MARKETING_MEMORY_EPHEMERAL: "1"
      AI_MARKETING_LEARNING_EPHEMERAL: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build and certify standalone Windows release
        shell: pwsh
        run: ./scripts/build_windows_release.ps1

      - name: Clean-install and launch installed desktop
        shell: pwsh
        run: ./scripts/smoke_installed_windows_release.ps1

      - name: Generate installer SHA-256 checksums
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri\target\release\bundle"
          $files = Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not $files -or $files.Count -lt 1) { throw "No release installers found for checksum generation." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($PWD.Path, $file.FullName).Replace('\\', '/')
            "$hash  $relative"
          }
          $lines | Set-Content -Path "release-checksums.sha256" -Encoding utf8
          Get-Content "release-checksums.sha256"

      - name: Upload certified Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-marketing-department-v1-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            release-checksums.sha256
