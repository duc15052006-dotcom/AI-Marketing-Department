name: TMP Apply Creative Gate V1

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply fail-closed Creative prerequisite gate
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")
          marker = "Creative prerequisite is terminal before retrieval/tool side effects."
          if marker in text:
              raise SystemExit(0)

          needle = '        k_res, _ = self._build_stage_lineage_context("creative", context, include_memory=False)\n'
          if needle not in text:
              raise SystemExit("CREATIVE_GATE_PATCH_ANCHOR_NOT_FOUND")

          guard = '''        # Creative prerequisite is terminal before retrieval/tool side effects.\n        # If Strategist already failed, this stage must not spend tool budget,\n        # create receipts/artifacts, or claim grounded Creative provenance.\n        if context.status == RuntimeStatus.FAILED or context.stage_outputs.get("strategist", {}).get("status") == "FAILED":\n            context.status = RuntimeStatus.FAILED\n            if emitter:\n                emitter.emit(\n                    ProgressEventType.RUN_FAILED,\n                    stage="CREATIVE",\n                    agent="CREATIVE",\n                    message="Giai đoạn Creative thất bại do giai đoạn trước gặp sự cố",\n                    metadata={"error": "PREVIOUS_STAGE_FAILED"},\n                )\n            output = {\n                "stage": "CREATIVE",\n                "agent": "creative",\n                "status": "FAILED",\n                "error": "PREVIOUS_STAGE_FAILED",\n                "concept_name": "",\n                "visual_asset_receipt": None,\n                "creative_synthesis": "",\n                "copy_headlines": [],\n                "citations": [],\n            }\n            context.stage_outputs["creative"] = output\n            context.create_checkpoint()\n            return output\n\n'''

          patched = text.replace(needle, guard + needle, 1)
          with path.open("w", encoding="utf-8", newline="\n") as fh:
              fh.write(patched)
          '@ | Set-Content -Encoding utf8 .ci-apply-creative-gate.py
          python .ci-apply-creative-gate.py

      - name: Verify targeted GREEN before commit
        shell: pwsh
        run: |
          python -m unittest -v tests.test_creative_prerequisite_tool_gate_adversarial_v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit isolated production patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Creative gate already applied; no commit required."
            exit 0
          }
          git commit -m "fix(runtime): gate Creative before tool execution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}