name: Provider Preflight Revoke Race Validation

on:
  push:
    branches:
      - fix/provider-preflight-revoke-race-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-hermetic-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Record identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          "github_sha=${{ github.sha }}" | Tee-Object -FilePath .ci-results/identity.txt
          git rev-parse HEAD 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
      - name: Compile relevant sources
        shell: pwsh
        run: |
          python -m py_compile connectors/marketing/preflight.py tests/test_provider_preflight_consent_v1.py tests/test_provider_preflight_revoke_race.py 2>&1 | Tee-Object -FilePath .ci-results/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run provider preflight regression suite
        shell: pwsh
        run: |
          python -m unittest -v tests.test_provider_preflight_consent_v1 tests.test_provider_preflight_revoke_race 2>&1 | Tee-Object -FilePath .ci-results/preflight-suite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full hermetic unittest discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/full-hermetic-unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-revoke-race-full-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
