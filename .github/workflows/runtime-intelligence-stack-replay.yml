name: Runtime Intelligence Stack Replay

on:
  push:
    branches:
      - feat/runtime-intelligence-adaptive-fanout-v1

permissions:
  contents: write

jobs:
  replay-clean-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-intelligence-adaptive-fanout-v1
          fetch-depth: 0
      - name: Replay qualified production and test commits only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for sha in \
            f7cf4cb9a944e240df80b4923ae93ff8987cb75d \
            1d8b5351ca963f27109fb75b39aa3ca745d3d8e8
          do
            git fetch origin "$sha"
            git cherry-pick "$sha"
          done
      - name: Remove replay harness and push clean branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-intelligence-stack-replay.yml
          git commit -m "chore(runtime): remove temporary intelligence stack replay workflow"
          git push origin HEAD:feat/runtime-intelligence-adaptive-fanout-v1
