name: Candidate Fix Performance Two-Pass Regressions

on:
  push:
    branches: [integration/final-main-reconciliation-v1]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/_candidate_fix_perf_two_pass_regressions.py
