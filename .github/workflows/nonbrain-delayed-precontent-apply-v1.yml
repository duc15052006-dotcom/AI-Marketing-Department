name: Non-Brain Delayed Precontent Apply V1

on:
  push:
    branches:
      - fix/nonbrain-delayed-precontent-fallback-v1

permissions:
  contents: write

concurrency:
  group: nonbrain-delayed-precontent-apply-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
  AI_MARKETING_MEMORY_EPHEMERAL: "1"
  AI_MARKETING_LEARNING_EPHEMERAL: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-and-verify:
    if: github.event.head_commit.message != 'fix(models): fallback after delayed precontent stream error'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/nonbrain-delayed-precontent-fallback-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify triggering head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_head_sha=${expected}"
          echo "actual_head_sha=${actual}"
          test "${actual}" = "${expected}"

      - name: Apply exact minimal gateway patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")

          old_vars = """            candidate_visible_content = False
                      candidate_terminal_seen = False
                      stream_gen = None
          """
          new_vars = """            candidate_visible_content = False
                      candidate_terminal_seen = False
                      candidate_fallback_error: Optional[ModelStreamError] = None
                      stream_gen = None
          """
          if text.count(old_vars) != 1:
              raise SystemExit(f"PATCH_ANCHOR_VARS_MISMATCH:{text.count(old_vars)}")
          text = text.replace(old_vars, new_vars, 1)

          marker = "                # 5. Process remaining deltas from stream_gen\n"
          if text.count(marker) != 1:
              raise SystemExit(f"PATCH_STREAM_MARKER_MISMATCH:{text.count(marker)}")
          prefix, suffix = text.split(marker, 1)

          old_error = """                        if delta.finish_reason == \"error\":
                                      terminal_err = normalize_public_stream_error(delta.error, default_provider=cand_provider)
                                      internal_code = stream_error_to_provider_error_code(terminal_err)
                                      self.config_service.record_error(cand_provider, internal_code)
                                      if internal_code == ProviderErrorCode.RATE_LIMIT_429:
                                          self.update_provider_health(cand_provider, ProviderHealth.RATE_LIMITED)
                                      elif internal_code == ProviderErrorCode.AUTH_401:
                                          self.update_provider_health(cand_provider, ProviderHealth.AUTH_ERROR)
                                      elif internal_code == ProviderErrorCode.PERMISSION_403:
                                          self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)
                                      elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):
                                          self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)
                                      if delta.content:
                                          yield normalize_public_stream_delta(
                                              StreamDelta(content=delta.content, finish_reason=None),
                                              cand_provider,
                                              cand_model,
                                          )
                                      yield normalize_public_stream_delta(
                                          StreamDelta(
                                              content=\"\",
                                              finish_reason=\"error\",
                                              error=terminal_err,
                                          ),
                                          cand_provider,
                                          cand_model,
                                      )
                                      return
          """
          new_error = """                        if delta.finish_reason == \"error\":
                                      terminal_err = normalize_public_stream_error(delta.error, default_provider=cand_provider)
                                      internal_code = stream_error_to_provider_error_code(terminal_err)
                                      self.config_service.record_error(cand_provider, internal_code)
                                      if internal_code == ProviderErrorCode.RATE_LIMIT_429:
                                          self.update_provider_health(cand_provider, ProviderHealth.RATE_LIMITED)
                                      elif internal_code == ProviderErrorCode.AUTH_401:
                                          self.update_provider_health(cand_provider, ProviderHealth.AUTH_ERROR)
                                      elif internal_code == ProviderErrorCode.PERMISSION_403:
                                          self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)
                                      elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):
                                          self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)
                                      if not candidate_visible_content:
                                          last_error = terminal_err
                                          last_error_provider = cand_provider
                                          last_error_model = cand_model
                                          if strict_model_pin or len(candidates) == 1:
                                              yield normalize_public_stream_delta(
                                                  StreamDelta(content=\"\", finish_reason=\"error\", error=terminal_err),
                                                  cand_provider,
                                                  cand_model,
                                              )
                                              return
                                          candidate_fallback_error = terminal_err
                                          break
                                      if delta.content:
                                          yield normalize_public_stream_delta(
                                              StreamDelta(content=delta.content, finish_reason=None),
                                              cand_provider,
                                              cand_model,
                                          )
                                      yield normalize_public_stream_delta(
                                          StreamDelta(
                                              content=\"\",
                                              finish_reason=\"error\",
                                              error=terminal_err,
                                          ),
                                          cand_provider,
                                          cand_model,
                                      )
                                      return
          """
          if suffix.count(old_error) != 1:
              raise SystemExit(f"PATCH_ERROR_BLOCK_MISMATCH:{suffix.count(old_error)}")
          suffix = suffix.replace(old_error, new_error, 1)

          old_after_loop = """                    else:
                                  yield normalize_public_stream_delta(delta, cand_provider, cand_model)

                          # 6. Generator finished. Check if candidate finished without a terminal delta (Silent EOF)!
          """
          new_after_loop = """                    else:
                                  yield normalize_public_stream_delta(delta, cand_provider, cand_model)

                          if candidate_fallback_error is not None:
                              continue

                          # 6. Generator finished. Check if candidate finished without a terminal delta (Silent EOF)!
          """
          if suffix.count(old_after_loop) != 1:
              raise SystemExit(f"PATCH_AFTER_LOOP_MISMATCH:{suffix.count(old_after_loop)}")
          suffix = suffix.replace(old_after_loop, new_after_loop, 1)

          path.write_text(prefix + marker + suffix, encoding="utf-8")
          PY
          git diff --check
          git diff -- integrations/models/gateway.py

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify patch before persistence
        run: |
          python -m compileall -q integrations/models tests/test_model_gateway_stream_delayed_precontent_error_fallback_v1.py
          python -m unittest -v \
            tests.test_model_gateway_stream_delayed_precontent_error_fallback_v1 \
            tests.test_prod_model_streaming_01 \
            tests.test_prod_structured_provider_stream_error_01 \
            tests.test_prod_model_gateway_01_provider_registry

      - name: Persist minimal production fix and remove temporary apply workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/nonbrain-delayed-precontent-apply-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git diff --cached --check
          git commit -m "fix(models): fallback after delayed precontent stream error"
          git push origin HEAD:fix/nonbrain-delayed-precontent-fallback-v1
