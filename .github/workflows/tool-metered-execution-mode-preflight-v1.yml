name: Tool Metered Execution Mode Preflight V1

on:
  push:
    branches:
      - hardening/metered-execution-mode-preflight-v1
  pull_request:
    branches:
      - hardening/metered-real-idempotency-gate-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metered-execution-mode-preflight:
    name: Metered execution-mode preflight gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact CI identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "actual_sha=${ACTUAL_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED_SHA="${GITHUB_SHA}"
          fi
          echo "expected_sha=${EXPECTED_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip check

      - name: Run metered execution-mode preflight regression
        shell: bash
        run: |
          python -m unittest -v tests.test_tool_gateway_metered_execution_mode_preflight_adversarial_v1

  full-hermetic:
    name: Windows Python 3.12 full hermetic regression
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify and record exact CI identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = (git rev-parse HEAD).Trim()
          if ("${{ github.event_name }}" -eq "pull_request") {
            $expected = "${{ github.event.pull_request.head.sha }}"
          } else {
            $expected = "${{ github.sha }}"
          }
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt -Append
          "runner_os=${{ runner.os }}" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "CI identity mismatch: actual=$actual expected=$expected" }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources and tests
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests 2>&1 | Tee-Object -FilePath .ci-results/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath .ci-results/full-unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exact-head CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metered-execution-mode-preflight-full-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
