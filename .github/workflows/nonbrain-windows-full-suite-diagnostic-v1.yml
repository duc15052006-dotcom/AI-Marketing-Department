name: Non-Brain Windows Full Suite Diagnostic V1

on:
  push:
    branches:
      - diagnostic/nonbrain-windows-full-suite-v1

permissions:
  contents: read

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
  AI_MARKETING_MEMORY_EPHEMERAL: "1"
  AI_MARKETING_LEARNING_EPHEMERAL: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnose-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact head
        shell: pwsh
        run: |
          $expected = "${{ github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "EXACT_HEAD_MISMATCH: expected $expected actual $actual" }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply already-proven Bug 1 repair ephemerally
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tests/test_prod_model_settings_01.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "    def test_23_transient_test_connection_success(self):\n"
          end_marker = "    def test_24_transient_test_connection_auth_failure_classified(self):\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit(f"TEST_BOUNDARY_NOT_FOUND start={start} end={end}")
          section = text[start:end]
          probe_anchor = '        # Mock adapter generate response\n        with patch.object(OpenAICompatibleProviderAdapter, "generate") as mock_gen:\n'
          snapshot = (
              '        expected_global_target = (\n'
              '            self.gateway.model_policy.global_target.provider_id,\n'
              '            self.gateway.model_policy.global_target.model_id,\n'
              '        )\n\n'
              '        # Mock adapter generate response\n'
              '        with patch.object(OpenAICompatibleProviderAdapter, "generate") as mock_gen:\n'
          )
          stale_assertion = '            self.assertEqual(self.gateway.model_policy.global_target.provider_id, "gemini")\n'
          neutral_assertion = (
              '            self.assertEqual(\n'
              '                (\n'
              '                    self.gateway.model_policy.global_target.provider_id,\n'
              '                    self.gateway.model_policy.global_target.model_id,\n'
              '                ),\n'
              '                expected_global_target,\n'
              '            )\n'
          )
          if section.count(probe_anchor) != 1:
              raise SystemExit(f"PROBE_ANCHOR_COUNT={section.count(probe_anchor)}")
          if section.count(stale_assertion) != 1:
              raise SystemExit(f"STALE_ASSERTION_COUNT={section.count(stale_assertion)}")
          section = section.replace(probe_anchor, snapshot, 1)
          section = section.replace(stale_assertion, neutral_assertion, 1)
          path.write_text(text[:start] + section + text[end:], encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_prod_model_settings_01.TestProdModelSettings01.test_23_transient_test_connection_success
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile production and tests
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture full hermetic Windows discovery
        id: full_suite
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v *>&1 | Tee-Object -FilePath windows-test.log
          $code = $LASTEXITCODE
          Set-Content -Path windows-exit-code.txt -Value $code -Encoding ascii
          $patterns = @('^FAIL:', '^ERROR:', '^Traceback', 'AssertionError', '^Ran [0-9]+ tests?', '^FAILED', '^OK$')
          $matches = Select-String -Path windows-test.log -Pattern $patterns -Context 4,16
          if ($matches) {
            $matches | Out-String -Width 240 | Set-Content -Path windows-failure-summary.txt -Encoding utf8
          } else {
            Get-Content windows-test.log -Tail 250 | Set-Content -Path windows-failure-summary.txt -Encoding utf8
          }
          Write-Host "FULL_SUITE_EXIT_CODE=$code"
          exit 0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonbrain-windows-full-suite-diagnostic-${{ github.sha }}
          path: |
            windows-test.log
            windows-failure-summary.txt
            windows-exit-code.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report original full-suite result
        if: always()
        shell: pwsh
        run: |
          $code = [int](Get-Content windows-exit-code.txt -Raw).Trim()
          if ($code -ne 0) {
            Write-Host "Full suite failed with exit code $code; diagnostic artifact was uploaded."
            exit $code
          }
          Write-Host "Full suite passed."
