name: Candidate Checkpoint Hash Scope Integrity

on:
  push:
    branches:
      - candidate/checkpoint-hash-scope-integrity-v1

permissions:
  contents: write

jobs:
  restore-checkpoint-hash-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Prove scope-hash regression is red before patch
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_runtime_checkpoint_hash_scope_integrity
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "EXPECTED_RED_TEST_DID_NOT_FAIL"
            exit 1
          fi
          echo "RED_CONFIRMED: current checkpoint hash does not bind all required scope/approval fields"

      - name: Apply byte-guarded checkpoint hash restoration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('runtime/context.py')
          raw = path.read_bytes()

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          expected_source = 'ae15faa2a00908264275fa397b3995aae11a2698'
          actual_source = git_blob_sha(raw)
          if actual_source != expected_source:
              raise SystemExit(f'RUNTIME_CONTEXT_SOURCE_DRIFT: {actual_source} != {expected_source}')

          text = raw.decode('utf-8')
          old = '        raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{working_state}"\n'
          new = (
              '        raw = (\n'
              '            f"{self.run_id}:{self.stage.value}:{self.status.value}:"\n'
              '            f"{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:"\n'
              '            f"{self.approval_state.value}:{self.pending_approval_id}:"\n'
              '            f"{self.business_id}:{self.project_id}:{self.chat_id}:{working_state}"\n'
              '        )\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'CHECKPOINT_HASH_PATCH_ANCHOR_INVALID: expected 1, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')
          print('CONTEXT_BLOB=' + git_blob_sha(path.read_bytes()))
          PY

      - name: Compile and run focused checkpoint regressions
        shell: bash
        run: |
          python -m py_compile runtime/context.py tests/test_runtime_checkpoint_hash_scope_integrity.py
          python -m unittest \
            tests.test_runtime_checkpoint_hash_scope_integrity \
            tests.test_checkpoint_semantic_hash_integrity_adversarial_v1 \
            tests.test_app_backend_durable_job_store_wiring_adversarial_v1 \
            tests.test_final_cmo_deployment_provenance \
            tests.test_final_cmo_deployment_registry_isolation \
            tests.test_final_cmo_direct_publish_seam \
            tests.test_approval_reference_scope_isolation
          git diff --check

      - name: Commit validated checkpoint hash restoration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "candidate-hardening-bot"
          git config user.email "candidate-hardening-bot@users.noreply.github.com"
          git rm .github/workflows/candidate_checkpoint_hash_scope_integrity.yml
          git add runtime/context.py
          git diff --cached --check
          git status --short
          git commit -m "fix(runtime): bind checkpoint hash to scope and approval"
          git push origin HEAD:candidate/checkpoint-hash-scope-integrity-v1
