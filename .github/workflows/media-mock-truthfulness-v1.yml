name: Media Mock Truthfulness V1

on:
  pull_request:
    paths:
      - "tools/capabilities.py"
      - "tools/adapters.py"
      - "tests/test_media_mock_truthfulness_adversarial_v1.py"
      - ".github/workflows/media-mock-truthfulness-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-mock-truthfulness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-truthfulness:
    name: Creative media mock truthfulness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      AI_MARKETING_MEMORY_EPHEMERAL: "1"
      AI_MARKETING_LEARNING_EPHEMERAL: "1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_head_sha=${expected}"
          echo "actual_head_sha=${actual}"
          test "${actual}" = "${expected}"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile and run media truthfulness regressions
        run: |
          python -m compileall -q tools tests/test_media_mock_truthfulness_adversarial_v1.py
          python -m unittest -v \
            tests.test_media_mock_truthfulness_adversarial_v1 \
            tests.test_phase5_1_foundation \
            tests.test_prod_truth_01_execution_truthfulness \
            tests.test_creative_prerequisite_tool_gate_adversarial_v1 \
            tests.test_capability_registry_policy_immutability_adversarial_v2 \
            tests.test_tool_gateway_capability_availability_gate_adversarial_v1
