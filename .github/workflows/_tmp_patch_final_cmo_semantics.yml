name: Temporary Final CMO semantics patch

on:
  push:
    branches:
      - release/v1-productization-final
    paths:
      - .github/workflows/_tmp_patch_final_cmo_semantics.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1-productization-final
          fetch-depth: 0

      - name: Apply guarded runtime patch and regression test
        shell: bash
        run: |
          cat > /tmp/apply_patch.py <<'PY'
          from pathlib import Path
          import base64

          path = Path('runtime/engine.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('        if not approved_for_deployment and not conditional_approval:\n            context.status = RuntimeStatus.FAILED\n            joined_reasons = "; ".join(audit_res.blocking_reasons)[:400]\n            context.risk_flags.append(f"FINAL_CMO_NOT_AUTHORIZED: {joined_reasons}")\n            if emitter:\n                emitter.emit(\n                    ProgressEventType.RUN_FAILED,\n                    stage="FINAL_CMO",\n                    agent="CMO",\n                    message=f"Giai đoạn Final CMO không được phê duyệt: {joined_reasons}",\n                    metadata={"authorization_status": audit_res.authorization_status},\n                )\n', '        if not approved_for_deployment and not conditional_approval:\n            joined_reasons = "; ".join(audit_res.blocking_reasons)[:400]\n            context.risk_flags.append(f"FINAL_CMO_NOT_AUTHORIZED: {joined_reasons}")\n'),
              ('            "approval_status": audit_res.authorization_status,\n', '            "approval_status": audit_res.authorization_status,\n            "approved_for_deployment": approved_for_deployment,\n'),
              ('        if emitter and approved_for_deployment:\n', '        if emitter:\n'),
              ('                message="Hoàn tất giai đoạn Final CMO và được phê duyệt triển khai",\n', '                message=(\n                    "Hoàn tất giai đoạn Final CMO và được phê duyệt triển khai"\n                    if approved_for_deployment\n                    else "Hoàn tất giai đoạn Final CMO; triển khai chưa được phê duyệt"\n                ),\n'),
              ('        if context.status not in (RuntimeStatus.FAILED, RuntimeStatus.CANCELLED) and cmo_final.get("status") in ("READY_FOR_DEPLOYMENT", "APPROVED", "COMPLETED"):\n', '        if (\n            context.status not in (RuntimeStatus.FAILED, RuntimeStatus.CANCELLED)\n            and cmo_final.get("status") in (\n                "READY_FOR_DEPLOYMENT",\n                "READY_FOR_HUMAN_APPROVAL",\n                "NOT_READY",\n                "APPROVED",\n                "COMPLETED",\n            )\n        ):\n'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Guarded patch expected exactly one match, found {count} for:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('tests/test_final_cmo_blocked_semantics.py').write_bytes(base64.b64decode(''))
          PY
          python /tmp/apply_patch.py
          python -m py_compile runtime/engine.py tests/test_final_cmo_blocked_semantics.py
          python -m unittest discover -s tests -p 'test_final_cmo_blocked_semantics.py' -v

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_patch_final_cmo_semantics.yml
          git add runtime/engine.py tests/test_final_cmo_blocked_semantics.py
          git commit -m "fix: separate final CMO governance block from runtime failure"
          git push origin HEAD:release/v1-productization-final
