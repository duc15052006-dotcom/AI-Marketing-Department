name: Model Gateway Fallback Stream Close V1

on:
  push:
    branches:
      - test/model-gateway-fallback-stream-close-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-gateway-fallback-stream-close-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regression:
    name: Ubuntu Python 3.12 focused — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: causal-fallback-stream-close
            module: tests.test_model_gateway_fallback_stream_close_v1
          - label: late-result-timeout
            module: tests.test_model_gateway_late_result_timeout_v1
          - label: stream-timeout-budget
            module: tests.test_model_gateway_stream_timeout_budget_v1
          - label: model-streaming
            module: tests.test_prod_model_streaming_01
          - label: structured-provider-stream-error
            module: tests.test_prod_structured_provider_stream_error_01
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        run: |
          echo "github_sha=${{ github.sha }}"
          echo "github_ref=${{ github.ref }}"
          echo "module=${{ matrix.module }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile model and regression sources
        run: |
          python -m compileall -q integrations/models tests/test_model_gateway_fallback_stream_close_v1.py tests/test_model_gateway_late_result_timeout_v1.py tests/test_model_gateway_stream_timeout_budget_v1.py

      - name: Run focused regression — ${{ matrix.label }}
        run: python -m unittest -v ${{ matrix.module }}

      - name: Verify clean checkout after tests
        if: always()
        run: git diff --exit-code

  windows-full-hermetic:
    name: Windows Python 3.12 full hermetic discovery
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        shell: pwsh
        run: |
          Write-Host "github_sha=${{ github.sha }}"
          Write-Host "github_ref=${{ github.ref }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run full hermetic unittest discovery
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Verify clean checkout after tests
        if: always()
        run: git diff --exit-code

  windows-parent-control:
    name: Windows parent #334 full hermetic control
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact parent #334
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: a59090280b4862c9c8d39537e86057566602672e

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record parent-control identity
        shell: pwsh
        run: |
          Write-Host "expected_parent=a59090280b4862c9c8d39537e86057566602672e"
          python --version
          $actual = git rev-parse HEAD
          Write-Host "actual_parent=$actual"
          if ($actual -ne "a59090280b4862c9c8d39537e86057566602672e") { throw "Parent-control checkout mismatch" }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run parent full hermetic unittest discovery
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Verify clean parent checkout after tests
        if: always()
        run: git diff --exit-code
