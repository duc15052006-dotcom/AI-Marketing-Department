name: One-shot Finish Content Role Migration

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
    paths:
      - '.github/workflows/zz-one-shot-finish-content-role-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - name: Apply authority and fixture migration
        run: python .github/scripts/zz_finish_content_role_migration.py

      - name: Compile affected namespaces
        run: python -m compileall -q brain runtime tools tests

      - name: Run targeted canonical role and authority regressions
        run: |
          python -m unittest -v \
            tests.test_brain_canonical_agent_identity_v1 \
            tests.test_brain_action_intent_capability_binding_v1 \
            tests.test_brain_analytics_semantic_capability_binding_v1 \
            tests.test_brain_creative_semantic_capability_binding_v1 \
            tests.test_brain_file_data_semantic_capability_binding_v1 \
            tests.test_brain_collaboration_intelligence_v1 \
            tests.test_brain_reasoning_policy_v1 \
            tests.test_brain_cognitive_contract_v1 \
            tests.test_brain_action_intent_execution_intent_provenance_v1 \
            tests.test_brain_canonical_action_intent_tool_gateway_v1 \
            tests.test_brain_action_intent_receipt_provenance_v1 \
            tests.test_brain_observation_action_intent_provenance_v1 \
            tests.test_brain_runtime_canonical_action_intent_handoff_v1

      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/capabilities.py tests/test_brain_collaboration_intelligence_v1.py tests/test_brain_reasoning_policy_v1.py tests/test_brain_cognitive_contract_v1.py tests/test_brain_action_intent_execution_intent_provenance_v1.py tests/test_brain_canonical_action_intent_tool_gateway_v1.py tests/test_brain_action_intent_receipt_provenance_v1.py tests/test_brain_observation_action_intent_provenance_v1.py tests/test_brain_runtime_canonical_action_intent_handoff_v1.py
          git commit -m "fix(brain): finish canonical Content authority migration"
          git push origin HEAD:fix/brain-content-canonical-role-v1
