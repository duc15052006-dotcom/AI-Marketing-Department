name: One-shot Finish Content Role Migration

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
    paths:
      - '.github/workflows/zz-one-shot-finish-content-role-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply canonical Content authority and fixture migration
        run: python .github/scripts/zz_finish_content_role_migration.py

      - name: Verify Content RBAC boundary
        run: |
          python - <<'PY'
          from tools.capabilities import PermissionLevel
          from tools.security import AGENT_DEFAULT_PERMISSIONS

          expected = {PermissionLevel.READ_ONLY, PermissionLevel.CREATE_LOCAL}
          actual = AGENT_DEFAULT_PERMISSIONS.get("content")
          assert actual == expected, (actual, expected)
          assert "strategist" not in AGENT_DEFAULT_PERMISSIONS
          assert PermissionLevel.ANALYTICS not in actual
          PY

      - name: Compile affected namespaces
        run: python -m compileall -q brain runtime tools tests

      - name: Run targeted canonical role and authority regressions
        run: |
          python -m unittest -v \
            tests.test_brain_canonical_agent_identity_v1 \
            tests.test_brain_action_intent_capability_binding_v1 \
            tests.test_brain_analytics_semantic_capability_binding_v1 \
            tests.test_brain_creative_semantic_capability_binding_v1 \
            tests.test_brain_file_data_semantic_capability_binding_v1 \
            tests.test_brain_collaboration_intelligence_v1 \
            tests.test_brain_reasoning_policy_v1 \
            tests.test_brain_cognitive_contract_v1 \
            tests.test_brain_action_intent_execution_intent_provenance_v1 \
            tests.test_brain_canonical_action_intent_tool_gateway_v1 \
            tests.test_brain_action_intent_receipt_provenance_v1 \
            tests.test_brain_observation_action_intent_provenance_v1 \
            tests.test_brain_runtime_canonical_action_intent_handoff_v1

      - name: Remove one-shot migration tooling
        run: |
          rm .github/scripts/zz_finish_content_role_migration.py
          rm .github/workflows/zz-one-shot-finish-content-role-migration.yml

      - name: Commit verified migration atomically
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git commit -m "fix(brain): close canonical Content authority migration"
          git push origin HEAD:fix/brain-content-canonical-role-v1
