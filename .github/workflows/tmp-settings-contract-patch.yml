name: Temporary Settings Contract Patch

on:
  push:
    branches: [fix/settings-cert-contract-12]

permissions:
  contents: write

jobs:
  patch-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-cert-contract-12
          fetch-depth: 0

      - name: Apply exact contract replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_prod_model_settings_01.py')
          text = path.read_text(encoding='utf-8')

          old1 = '''        self.assertIn("providers", body)\n        self.assertNotIn("api_key", json.dumps(body))\n'''
          new1 = '''        self.assertIn("providers", body)\n        # Secret-field names must be absent exactly; safe auth-policy metadata\n        # such as ``requires_api_key`` is intentionally public.\n        self.assertNotIn("api_key", body)\n        for provider in body["providers"]:\n            self.assertNotIn("api_key", provider)\n            self.assertNotIn("credential_ref", provider)\n'''
          if text.count(old1) != 1:
              raise SystemExit(f'expected exactly one API safe-data assertion block, found {text.count(old1)}')
          text = text.replace(old1, new1, 1)

          old2 = '''        # Generic allow path for declared-free providers (any name).\n        self.settings_manager.upsert_provider(\n            {"provider_id": "thespark", "adapter_type": "OPENAI_COMPATIBLE",\n             "base_url": "https://api.free-named.test/v1", "default_model": "m-f",\n             "cost_policy": "FREE_TIER_ALLOWED"},\n            secret="F_KEY",\n        )\n        self.settings_manager.update_settings({"global_target": {"provider_id": "thespark", "model_id": "m-f"}})\n        snap2 = self.registry.snapshot().model_dump()\n        pol2 = self.gateway.model_policy.model_dump()\n        with patch.object(_Ad, "generate", lambda self_, rq: ModelResponse(\n                request_id=rq.request_id, provider="thespark", model_name=rq.model_name,\n                status=ModelResponseStatus.SUCCESS, content="ok")):\n            r_ok = self._pin_generate(self.gateway, self.registry, snap2, pol2, "UNK-2", "m-f")\n        self.assertEqual(r_ok.status, ModelResponseStatus.SUCCESS)\n'''
          new2 = '''        # Generic allow path for a declared-free CUSTOM provider. Built-in\n        # TheSpark is intentionally excluded because its canonical safety floor is PAID.\n        self.settings_manager.upsert_provider(\n            {"provider_id": "declared_free_custom", "adapter_type": "OPENAI_COMPATIBLE",\n             "base_url": "https://api.free-named.test/v1", "default_model": "m-f",\n             "cost_policy": "FREE_TIER_ALLOWED"},\n            secret="F_KEY",\n        )\n        self.settings_manager.update_settings({"global_target": {"provider_id": "declared_free_custom", "model_id": "m-f"}})\n        snap2 = self.registry.snapshot().model_dump()\n        pol2 = self.gateway.model_policy.model_dump()\n        with patch.object(_Ad, "generate", lambda self_, rq: ModelResponse(\n                request_id=rq.request_id, provider="declared_free_custom", model_name=rq.model_name,\n                status=ModelResponseStatus.SUCCESS, content="ok")):\n            r_ok = self._pin_generate(self.gateway, self.registry, snap2, pol2, "UNK-2", "m-f")\n        self.assertEqual(r_ok.status, ModelResponseStatus.SUCCESS)\n'''
          if text.count(old2) != 1:
              raise SystemExit(f'expected exactly one FREE_ONLY allow block, found {text.count(old2)}')
          text = text.replace(old2, new2, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- tests/test_prod_model_settings_01.py

      - name: Commit exact test-only patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_prod_model_settings_01.py
          git diff --cached --quiet && exit 0
          git commit -m "test: align settings certification with hardened contracts"
          git push origin HEAD:fix/settings-cert-contract-12
