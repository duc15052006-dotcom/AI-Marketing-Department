name: Temporary Provider Seven-Call Contract Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/final-main-reconciliation-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Repair stale provider routing contract and self-delete
        shell: python
        run: |
          from pathlib import Path

          target = Path('tests/test_prod_model_gateway_01_provider_registry.py')
          text = target.read_text(encoding='utf-8')
          old = '''        # Provider A was invoked for all 6 stages of RUN-1\n        self.assertEqual(mock_a.generate.call_count, 6)'''
          new = '''        # RUN-1 has 6 logical stages but 7 model requests because Performance executes 5A + 5B.\n        self.assertEqual(mock_a.generate.call_count, 7)'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale provider-routing contract, found {text.count(old)}')
          target.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/tmp-provider-seven-call-repair.yml').unlink()

      - name: Commit repaired test-only contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_prod_model_gateway_01_provider_registry.py .github/workflows/tmp-provider-seven-call-repair.yml
          git diff --cached --check
          git commit -m "test(provider): align active-run routing with Performance 5A/5B"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
