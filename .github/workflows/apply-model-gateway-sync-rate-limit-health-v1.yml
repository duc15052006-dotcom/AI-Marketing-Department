name: Apply Model Gateway Sync Rate Limit Health V1

on:
  push:
    branches:
      - test/model-gateway-sync-rate-limit-health-v1
    paths:
      - .github/workflows/apply-model-gateway-sync-rate-limit-health-v1.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: test/model-gateway-sync-rate-limit-health-v1
          fetch-depth: 0

      - name: Apply minimal sync 429 health fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")
          before = """            if resp.status == ModelResponseStatus.RATE_LIMITED:\n                self.update_provider_health(cand_provider, ProviderHealth.RATE_LIMITED, detail=resp.error)\n"""
          after = """            if resp.status == ModelResponseStatus.RATE_LIMITED or err_code == ProviderErrorCode.RATE_LIMIT_429:\n                self.update_provider_health(cand_provider, ProviderHealth.RATE_LIMITED, detail=resp.error)\n"""
          if text.count(before) != 1:
              raise SystemExit(f"expected exactly one sync rate-limit health anchor, found {text.count(before)}")
          path.write_text(text.replace(before, after, 1), encoding="utf-8")

      - name: Commit production fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git diff --cached --check
          git commit -m "fix(models): preserve classified rate-limit provider health"
          git push origin HEAD:test/model-gateway-sync-rate-limit-health-v1

# hosted causal RED observed before this workflow was triggered
