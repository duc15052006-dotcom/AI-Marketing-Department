name: PR60 Checkpoint Repair
on:
  push:
    branches: [fix/checkpoint-index-run-binding-60]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: '0'
      RUN_REAL_MODEL_TEST: '0'
      RUN_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkpoint-index-run-binding-60
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Patch checkpoint row binding
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Compile patched source
        run: python -m py_compile runtime/job_store.py tests/test_checkpoint_index_run_binding_60.py
      - name: Run targeted regressions
        run: python -m unittest -v tests.test_checkpoint_index_run_binding_60 tests.test_platform_job_durability_recovery_v1 tests.test_platform_job_durability_security_v1
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr60-checkpoint-red.yml
          git add runtime/job_store.py tests/test_checkpoint_index_run_binding_60.py
          git diff --cached --check
          git commit -m 'harden: bind checkpoint index metadata to payload'
          git push origin HEAD:fix/checkpoint-index-run-binding-60
