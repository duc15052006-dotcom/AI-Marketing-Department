name: Audit Brain Legacy Authority D4BFE0

on:
  push:
    branches:
      - audit/brain-legacy-authority-d4bfe0
    paths:
      - .github/workflows/audit-brain-legacy-authority-d4bfe0.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact convergence target
        shell: bash
        run: |
          set -euo pipefail
          TARGET=d4bfe0ebb3a93d1f96510a8f23bbdf3899ae9350
          git checkout --detach "$TARGET"
          echo "AUDIT_TARGET=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$TARGET"

      - name: Audit legacy Brain authority
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          TARGET = "d4bfe0ebb3a93d1f96510a8f23bbdf3899ae9350"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == TARGET, (head, TARGET)

          agent_root = Path(".agents/agents")
          agent_dirs = sorted(p.name for p in agent_root.iterdir() if p.is_dir())
          print("=== PHYSICAL AGENT DIRECTORIES ===")
          for name in agent_dirs:
              print(name)
          assert agent_dirs == ["cmo", "content", "creative", "intelligence", "performance"], agent_dirs
          assert not (agent_root / "strategist").exists()

          suffixes = {".py", ".json", ".yml", ".yaml"}
          ignored_parts = {".git", "docs", "artifacts", "evidence"}
          scanned = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              if any(part in ignored_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              scanned.append((path, text))

          forbidden_patterns = {
              "BrainAgentId.STRATEGIST": re.compile(r"BrainAgentId\.STRATEGIST", re.I),
              "AgentId.STRATEGIST": re.compile(r"(?<!Brain)AgentId\.STRATEGIST", re.I),
              "canonical STRATEGIST enum assignment": re.compile(r"^\s*STRATEGIST\s*=\s*['\"]STRATEGIST['\"]", re.I | re.M),
              "strategist supported_agents": re.compile(r"supported_agents\s*=.*strategist", re.I),
          }
          forbidden_hits = []
          for path, text in scanned:
              for label, pattern in forbidden_patterns.items():
                  for match in pattern.finditer(text):
                      line = text.count("\n", 0, match.start()) + 1
                      forbidden_hits.append((str(path), line, label, match.group(0)))

          print("=== CANONICAL STRATEGIST AUTHORITY PATTERNS ===")
          if forbidden_hits:
              for hit in forbidden_hits:
                  print(":".join(map(str, hit)))
          else:
              print("FORBIDDEN_CANONICAL_STRATEGIST_AUTHORITY_FOUND=0")

          print("=== ALL STRATEGIST TEXT RESIDUE (code/config only) ===")
          strategist_hits = []
          for path, text in scanned:
              for lineno, line in enumerate(text.splitlines(), 1):
                  if "strategist" in line.lower():
                      strategist_hits.append((str(path), lineno, line.strip()))
          for hit in strategist_hits:
              print(f"{hit[0]}:{hit[1]}:{hit[2]}")
          print(f"STRATEGIST_RESIDUE_COUNT={len(strategist_hits)}")

          print("=== LEGACY ID NORMALIZATION SURFACES ===")
          legacy_hits = []
          for path, text in scanned:
              for lineno, line in enumerate(text.splitlines(), 1):
                  if "STRATEGIST" in line or "COPYWRITER" in line:
                      legacy_hits.append((str(path), lineno, line.strip()))
          for hit in legacy_hits:
              print(f"{hit[0]}:{hit[1]}:{hit[2]}")
          print(f"LEGACY_ID_HIT_COUNT={len(legacy_hits)}")

          print("=== BRAIN/AGENT CHANGES FROM PRE-CONTENT STACK BASE TO CERTIFIED BRAIN ===")
          diff = subprocess.check_output([
              "git", "diff", "--name-status",
              "b51010d85cb4d3342e9451fe953299301e925b42",
              "fcb9042ee4dd3dc1d8261bb75f1ea8ae3873d2b3",
              "--", "brain", ".agents", "agents", "integrations/models", "tools", "tests"
          ], text=True)
          print("\n".join(diff.splitlines()[:240]))

          print("=== OLD STRATEGIST/CONTENT PATH HISTORY ===")
          role_diff = subprocess.check_output([
              "git", "diff", "--name-status",
              "b51010d85cb4d3342e9451fe953299301e925b42",
              "fcb9042ee4dd3dc1d8261bb75f1ea8ae3873d2b3",
              "--", ".agents/agents/strategist", ".agents/agents/content"
          ], text=True)
          print(role_diff)

          if forbidden_hits:
              raise SystemExit("Forbidden canonical Strategist authority remains")
