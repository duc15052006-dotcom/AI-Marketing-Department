name: Brain ASI Grand Challenge V2

on:
  pull_request:
    paths:
      - "brain/**"
      - "tests/test_brain_asi_grand_challenge_v2.py"
      - ".github/workflows/brain-asi-grand-challenge-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    name: Future ASI semantic holdout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          mkdir -p .ci-results
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          printf 'expected_head_sha=%s\nactual_head_sha=%s\n' "$expected" "$actual" | tee .ci-results/asi-grand-challenge-v2-identity.txt
          test "$expected" = "$actual"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile holdout and cognitive slices
        shell: bash
        run: |
          python -m py_compile \
            brain/metacognition.py \
            brain/learning.py \
            brain/meta_learning.py \
            tests/test_brain_asi_grand_challenge_v2.py

      - name: Run ASI grand challenge V2
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.test_brain_asi_grand_challenge_v2 2>&1 | tee .ci-results/asi-grand-challenge-v2.log

      - name: Run adjacent cognitive regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_brain_meta_learning_policy_v1 \
            tests.test_brain_causal_learning_loop_v1 \
            tests.test_brain_metacognition_intelligence_v1 \
            tests.test_brain_evidence_intelligence_v1 \
            2>&1 | tee .ci-results/asi-grand-challenge-v2-adjacent.log

      - name: Upload holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-asi-grand-challenge-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
