name: Branch Fix Performance Call Count Invariant

on:
  push:
    branches:
      - fix/performance-two-pass-44

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/performance-two-pass-44
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Repair exact assertion formatting
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tests/test_prod_runtime_progress_01.py")
          text = path.read_text(encoding="utf-8")

          bad_one = r'''        # Six workflow stages now require seven model calls because the single\n        # permanent Performance agent executes mandatory internal Pass 5A + 5B.\n        self.assertEqual(gw2.call_count, 7)'''
          good_one = '''        # Six workflow stages now require seven model calls because the single
        # permanent Performance agent executes mandatory internal Pass 5A + 5B.
        self.assertEqual(gw2.call_count, 7)'''

          bad_two = r'''        # A broken progress sink must not add calls beyond the canonical seven.\n        self.assertEqual(gw.call_count, 7)'''
          good_two = '''        # A broken progress sink must not add calls beyond the canonical seven.
        self.assertEqual(gw.call_count, 7)'''

          for old, new in ((bad_one, good_one), (bad_two, good_two)):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ABORTED: expected exactly one malformed block, got {count}")
              text = text.replace(old, new, 1)

          lines = text.splitlines()
          required_assertions = {
              "        self.assertEqual(gw2.call_count, 7)",
              "        self.assertEqual(gw.call_count, 7)",
          }
          missing = required_assertions.difference(lines)
          if missing:
              raise SystemExit(f"PATCH_ABORTED: executable assertion lines missing: {sorted(missing)!r}")
          if any("\\n        self.assertEqual" in line for line in lines):
              raise SystemExit("PATCH_ABORTED: literal newline escape still masks an assertion")

          path.write_text(text, encoding="utf-8")
          print("Repaired progress call-count assertions as executable source lines.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q tests/test_prod_runtime_progress_01.py tests/test_performance_two_pass_32.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_prod_runtime_progress_01 `
            tests.test_performance_two_pass_32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified invariant formatting
        shell: pwsh
        run: |
          git diff --exit-code -- . ':!tests/test_prod_runtime_progress_01.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add tests/test_prod_runtime_progress_01.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Performance call-count assertions executable"
          git push origin HEAD:fix/performance-two-pass-44
