name: Branch Fix Performance Call Count Invariant

on:
  push:
    branches:
      - fix/performance-two-pass-44

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/performance-two-pass-44
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Repair executable assertions
        shell: pwsh
        run: |
          $path = "tests/test_prod_runtime_progress_01.py"
          $text = [System.IO.File]::ReadAllText($path)
          $bad1 = '        # Six workflow stages now require seven model calls because the single\n        # permanent Performance agent executes mandatory internal Pass 5A + 5B.\n        self.assertEqual(gw2.call_count, 7)'
          $good1 = "        # Six workflow stages now require seven model calls because the single`n        # permanent Performance agent executes mandatory internal Pass 5A + 5B.`n        self.assertEqual(gw2.call_count, 7)"
          $bad2 = '        # A broken progress sink must not add calls beyond the canonical seven.\n        self.assertEqual(gw.call_count, 7)'
          $good2 = "        # A broken progress sink must not add calls beyond the canonical seven.`n        self.assertEqual(gw.call_count, 7)"
          if (-not $text.Contains($bad1)) { throw "PATCH_ABORTED: malformed gw2 assertion block not found exactly" }
          if (-not $text.Contains($bad2)) { throw "PATCH_ABORTED: malformed gw assertion block not found exactly" }
          $text = $text.Replace($bad1, $good1).Replace($bad2, $good2)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          $lines = [System.IO.File]::ReadAllLines($path)
          if (-not ($lines -contains '        self.assertEqual(gw2.call_count, 7)')) { throw "gw2 assertion is not executable source" }
          if (-not ($lines -contains '        self.assertEqual(gw.call_count, 7)')) { throw "gw assertion is not executable source" }
          if (([System.IO.File]::ReadAllText($path)).Contains('\n        self.assertEqual')) { throw "literal newline escape still masks an assertion" }
          python -m compileall -q tests/test_prod_runtime_progress_01.py tests/test_performance_two_pass_32.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused regressions
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_runtime_progress_01 tests.test_performance_two_pass_32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified assertion repair
        shell: pwsh
        run: |
          git diff --exit-code -- . ':!tests/test_prod_runtime_progress_01.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add tests/test_prod_runtime_progress_01.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Performance call-count assertions executable"
          git push origin HEAD:fix/performance-two-pass-44
