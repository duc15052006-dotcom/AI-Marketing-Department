name: Temporary Governance Fix 12

on:
  push:
    branches:
      - fix/model-governance-fail-closed-12

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/model-governance-fail-closed-12

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply exact governance patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ANCHOR_MISMATCH: {path}: expected 1 occurrence, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          registry = "integrations/models/registry.py"
          gateway = "integrations/models/gateway.py"

          replace_once(
              registry,
              '''    raise ValueError(\n        f"INVALID_COST_POLICY: cost policy must be a CostPolicy or string, got {type(value).__name__}."\n    )\n\n\n# Security floor for built-ins already classified as paid by this repository.\n''',
              '''    raise ValueError(\n        f"INVALID_COST_POLICY: cost policy must be a CostPolicy or string, got {type(value).__name__}."\n    )\n\n\ndef validate_strict_bool(value: Any, field_name: str) -> bool:\n    """Accept only a real Python bool at governance boundaries.\n\n    bool is intentionally checked by exact type: integers and truthy strings\n    must never silently change execution/cost policy.\n    """\n    if type(value) is bool:\n        return value\n    raise ValueError(\n        f"INVALID_BOOLEAN: {field_name} must be a boolean, got {type(value).__name__}."\n    )\n\n\n# Security floor for built-ins already classified as paid by this repository.\n''',
          )

          replace_once(
              registry,
              '''        # Cost governance must be canonical and fail closed on malformed input.\n        self.cost_policy = normalize_cost_policy(self.cost_policy)\n''',
              '''        # Enable/disable is an execution-governance boundary: reject truthy\n        # strings/integers instead of relying on Python coercion.\n        self.enabled = validate_strict_bool(self.enabled, "ProviderDefinition.enabled")\n\n        # Cost governance must be canonical and fail closed on malformed input.\n        self.cost_policy = normalize_cost_policy(self.cost_policy)\n''',
          )

          replace_once(
              registry,
              '''    def __post_init__(self) -> None:\n        super().__post_init__()\n        # Validate and normalize all agent override keys\n''',
              '''    def __post_init__(self) -> None:\n        super().__post_init__()\n        self.free_only_mode = validate_strict_bool(self.free_only_mode, "ModelPolicy.free_only_mode")\n        # Validate and normalize all agent override keys\n''',
          )

          replace_once(
              registry,
              '''        with self._lock:\n            if pid in getattr(self, "_injected_adapters", {}):\n                return self._injected_adapters[pid]\n\n            cfg = self._configs.get(pid)\n            if cfg is None:\n                return None\n            if not cfg.enabled and not include_disabled:\n                return None\n''',
              '''        with self._lock:\n            cfg = self._configs.get(pid)\n            if cfg is None:\n                return None\n            if type(cfg.enabled) is not bool:\n                logger.error("Blocking provider '%s': enabled must be a strict boolean.", pid)\n                return None\n            if not cfg.enabled and not include_disabled:\n                return None\n\n            if pid in getattr(self, "_injected_adapters", {}):\n                return self._injected_adapters[pid]\n''',
          )

          replace_once(
              registry,
              '''        pid = cfg.provider_id.lower()\n        with self._lock:\n            if pid in getattr(self, "_injected_adapters", {}):\n                return self._injected_adapters[pid]\n\n            fingerprint = self._execution_fingerprint(cfg)\n''',
              '''        pid = cfg.provider_id.lower()\n        with self._lock:\n            if type(cfg.enabled) is not bool or not cfg.enabled:\n                logger.error("Blocking pinned provider '%s': enabled is false or invalid.", pid)\n                return None\n            if pid in getattr(self, "_injected_adapters", {}):\n                return self._injected_adapters[pid]\n\n            fingerprint = self._execution_fingerprint(cfg)\n''',
          )

          replace_once(
              gateway,
              '''    ProviderRegistry,\n    normalize_agent_id,\n)\n''',
              '''    ProviderRegistry,\n    normalize_agent_id,\n    validate_strict_bool,\n)\n''',
          )

          replace_once(
              gateway,
              '''        runtime = get_runtime_config()\n        self._free_only_mode: bool = free_only_mode if free_only_mode is not None else runtime.free_only_mode\n        self._default_provider = (default_provider or runtime.default_provider).lower()\n''',
              '''        runtime = get_runtime_config()\n        resolved_free_only_mode = free_only_mode if free_only_mode is not None else runtime.free_only_mode\n        self._free_only_mode: bool = validate_strict_bool(\n            resolved_free_only_mode,\n            "UniversalModelGateway.free_only_mode",\n        )\n        self._default_provider = (default_provider or runtime.default_provider).lower()\n''',
          )

          replace_once(
              gateway,
              '''    def set_free_only_mode(self, enabled: bool) -> None:\n        """Toggle strict free-only cost governance."""\n        self._free_only_mode = enabled\n        self._model_policy.free_only_mode = enabled\n''',
              '''    def set_free_only_mode(self, enabled: bool) -> None:\n        """Toggle strict free-only cost governance."""\n        validated = validate_strict_bool(enabled, "UniversalModelGateway.free_only_mode")\n        self._free_only_mode = validated\n        self._model_policy.free_only_mode = validated\n''',
          )

          replace_once(
              gateway,
              '''        """Execute model generation with cost policy enforcement and production fallback."""\n        start_time = time.perf_counter()\n\n        # Canonical request normalization\n''',
              '''        """Execute model generation with cost policy enforcement and production fallback."""\n        start_time = time.perf_counter()\n\n        try:\n            allow_paid = validate_strict_bool(allow_paid, "allow_paid")\n            policy_free_only = (\n                validate_strict_bool(model_policy.free_only_mode, "ModelPolicy.free_only_mode")\n                if model_policy is not None\n                else None\n            )\n        except ValueError as e:\n            return ModelResponse(\n                request_id=getattr(request, "request_id", "REQ-UNKNOWN"),\n                provider=provider_id or "gateway",\n                model_name=getattr(request, "model_name", "unknown"),\n                status=ModelResponseStatus.ERROR,\n                error=f"INVALID_GOVERNANCE_BOOLEAN: {e}",\n                usage=ModelUsage(usage_source="NOT_AVAILABLE"),\n                latency_ms=(time.perf_counter() - start_time) * 1000.0,\n            )\n\n        # Canonical request normalization\n''',
          )

          replace_once(
              gateway,
              '''            if prov_def is not None and not prov_def.enabled:\n                err_msg = f"PROVIDER_DISABLED: Provider '{cand_provider}' is disabled."\n''',
              '''            if prov_def is not None and (type(prov_def.enabled) is not bool or not prov_def.enabled):\n                state = "has invalid enabled governance" if type(prov_def.enabled) is not bool else "is disabled"\n                err_msg = f"PROVIDER_DISABLED: Provider '{cand_provider}' {state}."\n''',
          )

          replace_once(
              gateway,
              '''            # Effective cost-governance authority: an explicitly supplied\n            # run-scoped ModelPolicy governs its own runs; live gateway state\n            # applies only when no pinned policy exists. No second authority.\n            effective_free_only = (\n                bool(model_policy.free_only_mode)\n                if model_policy is not None and getattr(model_policy, "free_only_mode", None) is not None\n                else self._free_only_mode\n            )\n\n            if effective_free_only and not allow_paid:\n''',
              '''            if cost_tier == CostPolicy.DISABLED:\n                last_error_resp = ModelResponse(\n                    request_id=norm_req.request_id,\n                    provider=cand_provider,\n                    model_name=cand_model,\n                    status=ModelResponseStatus.ERROR,\n                    error=f"PROVIDER_DISABLED: Provider '{cand_provider}' cost policy is DISABLED.",\n                    usage=ModelUsage(usage_source="NOT_AVAILABLE"),\n                    latency_ms=(time.perf_counter() - start_time) * 1000.0,\n                )\n                if strict_model_pin or len(candidates) == 1:\n                    return last_error_resp\n                continue\n\n            # Effective cost-governance authority: an explicitly supplied\n            # run-scoped ModelPolicy governs its own runs; live gateway state\n            # applies only when no pinned policy exists. No second authority.\n            effective_free_only = policy_free_only if policy_free_only is not None else self._free_only_mode\n\n            if effective_free_only and not allow_paid:\n''',
          )

          replace_once(
              gateway,
              '''        Non-streaming providers are handled via synchronous generate() degradation:\n        the complete response is emitted as a single StreamDelta.\n        """\n        try:\n            norm_req = normalize_model_request(request)\n''',
              '''        Non-streaming providers are handled via synchronous generate() degradation:\n        the complete response is emitted as a single StreamDelta.\n        """\n        try:\n            allow_paid = validate_strict_bool(allow_paid, "allow_paid")\n            policy_free_only = (\n                validate_strict_bool(model_policy.free_only_mode, "ModelPolicy.free_only_mode")\n                if model_policy is not None\n                else None\n            )\n        except ValueError as e:\n            yield normalize_public_stream_delta(\n                StreamDelta(\n                    content="",\n                    finish_reason="error",\n                    error=ModelStreamError(\n                        code="INVALID_REQUEST",\n                        category="BAD_REQUEST",\n                        safe_message=f"INVALID_GOVERNANCE_BOOLEAN: {e}",\n                        retryable=False,\n                        http_status=400,\n                    ),\n                ),\n                provider_id or "gateway",\n                getattr(request, "model_name", "unknown"),\n            )\n            return\n\n        try:\n            norm_req = normalize_model_request(request)\n''',
          )

          replace_once(
              gateway,
              '''            if prov_def is not None and not prov_def.enabled:\n                err = ModelStreamError(\n                    code="PROVIDER_DISABLED",\n                    category="CONFIGURATION",\n                    safe_message=f"PROVIDER_DISABLED: Provider '{cand_provider}' is disabled.",\n''',
              '''            if prov_def is not None and (type(prov_def.enabled) is not bool or not prov_def.enabled):\n                state = "has invalid enabled governance" if type(prov_def.enabled) is not bool else "is disabled"\n                err = ModelStreamError(\n                    code="PROVIDER_DISABLED",\n                    category="CONFIGURATION",\n                    safe_message=f"PROVIDER_DISABLED: Provider '{cand_provider}' {state}.",\n''',
          )

          replace_once(
              gateway,
              '''            effective_free_only = (\n                bool(model_policy.free_only_mode)\n                if model_policy is not None and getattr(model_policy, "free_only_mode", None) is not None\n                else self._free_only_mode\n            )\n\n            if effective_free_only and not allow_paid:\n''',
              '''            if cost_tier == CostPolicy.DISABLED:\n                err = ModelStreamError(\n                    code="PROVIDER_DISABLED",\n                    category="CONFIGURATION",\n                    safe_message=f"PROVIDER_DISABLED: Provider '{cand_provider}' cost policy is DISABLED.",\n                    retryable=False,\n                    http_status=None,\n                )\n                last_error = err\n                last_error_provider = cand_provider\n                last_error_model = cand_model\n                if strict_model_pin or len(candidates) == 1:\n                    yield normalize_public_stream_delta(\n                        StreamDelta(content="", finish_reason="error", error=err),\n                        cand_provider,\n                        cand_model,\n                    )\n                    return\n                continue\n\n            effective_free_only = policy_free_only if policy_free_only is not None else self._free_only_mode\n\n            if effective_free_only and not allow_paid:\n''',
          )

      - name: Compile modified modules
        run: python -m py_compile integrations/models/registry.py integrations/models/gateway.py tests/test_model_governance_fail_closed_12.py

      - name: Run targeted governance regressions
        run: >-
          python -m unittest
          tests.test_model_governance_fail_closed_12
          tests.test_free_only_cost_authority_02
          tests.test_prod_model_gateway_01_provider_registry
          tests.test_prod_model_streaming_01
          -v

      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-governance-fix-12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/registry.py integrations/models/gateway.py tests/test_model_governance_fail_closed_12.py .github/workflows/tmp-governance-fix-12.yml
          git commit -m "fix: enforce model governance fail closed"
          git push origin HEAD:fix/model-governance-fail-closed-12
