name: PR90 Scoped Provenance Patch Helper

on:
  push:
    branches:
      - fix/workspace-scope-provenance-isolation-60

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-scope-provenance-isolation-60
          fetch-depth: 0

      - name: Apply minimal runtime provenance patch
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          payload = base64.b64decode(os.environ['PATCH_GZ_B64'])
          open('/tmp/apply_pr90.py', 'wb').write(gzip.decompress(payload))
          PY
          python /tmp/apply_pr90.py
          git diff --check runtime/engine.py

      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git diff --cached --check
          git commit -m "fix: bind runtime provenance refs to grounded scope"
          git push origin HEAD:fix/workspace-scope-provenance-isolation-60
