name: Apply Runtime Upstream Failed Zero Tool Dispatch Adaptive Stack V1

on:
  push:
    branches:
      - fix/runtime-upstream-failed-zero-tool-dispatch-adaptive-stack-v1
    paths:
      - ".github/workflows/runtime-upstream-failed-zero-tool-dispatch-adaptive-stack-apply-v1.yml"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-production-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object runtime/engine.py)" = "79451e8c0581d65ac2c7296e71a17f79ed2afccb"

      - name: Move remaining upstream failure gates before external work
        run: python .github/scripts/apply_runtime_upstream_failed_zero_tool_dispatch_adaptive_stack_v1.py

      - name: Verify production patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "runtime/engine.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile patched engine
        run: python -m py_compile runtime/engine.py

      - name: Run targeted regressions before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_upstream_failed_zero_tool_dispatch_adaptive_stack_v1 \
            tests.test_runtime_creative_tool_before_stage_gate_v1 \
            tests.test_runtime_intelligence_adaptive_fanout_v1 \
            tests.test_runtime_cmo_adaptive_task_proposals_v1 \
            tests.test_runtime_strategist_adaptive_proposal_v1 \
            tests.test_runtime_creative_adaptive_proposal_v1

      - name: Commit production fix and remove temporary apply helpers
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="fix/runtime-upstream-failed-zero-tool-dispatch-adaptive-stack-v1"
          git fetch origin "$BRANCH"
          REMOTE_HEAD="$(git rev-parse "origin/$BRANCH")"
          test "$REMOTE_HEAD" = "${{ github.sha }}"
          rm .github/scripts/apply_runtime_upstream_failed_zero_tool_dispatch_adaptive_stack_v1.py
          rm .github/workflows/runtime-upstream-failed-zero-tool-dispatch-adaptive-stack-apply-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): fail closed before adaptive downstream work"
          git push origin "HEAD:$BRANCH"
