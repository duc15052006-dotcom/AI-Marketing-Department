name: Apply Runtime Checkpoint Hash Working State V1

on:
  push:
    branches:
      - "fix/runtime-checkpoint-hash-working-state-v1"
    paths:
      - ".github/workflows/runtime-checkpoint-hash-working-state-apply-v1.yml"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-production-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering branch head
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-checkpoint-hash-working-state-v1
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD:runtime/context.py)"
          EXPECTED="3b9d62a8e184b5e2f5dcbc835db733282ec0e8fc"
          echo "expected_context_blob=$EXPECTED"
          echo "actual_context_blob=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply checkpoint working-state hash binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/context.py")
          text = path.read_text(encoding="utf-8")
          old = '''        raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}"\n        return hashlib.sha256(raw.encode("utf-8")).hexdigest()'''
          new = '''        working_state_json = json.dumps(\n            self._serialize_val(self.working_state_snapshot),\n            sort_keys=True,\n            ensure_ascii=False,\n            separators=(",", ":"),\n            default=str,\n        )\n        raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{working_state_json}"\n        return hashlib.sha256(raw.encode("utf-8")).hexdigest()'''
          if text.count(old) != 1:
              raise SystemExit(f"HASH_ANCHOR_COUNT={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify production patch scope
        shell: bash
        run: |
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "runtime/context.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile patched context
        run: python -m py_compile runtime/context.py

      - name: Run targeted regressions before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_checkpoint_hash_working_state_v1 \
            tests.test_runtime_checkpoint_deep_snapshot_v1 \
            tests.test_structure

      - name: Commit production fix and remove temporary apply workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-checkpoint-hash-working-state-apply-v1.yml
          git add runtime/context.py
          git commit -m "fix(runtime): bind checkpoint hash to working state"
          git push origin HEAD:fix/runtime-checkpoint-hash-working-state-v1
