name: Apply Provider Preflight Claim Race Fix

on:
  push:
    branches:
      - fix/provider-preflight-claim-race-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply atomic ACTIVE-to-CLAIMED compare-and-swap
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("connectors/marketing/preflight.py")
          text = path.read_text(encoding="utf-8")
          old = "            try:\n                if self._conn is None:\n                    return self._store_replace(claimed)\n                with self._conn:\n                    return self._store_replace(claimed)\n            except sqlite3.Error as exc:\n"
          new = "            try:\n                if self._conn is None:\n                    return self._store_replace(claimed)\n                normalized, encoded, encoded_hash = self._serialize(claimed)\n                with self._conn:\n                    cur = self._conn.execute(\n                        \"UPDATE provider_preflights SET state=?,expires_at=?,payload_json=?,payload_hash=? \"\n                        \"WHERE preflight_id=? AND state=?\",\n                        (\n                            normalized.state.value,\n                            normalized.expires_at,\n                            encoded,\n                            encoded_hash,\n                            normalized.preflight_id,\n                            ProviderPreflightState.ACTIVE.value,\n                        ),\n                    )\n                    if cur.rowcount != 1:\n                        row = self._conn.execute(\n                            \"SELECT state FROM provider_preflights WHERE preflight_id=?\",\n                            (normalized.preflight_id,),\n                        ).fetchone()\n                        if row is None:\n                            raise ProviderPreflightConflictError(\"PROVIDER_PREFLIGHT_NOT_FOUND\")\n                        raise ProviderPreflightConflictError(\n                            f\"PROVIDER_PREFLIGHT_NOT_ACTIVE: state={row['state']}\"\n                        )\n                return copy.deepcopy(normalized)\n            except sqlite3.Error as exc:\n"
          assert text.count(old) == 1, f"expected claim persistence block exactly once, found {text.count(old)}"
          path.write_text(text.replace(old, new), encoding="utf-8")
          '@ | python -

      - name: Commit production fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connectors/marketing/preflight.py
          git diff --cached --check
          git commit -m "fix(platform): make provider preflight claim atomic"
          git push origin HEAD:fix/provider-preflight-claim-race-v1
