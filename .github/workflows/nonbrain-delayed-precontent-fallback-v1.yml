name: Non-Brain Delayed Precontent Fallback V1

on:
  push:
    branches:
      - test/nonbrain-delayed-precontent-fallback-red-v1
      - fix/nonbrain-delayed-precontent-fallback-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nonbrain-delayed-precontent-fallback-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
  AI_MARKETING_MEMORY_EPHEMERAL: "1"
  AI_MARKETING_LEARNING_EPHEMERAL: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  focused-regression:
    name: Ubuntu Python 3.12 focused — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: causal-delayed-precontent-fallback
            module: tests.test_model_gateway_stream_delayed_precontent_error_fallback_v1
          - label: model-streaming
            module: tests.test_prod_model_streaming_01
          - label: structured-provider-stream-error
            module: tests.test_prod_structured_provider_stream_error_01
          - label: provider-registry
            module: tests.test_prod_model_gateway_01_provider_registry
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_head_sha=${expected}"
          echo "actual_head_sha=${actual}"
          python --version
          test "${actual}" = "${expected}"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile model and regression sources
        run: python -m compileall -q integrations/models tests/test_model_gateway_stream_delayed_precontent_error_fallback_v1.py

      - name: Run focused regression
        run: python -m unittest -v ${{ matrix.module }}

      - name: Verify clean checkout
        if: always()
        run: git diff --exit-code

  full-hermetic-windows:
    if: github.ref == 'refs/heads/fix/nonbrain-delayed-precontent-fallback-v1'
    name: Windows Python 3.12 full hermetic discovery
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact-head identity
        shell: pwsh
        run: |
          $expected = "${{ github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected_head_sha=$expected"
          Write-Host "actual_head_sha=$actual"
          python --version
          if ($actual -ne $expected) { exit 1 }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean checkout
        if: always()
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
