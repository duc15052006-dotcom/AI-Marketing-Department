name: Convergence Source Hardening Apply

on:
  pull_request:
    branches:
      - integration/brain-nonbrain-convergence-v1
    paths:
      - ".github/workflows/convergence-source-hardening-apply.yml"

permissions:
  contents: write

jobs:
  validate-and-apply-source-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/brain-nonbrain-mergework-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering convergence SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact branch and stale-run guards
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "integration/brain-nonbrain-mergework-v1"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch origin integration/brain-nonbrain-mergework-v1
          test "$(git rev-parse origin/integration/brain-nonbrain-mergework-v1)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" != "main"

      - name: Install repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply reviewed convergence patch from guarded hotfix source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/convergence-backend-lifecycle-hotfix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate durability, recovery, control plane, lineage, publish compatibility, and syntax\n"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('guarded hotfix patch markers changed; refusing unsafe extraction')
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_code = textwrap.dedent(workflow[start:end])
          compile(patch_code, '<guarded-convergence-patch>', 'exec')
          namespace = {'__name__': '__main__'}
          exec(compile(patch_code, '<guarded-convergence-patch>', 'exec'), namespace, namespace)
          PY

      - name: Validate durability recovery control-plane lineage and publish compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            app_api/server.py runtime/engine.py runtime/lineage.py workspace/operator.py \
            tests/test_app_backend_durable_job_store_wiring_adversarial_v1.py \
            tests/test_production_receipt_restart_durability_adversarial_v1.py \
            tests/test_runtime_run_isolation_cleanup_adversarial_v1.py \
            tests/test_runtime_pause_resume_control_plane_adversarial_v1.py \
            tests/test_runtime_lineage_scope_adversarial_v1.py
          python -m unittest -v \
            tests.test_app_backend_durable_job_store_wiring_adversarial_v1 \
            tests.test_production_receipt_restart_durability_adversarial_v1 \
            tests.test_runtime_run_isolation_cleanup_adversarial_v1 \
            tests.test_runtime_pause_resume_control_plane_adversarial_v1 \
            tests.test_runtime_lineage_scope_adversarial_v1 \
            tests.test_brain_runtime_canonical_action_intent_handoff_v1 \
            tests.test_brain_canonical_action_intent_tool_gateway_v1 \
            tests.test_phase6_1_v1_connectors_and_workspace.TestPhase61V1ConnectorsAndWorkspace.test_adv_15_pause_and_resume_operator_controls \
            tests.test_phase6_1_v1_connectors_and_workspace.TestPhase61V1ConnectorsAndWorkspace.test_adv_16_cancel_run_operator_control \
            tests.test_phase6_1_v1_connectors_and_workspace.TestPhase61V1ConnectorsAndWorkspace.test_adv_22_lineage_trace_validity_for_approved_publish

      - name: Commit source-only guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/brain-nonbrain-mergework-v1
          test "$(git rev-parse origin/integration/brain-nonbrain-mergework-v1)" = "${{ github.event.pull_request.head.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app_api/server.py \
            runtime/engine.py \
            runtime/lineage.py \
            workspace/operator.py \
            tests/test_app_backend_durable_job_store_wiring_adversarial_v1.py \
            tests/test_production_receipt_restart_durability_adversarial_v1.py \
            tests/test_runtime_run_isolation_cleanup_adversarial_v1.py \
            tests/test_runtime_pause_resume_control_plane_adversarial_v1.py \
            tests/test_runtime_lineage_scope_adversarial_v1.py \
            tests/test_phase6_1_v1_connectors_and_workspace.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source hardening patch remains to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing workflow mutation in source-only commit" >&2
            exit 1
          fi
          git commit -m "fix(convergence): harden durable control plane and lineage"
          git push origin HEAD:integration/brain-nonbrain-mergework-v1
