name: Apply Runtime CMO Adaptive Task Proposals V1

on:
  push:
    branches:
      - feat/runtime-cmo-adaptive-task-proposals-v1
    paths:
      - ".github/scripts/apply_cmo_adaptive_task_proposals_v1.py"
      - ".github/workflows/runtime-cmo-adaptive-task-proposals-apply-v1.yml"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-production-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          EXPECTED_HEAD="${{ github.sha }}"
          ACTUAL_BLOB="$(git hash-object runtime/engine.py)"
          EXPECTED_BLOB="6981e4e68a1786a9565364f306c939005c224fce"
          echo "expected_head=$EXPECTED_HEAD"
          echo "actual_head=$ACTUAL_HEAD"
          echo "expected_engine_blob=$EXPECTED_BLOB"
          echo "actual_engine_blob=$ACTUAL_BLOB"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          git merge-base --is-ancestor 475c1f0240fdfd992271e65445040c231aa2f530 HEAD

      - name: Apply exact adaptive proposal integration
        run: python .github/scripts/apply_cmo_adaptive_task_proposals_v1.py

      - name: Verify production patch scope
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "runtime/engine.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile patched engine
        run: python -m py_compile runtime/engine.py

      - name: Run targeted regressions before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_cmo_adaptive_task_proposals_v1 \
            tests.test_runtime_dependency_scheduler_v1 \
            tests.test_runtime_intelligence_adaptive_fanout_v1 \
            tests.test_prod_research_grounding_01b \
            tests.test_prod_research_quality_01b

      - name: Commit production integration and remove temporary apply files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git rm .github/scripts/apply_cmo_adaptive_task_proposals_v1.py
          git rm .github/workflows/runtime-cmo-adaptive-task-proposals-apply-v1.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "feat(runtime): compile CMO task proposals under runtime authority"
          git push origin HEAD:feat/runtime-cmo-adaptive-task-proposals-v1
