name: Brain Runtime Action Gate Apply

on:
  push:
    branches:
      - fix/brain-runtime-action-gate-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/brain-runtime-action-gate-v1

      - name: Verify guarded preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object tools/tool_gateway.py)" = "0e5fc819e2bb3053fcb491553b75fb55d5ec6e48"
          test ! -e brain/action_policy.py

      - name: Apply minimal production patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import indent

          action_policy = '''"""Provider-neutral Brain action authorization seam.

          This module owns only the semantic pre-dispatch authorization contract used
          by the Body-side ToolGateway. It deliberately imports no runtime, tools,
          provider, connector, persistence, or adapter code.

          V1 establishes a fail-closed Brain veto point on every registered tool
          dispatch. It does not yet claim that Decision provenance is bound to an
          action; that stronger lineage contract is a separate hardening slice.
          """

          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum

          from brain.contracts import BrainAgentId


          class ActionDisposition(str, Enum):
              """Brain authorization result for one runtime action request."""

              ALLOW = "ALLOW"
              BLOCK = "BLOCK"


          def _required_text(value: object, field_name: str) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise ValueError(f"{field_name} must be a non-empty string")
              return value.strip()


          def _strict_bool(value: object, field_name: str) -> bool:
              if type(value) is not bool:
                  raise ValueError(f"{field_name} must be a boolean")
              return value


          @dataclass(frozen=True)
          class RuntimeActionIntent:
              """Trusted registry metadata presented to the Brain authorization seam."""

              intent_id: str
              run_id: str
              agent_id: str
              capability_id: str
              capability_category: str
              risk_level: str
              human_approval_required: bool
              consequential: bool

              def __post_init__(self) -> None:
                  intent_id = _required_text(self.intent_id, "intent_id")
                  run_id = _required_text(self.run_id, "run_id")
                  agent_id = _required_text(self.agent_id, "agent_id").upper()
                  capability_id = _required_text(self.capability_id, "capability_id")
                  capability_category = _required_text(
                      self.capability_category, "capability_category"
                  ).upper()
                  risk_level = _required_text(self.risk_level, "risk_level").upper()

                  try:
                      canonical_agent = BrainAgentId(agent_id)
                  except ValueError as exc:
                      raise ValueError(
                          "agent_id must identify one of the five permanent agents"
                      ) from exc

                  if capability_category not in {
                      "OBSERVE", "CREATE", "PUBLISH", "ANALYZE", "FILE_DATA"
                  }:
                      raise ValueError(
                          "capability_category is not a recognized trusted category"
                      )
                  if risk_level not in {"LOW", "MEDIUM", "HIGH", "CRITICAL"}:
                      raise ValueError("risk_level is not a recognized trusted risk level")

                  object.__setattr__(self, "intent_id", intent_id)
                  object.__setattr__(self, "run_id", run_id)
                  object.__setattr__(self, "agent_id", canonical_agent.value.lower())
                  object.__setattr__(self, "capability_id", capability_id)
                  object.__setattr__(self, "capability_category", capability_category)
                  object.__setattr__(self, "risk_level", risk_level)
                  object.__setattr__(
                      self,
                      "human_approval_required",
                      _strict_bool(
                          self.human_approval_required, "human_approval_required"
                      ),
                  )
                  object.__setattr__(
                      self,
                      "consequential",
                      _strict_bool(self.consequential, "consequential"),
                  )


          @dataclass(frozen=True)
          class ActionAuthorization:
              """Auditable Brain decision at the runtime action boundary."""

              intent_id: str
              disposition: ActionDisposition
              reason: str

              def __post_init__(self) -> None:
                  intent_id = _required_text(self.intent_id, "intent_id")
                  reason = _required_text(self.reason, "reason")
                  disposition = self.disposition
                  if not isinstance(disposition, ActionDisposition):
                      try:
                          disposition = ActionDisposition(str(disposition).strip().upper())
                      except ValueError as exc:
                          raise ValueError("disposition must be ALLOW or BLOCK") from exc
                  object.__setattr__(self, "intent_id", intent_id)
                  object.__setattr__(self, "disposition", disposition)
                  object.__setattr__(self, "reason", reason)


          def authorize_action(intent: RuntimeActionIntent) -> ActionAuthorization:
              """Default V1 policy after structural trusted-metadata validation.

              V1 preserves current valid execution behavior while making this Brain
              authorization seam mandatory. Decision/Plan provenance will tighten
              this default in the next isolated hardening slice.
              """

              if not isinstance(intent, RuntimeActionIntent):
                  raise ValueError("intent must be RuntimeActionIntent")
              return ActionAuthorization(
                  intent_id=intent.intent_id,
                  disposition=ActionDisposition.ALLOW,
                  reason="BRAIN_ACTION_GATE_V1_STRUCTURAL_ALLOW",
              )
          '''
          Path("brain/action_policy.py").write_text(action_policy, encoding="utf-8")

          path = Path("tools/tool_gateway.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "from typing import Any, Dict, List, Optional\n",
                  "from typing import Any, Callable, Dict, List, Optional\n",
              ),
              (
                  "from schemas.base import BaseModel, Field\n",
                  "from brain.action_policy import (\n"
                  "    ActionAuthorization,\n"
                  "    ActionDisposition,\n"
                  "    RuntimeActionIntent,\n"
                  "    authorize_action,\n"
                  ")\n"
                  "from schemas.base import BaseModel, Field\n",
              ),
              (
                  "        receipt_repository: Optional[ExecutionReceiptRepository] = None,\n"
                  "    ) -> None:\n",
                  "        receipt_repository: Optional[ExecutionReceiptRepository] = None,\n"
                  "        action_authorizer: Optional[\n"
                  "            Callable[[RuntimeActionIntent], ActionAuthorization]\n"
                  "        ] = None,\n"
                  "    ) -> None:\n",
              ),
              (
                  "        self.receipt_repository = receipt_repository or ExecutionReceiptRepository()\n"
                  "        self.idempotency_ledger = IdempotencyLedger(\n",
                  "        self.receipt_repository = receipt_repository or ExecutionReceiptRepository()\n"
                  "        self.action_authorizer = action_authorizer or authorize_action\n"
                  "        self.idempotency_ledger = IdempotencyLedger(\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"guarded replacement mismatch: {old!r}")
              text = text.replace(old, new, 1)

          marker = "        # 2. Permission & Safety Policy Gate\n"
          if text.count(marker) != 1:
              raise SystemExit("permission gate marker mismatch")

          gate_body = '''# 2. Brain Action Authorization Gate
          # Capability policy metadata comes only from the trusted registry snapshot;
          # request.parameters is deliberately excluded from Brain authorization.
          try:
              brain_intent = RuntimeActionIntent(
                  intent_id=f"BRAIN-ACTION-{request.request_id}",
                  run_id=request.run_id,
                  agent_id=request.agent_id,
                  capability_id=cap.capability_id,
                  capability_category=cap.category.value,
                  risk_level=cap.risk_level.value,
                  human_approval_required=bool(cap.human_approval_required),
                  consequential=self._is_consequential_capability(cap),
              )
              authorization = self.action_authorizer(brain_intent)
          except Exception as exc:
              return self.receipt_repository.save_receipt(
                  self._error_receipt(
                      request,
                      provider=cap.provider,
                      request_hash=req_hash,
                      started_at=start_time,
                      status=ExecutionStatus.BLOCKED,
                      error_class="BRAIN_ACTION_DENIED",
                      error_message=f"BRAIN_ACTION_POLICY_ERROR: {exc}",
                      business_id=effective_business_id,
                      project_id=effective_project_id,
                  )
              )

          if (
              not isinstance(authorization, ActionAuthorization)
              or authorization.intent_id != brain_intent.intent_id
              or authorization.disposition != ActionDisposition.ALLOW
          ):
              if isinstance(authorization, ActionAuthorization):
                  denial_reason = authorization.reason
                  if authorization.intent_id != brain_intent.intent_id:
                      denial_reason = f"BRAIN_ACTION_INTENT_MISMATCH: {denial_reason}"
              else:
                  denial_reason = "BRAIN_ACTION_AUTHORIZATION_INVALID"
              return self.receipt_repository.save_receipt(
                  self._error_receipt(
                      request,
                      provider=cap.provider,
                      request_hash=req_hash,
                      started_at=start_time,
                      status=ExecutionStatus.BLOCKED,
                      error_class="BRAIN_ACTION_DENIED",
                      error_message=denial_reason,
                      business_id=effective_business_id,
                      project_id=effective_project_id,
                  )
              )

          '''
          gate = indent(gate_body, "        ")
          text = text.replace(marker, gate + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify production scope and targeted regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile brain/action_policy.py tools/tool_gateway.py tests/test_brain_runtime_action_gate_v1.py
          python -m unittest -v tests.test_brain_runtime_action_gate_v1
          git diff --check
          git status --short
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          paths = sorted(line[3:] for line in lines)
          expected = ["brain/action_policy.py", "tools/tool_gateway.py"]
          if paths != expected:
              raise SystemExit(f"unexpected production scope: {paths!r}")
          PY

      - name: Commit production fix and self-clean apply workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/brain-runtime-action-gate-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain/action_policy.py tools/tool_gateway.py .github/workflows/brain-runtime-action-gate-apply.yml
          git commit -m "fix(brain): enforce pre-dispatch action authorization"
          git push origin HEAD:fix/brain-runtime-action-gate-v1
