name: Brain World State Reasoning V1

on:
  pull_request:
    paths:
      - ".github/workflows/brain-world-state-reasoning-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/final-main-reconciliation-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact test-contract and isolation repair
        shell: python
        run: |
          from pathlib import Path

          tests = Path('tests/test_collaboration_integrity_audit.py')
          text = tests.read_text(encoding='utf-8')

          old_approval = '''        self.assertIn(final_out["approval_status"], ("APPROVED", "APPROVED_WITH_CONDITIONS"))
        self.assertEqual(final_out["status"], "READY_FOR_DEPLOYMENT")'''
          new_approval = '''        self.assertIn(final_out["approval_status"], ("APPROVED", "APPROVED_WITH_CONDITIONS"))
        expected_status = (
            "READY_FOR_DEPLOYMENT"
            if final_out["approval_status"] == "APPROVED"
            else "READY_FOR_HUMAN_APPROVAL"
        )
        self.assertEqual(final_out["status"], expected_status)'''
          if text.count(old_approval) != 1:
              raise SystemExit(f'expected one stale conditional-approval assertion, found {text.count(old_approval)}')
          text = text.replace(old_approval, new_approval)

          old_perf = '''        self.assertEqual(ctx.stage_outputs["performance"]["funnel_kpi"], replies["performance"])'''
          new_perf = '''        perf = ctx.stage_outputs["performance"]
        self.assertEqual(perf["measurement_attribution"], replies["performance"])
        self.assertEqual(perf["experimentation_governance"], replies["performance"])
        self.assertEqual(perf["field_origins"]["measurement_attribution"], "AGENT_DERIVED")
        self.assertEqual(perf["field_origins"]["experimentation_governance"], "AGENT_DERIVED")
        self.assertEqual(perf["field_origins"]["funnel_kpi"], "DETERMINISTIC_COMPUTED")
        self.assertIn("## Pass 5A — Measurement & Attribution", perf["funnel_kpi"])
        self.assertIn("## Pass 5B — Experimentation & Governance", perf["funnel_kpi"])
        self.assertEqual(perf["funnel_kpi"].count(replies["performance"]), 2)'''
          if text.count(old_perf) != 1:
              raise SystemExit(f'expected one stale Performance raw-output assertion, found {text.count(old_perf)}')
          tests.write_text(text.replace(old_perf, new_perf), encoding='utf-8')

          final_world = '''name: Brain World State Reasoning V1

          on:
            pull_request:
              paths:
                - "brain/__init__.py"
                - "brain/world_state.py"
                - "tests/test_brain_world_state_reasoning_v1.py"
                - ".github/workflows/brain-world-state-reasoning-v1.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            qualification:
              name: World state reasoning (${{ matrix.os }})
              runs-on: ${{ matrix.os }}
              timeout-minutes: 25
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, windows-latest]
              env:
                RUN_LIVE_PROVIDER_TESTS: "0"
                RUN_REAL_MODEL_TEST: "0"
                RUN_LIVE_MODEL_TESTS: "0"
                AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
                AI_MARKETING_MEMORY_EPHEMERAL: "1"
                AI_MARKETING_LEARNING_EPHEMERAL: "1"
                PYTHONUTF8: "1"
                PYTHONDONTWRITEBYTECODE: "1"
              steps:
                - name: Checkout exact pull request head
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}

                - name: Set up Python 3.12
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: requirements.txt

                - name: Verify exact CI identity
                  shell: bash
                  run: |
                    mkdir -p .ci-results
                    expected="${{ github.event.pull_request.head.sha || github.sha }}"
                    actual="$(git rev-parse HEAD)"
                    printf 'expected_head_sha=%s\\nactual_head_sha=%s\\n' "$expected" "$actual" | tee .ci-results/identity.txt
                    test "$expected" = "$actual"

                - name: Install runtime dependencies
                  shell: bash
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt
                    python -m pip check

                - name: Compile world-state regression
                  shell: bash
                  run: |
                    python -m compileall -q tests/test_brain_world_state_reasoning_v1.py
                    if [ -f brain/world_state.py ]; then python -m compileall -q brain/world_state.py brain/__init__.py; fi

                - name: Run world-state adversarial regression
                  id: targeted
                  continue-on-error: true
                  shell: bash
                  run: |
                    set +e
                    python -m unittest -v tests.test_brain_world_state_reasoning_v1 2>&1 | tee .ci-results/targeted.log
                    code=${PIPESTATUS[0]}
                    printf '%s\\n' "$code" > .ci-results/targeted-exit.txt
                    exit "$code"

                - name: Run adjacent Brain authority regressions
                  shell: bash
                  run: |
                    set -o pipefail
                    python -m unittest -v \\
                      tests.test_brain_evidence_intelligence_v1 \\
                      tests.test_brain_hypothesis_portfolio_v1 \\
                      tests.test_brain_hypothesis_public_api_v1 \\
                      tests.test_brain_metacognition_intelligence_v1 \\
                      2>&1 | tee .ci-results/adjacent.log

                - name: Run canonical full hermetic unittest discovery
                  if: runner.os == 'Windows' && steps.targeted.outcome == 'success'
                  shell: bash
                  run: |
                    set -o pipefail
                    python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee .ci-results/full-unittest.log

                - name: Upload exact-head qualification evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: brain-world-state-reasoning-v1-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
                    path: .ci-results/
                    if-no-files-found: error
                    include-hidden-files: true
                    retention-days: 14

                - name: Enforce targeted world-state authority gate
                  if: always()
                  shell: bash
                  run: |
                    test -f .ci-results/targeted-exit.txt
                    test "$(cat .ci-results/targeted-exit.txt)" = "0"
          '''
          # Dedent the embedded canonical workflow by its fixed indentation.
          final_world = '\n'.join(line[10:] if line.startswith('          ') else line for line in final_world.splitlines()) + '\n'
          Path('.github/workflows/brain-world-state-reasoning-v1.yml').write_text(final_world, encoding='utf-8')

          helper = Path('.github/workflows/tmp-final-certification-contract-repair.yml')
          if helper.exists():
              helper.unlink()

      - name: Commit clean repair tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_collaboration_integrity_audit.py .github/workflows/brain-world-state-reasoning-v1.yml .github/workflows/tmp-final-certification-contract-repair.yml
          git diff --cached --check
          git commit -m "test(ci): align certification contracts with canonical runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
