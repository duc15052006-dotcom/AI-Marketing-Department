name: Brain Hypothesis Portfolio V1

on:
  pull_request:
    paths:
      - "brain/__init__.py"
      - "brain/hypotheses.py"
      - "tests/test_brain_hypothesis_portfolio_v1.py"
      - "tests/test_brain_hypothesis_public_api_v1.py"
      - ".github/workflows/brain-hypothesis-portfolio-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brain-hypothesis-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: One-shot canonical Content full-hermetic migration
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          mkdir -p .ci-results
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          printf 'expected_head_sha=%s\nactual_head_sha=%s\n' "$expected" "$actual" | tee .ci-results/identity.txt
          test "$expected" = "$actual"

      - name: Install repository dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply controlled canonical Content migration
        shell: bash
        run: python scripts/_tmp_content_test_migration.py

      - name: Compile repository Python sources
        shell: bash
        run: |
          python -m compileall -q brain app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests

      - name: Run canonical full hermetic unittest discovery
        shell: bash
        timeout-minutes: 40
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee .ci-results/full-unittest.log

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-content-migration-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Restore qualification workflows, remove temp files, and commit verified migration
        if: success()
        shell: bash
        run: |
          git checkout 00fedf7cc7e17ed392ed6b765b0c3eefae50e628 -- .github/workflows/brain-hypothesis-portfolio-v1.yml
          git checkout d6613b82fd665fc85b894de12fdeea1a1361f8ed -- .github/workflows/brain-final-convergence-cert-v1.yml
          git rm -f .github/workflows/brain-content-test-migration-repair-temp.yml
          git rm -f scripts/_tmp_content_test_migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/brain-hypothesis-portfolio-v1.yml .github/workflows/brain-final-convergence-cert-v1.yml tests
          git diff --cached --stat
          git commit -m "test(brain): migrate stale strategist regressions to content"
          git push origin HEAD:fix/brain-content-canonical-role-v1
