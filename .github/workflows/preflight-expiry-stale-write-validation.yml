name: Provider Preflight Expiry Stale Write Patch

on:
  push:
    branches:
      - fix/provider-preflight-expiry-stale-write-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact expiry CAS patch
        shell: pwsh
        run: |
          $old = ""
          $new = ""
          python -c "import base64,pathlib; p=pathlib.Path('connectors/marketing/preflight.py'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('$old').decode(); new=base64.b64decode('$new').decode(); c=s.count(old); assert c in (0,1), f'unexpected old block count: {c}'; assert c == 1 or s.count(new) == 1, 'neither old nor new expiry block found'; p.write_text(s.replace(old,new,1) if c else s, encoding='utf-8')"
          git diff --check
          python -m py_compile connectors/marketing/preflight.py
      - name: Commit production patch if changed
        shell: pwsh
        run: |
          if (git diff --quiet -- connectors/marketing/preflight.py) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connectors/marketing/preflight.py
          git commit -m "fix(platform): make provider preflight expiry atomic"
          git push origin HEAD:fix/provider-preflight-expiry-stale-write-v1
