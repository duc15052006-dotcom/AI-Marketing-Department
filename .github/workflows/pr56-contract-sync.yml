name: PR56 Contract Sync

on:
  push:
    branches:
      - fix/conditional-approval-deployment-gate-55

permissions:
  contents: write

jobs:
  sync-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conditional-approval-deployment-gate-55
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Patch stale deployment-status assertion
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tests/test_collaboration_integrity_audit.py")
          text = path.read_text(encoding="utf-8")
          old = '''        self.assertIn(final_out["approval_status"], ("APPROVED", "APPROVED_WITH_CONDITIONS"))
        self.assertEqual(final_out["status"], "READY_FOR_DEPLOYMENT")
        self.assertGreaterEqual(final_out["claim_audit"]["hypotheses_count"], 1)
'''
          new = '''        self.assertIn(final_out["approval_status"], ("APPROVED", "APPROVED_WITH_CONDITIONS"))
        expected_status = (
            "READY_FOR_DEPLOYMENT"
            if final_out["approval_status"] == "APPROVED"
            else "READY_FOR_HUMAN_APPROVAL"
        )
        self.assertEqual(final_out["status"], expected_status)
        self.assertGreaterEqual(final_out["claim_audit"]["hypotheses_count"], 1)
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"guarded replacement expected 1 match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '@ | python -

      - name: Run targeted regression tests
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_conditional_approval_no_deploy_55 `
            tests.test_collaboration_integrity_audit.TestClaimAuditHardening.test_05_creative_hypothesis_not_falsely_rejected_as_factual_claim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated contract sync and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr56-contract-sync.yml
          git add tests/test_collaboration_integrity_audit.py
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "No validated changes staged" }
          git commit -m "test: align conditional approval deployment contract"
          git push origin HEAD:fix/conditional-approval-deployment-gate-55
