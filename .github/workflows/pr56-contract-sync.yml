name: PR56 Contract Sync
on: push
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: '0'
      RUN_REAL_MODEL_TEST: '0'
      RUN_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conditional-approval-deployment-gate-55
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Patch stale assertion
        run: python -c 'from pathlib import Path; p=Path("tests/test_collaboration_integrity_audit.py"); t=p.read_text(encoding="utf-8"); old="        self.assertIn(final_out[\"approval_status\"], (\"APPROVED\", \"APPROVED_WITH_CONDITIONS\"))\n        self.assertEqual(final_out[\"status\"], \"READY_FOR_DEPLOYMENT\")\n        self.assertGreaterEqual(final_out[\"claim_audit\"][\"hypotheses_count\"], 1)\n"; new="        self.assertIn(final_out[\"approval_status\"], (\"APPROVED\", \"APPROVED_WITH_CONDITIONS\"))\n        expected_status = (\n            \"READY_FOR_DEPLOYMENT\"\n            if final_out[\"approval_status\"] == \"APPROVED\"\n            else \"READY_FOR_HUMAN_APPROVAL\"\n        )\n        self.assertEqual(final_out[\"status\"], expected_status)\n        self.assertGreaterEqual(final_out[\"claim_audit\"][\"hypotheses_count\"], 1)\n"; c=t.count(old); assert c==1, f"guarded replacement expected 1 match, found {c}"; p.write_text(t.replace(old,new,1),encoding="utf-8")'
      - name: Run targeted regressions
        run: python -m unittest -v tests.test_conditional_approval_no_deploy_55 tests.test_collaboration_integrity_audit.TestFinalCmoApprovalGateSafety.test_05_creative_hypothesis_not_falsely_rejected_as_factual_claim
      - name: Commit validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr56-contract-sync.yml
          git add tests/test_collaboration_integrity_audit.py
          git diff --cached --check
          git commit -m 'test: align conditional approval deployment contract'
          git push origin HEAD:fix/conditional-approval-deployment-gate-55
