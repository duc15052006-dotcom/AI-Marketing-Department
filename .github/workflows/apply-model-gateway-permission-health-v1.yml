name: Apply Model Gateway Permission Health V1

on:
  push:
    branches:
      - test/model-gateway-permission-health-v1

permissions:
  contents: write

concurrency:
  group: apply-model-gateway-permission-health-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Apply minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "                    elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):",
              "                        self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)",
          ]) + "\n"
          new = "\n".join([
              "                    elif internal_code in (",
              "                        ProviderErrorCode.PERMISSION_403,",
              "                        ProviderErrorCode.TIMEOUT,",
              "                        ProviderErrorCode.NETWORK_ERROR,",
              "                    ):",
              "                        self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)",
          ]) + "\n"
          count = text.count(old)
          if count != 4:
              raise SystemExit(f"expected exactly four stream health anchors, found {count}")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Run causal and structured stream regressions after local patch
        run: |
          python -m unittest -v tests.test_model_gateway_permission_health_v1
          python -m unittest -v tests.test_model_gateway_midstream_error_health_v1
          python -m unittest -v tests.test_prod_structured_provider_stream_error_01
      - name: Commit production patch if needed
        shell: bash
        run: |
          if git diff --quiet -- integrations/models/gateway.py; then
            echo "No production diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): degrade permission denied provider health"
          git push origin HEAD:test/model-gateway-permission-health-v1
