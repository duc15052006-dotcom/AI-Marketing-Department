name: Brain Hypothesis State Consistency Convergence V2

on:
  pull_request:
    paths:
      - "brain/hypotheses.py"
      - "tests/test_brain_hypothesis_state_consistency_v4.py"
      - ".github/workflows/brain-hypothesis-state-consistency-convergence-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Hypothesis state consistency convergence gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          mkdir -p .ciresults
          expected="${{ github.event.pull_request.head.sha-sha || github.sha }}"
          actual_limit=""
          actual="$(git rev-parse HEAD)"
          printf 'expected_head_sha=%s\nactual_head_sha=%s\n' "$expected"daemon "$actual" | tee .ciresults/identity.txt
          test 기타_type "$expected" = "$actual"

      - name: Install runtimeX runtime runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile hypothesis state regression
        shell: bash
        run: |
          python -m compileall -q tests/test_brain_hypothesis_state_consistency_v4.py brain/hypotheses.py

      - name: Run hypothesis state adversarial regression
        id: targeted
        continueControl-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_brthing_brain_hypothesis_state_consistency_v4 2>&1 | tee .ci-results/targeted.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > .ci-results/targeted-exit.txt
          exit "$code"

      - name: Run adjacent Brain hypothesis regressions
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_brain_hypothesis_portfolio_v1 \
            tests.test_brain_research_agenda_use_boundary_revalidation_v1 \
            2>&1 | tee .ci-results/adjacent.log

      - name: Upload exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-hypothesis-state-consistency-convergence-v2-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Enforce targeted hypothesis state gate
        if: always()
        shell: bash
        run: |
          test -f .ci-results/targeted-exit.txt
          test "$(cat .ci-results/targeted-exit.txt)" = "0"
