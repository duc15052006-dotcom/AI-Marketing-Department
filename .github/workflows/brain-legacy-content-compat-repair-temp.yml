name: Brain Canonical Content Compatibility Qualification Temp

on:
  pull_request:
    branches:
      - fix/brain-learning-control-downgrade-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/brain-content-canonical-role-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify canonical compatibility invariants
        run: |
          python - <<'PY'
          from governance.access_matrix import AgentAccessMatrix, PERMANENT_FIVE_AGENTS
          from runtime.context import RuntimeStage

          assert AgentAccessMatrix.get_profile("strategist").agent_id == "content"
          assert AgentAccessMatrix.get_profile("strategy").agent_id == "content"
          assert not hasattr(RuntimeStage, "STRATEGIST")
          assert RuntimeStage("STRATEGIST") is RuntimeStage.CONTENT
          assert [stage.value for stage in RuntimeStage].count("CONTENT") == 1
          assert PERMANENT_FIVE_AGENTS == {"cmo", "intelligence", "content", "creative", "performance"}
          print("canonical compatibility invariants: PASS")
          PY

      - name: Compile focused migration surface
        run: python -m compileall -q runtime governance integrations tests

      - name: Run focused canonical migration regressions
        run: |
          python -m unittest \
            tests.test_brain_canonical_agent_identity_v1 \
            tests.test_model_policy_content_migration \
            tests.test_structured_epistemic_handoff \
            tests.test_prod_core_authority_01b.TestAgentStageInvariants.test_six_stages \
            tests.test_phase1b_grounded_context.TestPhase1BGroundContext.test_i_truncation_metadata \
            tests.test_prod_scope_01_isolation.TestProdScope01Isolation.test_06_project_a_sentinel_not_visible_in_project_b \
            tests.test_prod_scope_01_isolation.TestProdScope01Isolation.test_42_project_knowledge_a_cannot_enter_b_grounded_context -v
