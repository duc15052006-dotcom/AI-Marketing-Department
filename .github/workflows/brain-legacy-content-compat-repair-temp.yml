name: Brain Legacy Content Compatibility Repair Temp

on:
  pull_request:
    branches:
      - fix/brain-learning-control-downgrade-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/brain-content-canonical-role-v1'
    runs-on: windows-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Apply guarded compatibility repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  print(f"already repaired: {path}")
                  return
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"repaired: {path}")

          replace_exact(
              "runtime/context.py",
              '    CONTENT = "CONTENT"\n    CREATIVE = "CREATIVE"',
              '    CONTENT = "CONTENT"\n    STRATEGIST = "CONTENT"  # Deprecated enum alias; iteration remains canonical CONTENT only.\n    CREATIVE = "CREATIVE"',
          )

          replace_exact(
              "governance/access_matrix.py",
              '    def get_profile(cls, agent_id: str) -> Optional[AgentAccessProfile]:\n        """Retrieve access profile for a recognized agent."""\n        return cls.PROFILES.get(agent_id.lower())',
              '    def get_profile(cls, agent_id: str) -> Optional[AgentAccessProfile]:\n        """Retrieve a canonical profile while accepting narrow legacy role aliases."""\n        key = str(agent_id or "").strip().lower()\n        if key in {"strategist", "strategy", "copywriter"}:\n            key = "content"\n        return cls.PROFILES.get(key)',
          )

          replace_exact(
              "runtime/context_compiler.py",
              '            allowed_sources = prof.allowed_knowledge_sources if prof else [SourceType.CANONICAL_FACT, SourceType.VERIFIED_EVIDENCE]',
              '            # Unknown agents fail closed; recognized legacy aliases are normalized by AgentAccessMatrix.\n            allowed_sources = prof.allowed_knowledge_sources if prof else []',
          )
          '@ | python -

      - name: Verify canonical alias invariants
        shell: pwsh
        run: |
          @'
          from governance.access_matrix import AgentAccessMatrix, PERMANENT_FIVE_AGENTS
          from runtime.context import RuntimeStage

          assert AgentAccessMatrix.get_profile("strategist").agent_id == "content"
          assert AgentAccessMatrix.get_profile("strategy").agent_id == "content"
          assert RuntimeStage.STRATEGIST is RuntimeStage.CONTENT
          assert [stage.value for stage in RuntimeStage].count("CONTENT") == 1
          assert PERMANENT_FIVE_AGENTS == {"cmo", "intelligence", "content", "creative", "performance"}
          print("canonical compatibility invariants: PASS")
          '@ | python -

      - name: Run focused compatibility regressions
        shell: pwsh
        run: |
          python -m unittest `
            tests.test_prod_core_authority_01b.TestAgentStageInvariants.test_six_stages `
            tests.test_phase1b_grounded_context.TestPhase1BGroundContext.test_i_truncation_metadata `
            tests.test_prod_scope_01_isolation.TestProdScope01Isolation.test_06_project_a_sentinel_not_visible_in_project_b `
            tests.test_prod_scope_01_isolation.TestProdScope01Isolation.test_42_project_knowledge_a_cannot_enter_b_grounded_context -v

      - name: Commit verified repair if needed
        shell: pwsh
        run: |
          git status --short
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add runtime/context.py governance/access_matrix.py runtime/context_compiler.py
            git commit -m "fix(brain): preserve legacy strategist compatibility at content boundary"
            git push origin HEAD:fix/brain-content-canonical-role-v1
          } else {
            Write-Host "No compatibility repair changes to commit."
          }
