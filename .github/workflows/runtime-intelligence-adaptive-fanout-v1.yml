# Temporary exact-head qualification for live Intelligence adaptive fan-out.
name: Runtime Intelligence Adaptive Fanout V1

on:
  pull_request:
    paths:
      - "runtime/engine.py"
      - "tests/test_runtime_intelligence_adaptive_fanout_v1.py"
      - ".github/workflows/runtime-intelligence-adaptive-fanout-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify exact head identity
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$ACTUAL" = "$EXPECTED"
      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run targeted fanout and scheduler regressions
        run: |
          python -m unittest -v \
            tests.test_runtime_intelligence_adaptive_fanout_v1 \
            tests.test_runtime_dependency_scheduler_v1 \
            tests.test_prod_research_grounding_01b \
            tests.test_prod_research_quality_01b

  current-head:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: targeted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Record exact head identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = git rev-parse HEAD
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "HEAD_MISMATCH: expected=$expected actual=$actual" }
      - name: Run exact full hermetic discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload current evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-fanout-current-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  literal-base:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 090466f23b34bb66739fdf0adc96eda8cb2cc5ac
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Record literal base identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = git rev-parse HEAD
          $expected = "090466f23b34bb66739fdf0adc96eda8cb2cc5ac"
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "BASE_HEAD_MISMATCH: expected=$expected actual=$actual" }
      - name: Run exact baseline full hermetic discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload literal-base evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-fanout-literal-base-090466f
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
