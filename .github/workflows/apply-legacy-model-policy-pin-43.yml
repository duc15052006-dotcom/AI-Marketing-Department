name: Apply Legacy ModelPolicy Pin Patch

on:
  push:
    branches: [fix/legacy-model-policy-pin-43]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[model-policy-pin-patched]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-model-policy-pin-43
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply exact ModelPolicy pin patch
        run: python scripts/_patch_legacy_model_policy_pin_43.py

      - name: Verify focused regressions
        shell: bash
        run: |
          git diff --check
          grep -q 'timeout_seconds": 60.0' runtime/engine.py
          grep -q '__dataclass_fields__' runtime/engine.py
          python -m py_compile runtime/engine.py tests/test_legacy_model_policy_pin_31.py
          python -m unittest tests.test_legacy_model_policy_pin_31 -v

      - name: Commit branch-only patch and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/apply-legacy-model-policy-pin-43.yml
          rm scripts/_patch_legacy_model_policy_pin_43.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py tests/test_legacy_model_policy_pin_31.py .github/workflows/apply-legacy-model-policy-pin-43.yml scripts/_patch_legacy_model_policy_pin_43.py
          git commit -m "Normalize legacy run-pinned ModelPolicy [model-policy-pin-patched]"
          git push origin HEAD:fix/legacy-model-policy-pin-43
