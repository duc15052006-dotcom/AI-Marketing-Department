name: Brain ASI Learning Cycle V1

on:
  pull_request:
    paths:
      - "brain/learning.py"
      - "tests/test_brain_asi_learning_cycle_v1.py"
      - ".github/workflows/brain-asi-learning-cycle-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: ASI learning cycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          mkdir -p .ci-results
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          printf 'expected_head_sha=%s\nactual_head_sha=%s\n' "$expected" "$actual" | tee .ci-results/identity.txt
          test "$expected" = "$actual"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile learning architecture and regression
        shell: bash
        run: |
          python -m compileall -q brain/learning.py tests/test_brain_asi_learning_cycle_v1.py

      - name: Run ASI learning-cycle regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.test_brain_asi_learning_cycle_v1 2>&1 | tee .ci-results/targeted.log

      - name: Run adjacent Brain cognition regressions
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_brain_evidence_intelligence_v1 \
            tests.test_brain_memory_intelligence_v1 \
            tests.test_brain_outcome_intelligence_v1 \
            tests.test_brain_decision_intelligence_v1 \
            tests.test_brain_stop_intelligence_v1 \
            2>&1 | tee .ci-results/adjacent.log

      - name: Run canonical full hermetic unittest discovery
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee .ci-results/full-unittest.log

      - name: Upload exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-asi-learning-cycle-v1-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
