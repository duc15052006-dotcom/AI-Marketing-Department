name: Candidate Fix Progress Model Call Contract

on:
  push:
    branches: [integration/final-main-reconciliation-v1]

permissions:
  contents: write

jobs:
  fix-progress-contract:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: '1'
      AI_MARKETING_MEMORY_EPHEMERAL: '1'
      AI_MARKETING_LEARNING_EPHEMERAL: '1'
      RUN_LIVE_PROVIDER_TESTS: '0'
      RUN_REAL_MODEL_TEST: '0'
      RUN_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
      - name: Patch only stale progress model-call assertions
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('tests/test_prod_runtime_progress_01.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('        self.assertEqual(gw2.call_count, 6)', '        self.assertEqual(gw2.call_count, 7)', 'test_17 sink call count'),
              ('        self.assertEqual(gw.call_count, 6)', '        self.assertEqual(gw.call_count, 7)', 'test_19 broken-sink call count'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one stale anchor, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -
      - name: Run exact affected regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_runtime_progress_01
      - name: Remove temporary workflow and commit clean repair
        shell: pwsh
        run: |
          Remove-Item .github/workflows/candidate-fix-progress-model-call-contract.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_prod_runtime_progress_01.py .github/workflows/candidate-fix-progress-model-call-contract.yml
          git diff --cached --check
          git commit -m "test(runtime): finish Performance 5A/5B progress call contract"
          git push origin HEAD:integration/final-main-reconciliation-v1
