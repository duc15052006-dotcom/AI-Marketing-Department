name: TMP PR91 Grounded Provenance RED

on:
  push:
    branches:
      - test/pr91-grounded-provenance-red-v1

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Run RED regression
        run: python -m unittest tests.test_workspace_scope_provenance_isolation_60 -v
