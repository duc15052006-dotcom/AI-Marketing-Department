name: Runtime Trusted Knowledge Scope Authority V1

on:
  pull_request:
    branches:
      - checkpoint/pr232-qualified-3d565378
    paths:
      - "runtime/engine.py"
      - "runtime/context.py"
      - "runtime/scope_bridge.py"
      - "runtime/context_compiler.py"
      - "tests/test_runtime_trusted_knowledge_scope_authority_v1.py"
      - ".github/workflows/runtime-trusted-knowledge-scope-authority-v1.yml"

permissions:
  contents: read

jobs:
  runtime-trusted-knowledge-scope-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head identity
        shell: bash
        run: |
          mkdir -p .ci-results
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED" "$ACTUAL" | tee .ci-results/identity.txt
          test "$ACTUAL" = "$EXPECTED"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile authority boundary source and test
        run: |
          python -m py_compile \
            runtime/engine.py \
            runtime/context.py \
            runtime/scope_bridge.py \
            runtime/context_compiler.py \
            tests/test_runtime_trusted_knowledge_scope_authority_v1.py

      - name: Run trusted knowledge scope authority regression
        shell: bash
        run: |
          python -m unittest -v tests.test_runtime_trusted_knowledge_scope_authority_v1 \
            2>&1 | tee .ci-results/targeted-test.log

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-trusted-knowledge-scope-authority-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true

# RED-first qualification workflow. Production semantics must not change until
# the hosted failure proves the cross-project authority widening invariant.
