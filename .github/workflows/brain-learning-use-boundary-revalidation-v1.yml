name: Brain Learning Use Boundary Revalidation V1

on:
  pull_request:
    paths:
      - "brain/learning.py"
      - "tests/test_brain_learning_use_boundary_revalidation_v1.py"
      - "tests/test_brain_causal_learning_loop_v1.py"
      - ".github/workflows/brain-learning-use-boundary-revalidation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify exact CI identity
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_head_sha=$expected"
          echo "actual_head_sha=$actual"
          test "$expected" = "$actual"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile
        run: python -m py_compile brain/learning.py tests/test_brain_learning_use_boundary_revalidation_v1.py
      - name: Run targeted and adjacent learning tests
        run: |
          python -m unittest -v \
            tests.test_brain_learning_use_boundary_revalidation_v1 \
            tests.test_brain_causal_learning_loop_v1 \
            tests.test_brain_metacognition_intelligence_v1 \
            tests.test_brain_evidence_intelligence_v1
