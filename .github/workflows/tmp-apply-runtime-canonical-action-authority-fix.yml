name: TEMP Apply Runtime Canonical Action Authority Fix

on:
  push:
    branches:
      - fix/brain-runtime-canonical-action-intent-handoff-v1

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact production patch and remove bootstrap workflow
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, *, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"PATCH_PRECONDITION_FAILED: expected {expected} matches, found {count}: {old[:120]!r}"
                  )
              return text.replace(old, new)

          action_path = Path("brain/action_policy.py")
          action = action_path.read_text(encoding="utf-8")
          authority_class = '''@dataclass(frozen=True)
          class BrainActionAuthority:
              """Typed semantic authority envelope for trusted Body-side handoff.

              This value binds the exact canonical ActionIntent to the exact raw
              DecisionEvaluationRequest. It is transport authority only: possessing
              this envelope never authorizes execution. ToolGateway must still
              recompute canonical decision policy and trusted capability binding.
              """

              action_intent: ActionIntent
              decision_request: "DecisionEvaluationRequest"

              def __post_init__(self) -> None:
                  from brain.decisions import DecisionEvaluationRequest

                  if not isinstance(self.action_intent, ActionIntent):
                      raise ValueError("action_intent must be an ActionIntent")
                  if not isinstance(self.decision_request, DecisionEvaluationRequest):
                      raise ValueError(
                          "decision_request must be a DecisionEvaluationRequest"
                      )

                  decision = self.decision_request.decision
                  if self.action_intent.decision_id is None:
                      raise ValueError(
                          "BrainActionAuthority requires ActionIntent decision provenance"
                      )
                  if self.action_intent.decision_id != decision.decision_id:
                      raise ValueError(
                          "BrainActionAuthority decision_id must match canonical decision"
                      )
                  if self.action_intent.goal_id != decision.goal_id:
                      raise ValueError(
                          "BrainActionAuthority goal_id must match canonical decision"
                      )
                  if self.action_intent.owner_agent != decision.agent_id:
                      raise ValueError(
                          "BrainActionAuthority owner must match canonical decision agent"
                      )


          @dataclass(frozen=True)
          class TrustedCapabilityBinding:'''
          action = replace_exact(
              action,
              "@dataclass(frozen=True)\nclass TrustedCapabilityBinding:",
              authority_class,
          )
          action_path.write_text(action, encoding="utf-8")

          engine_path = Path("runtime/engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          engine = replace_exact(
              engine,
              "from typing import Any, Dict, List, Optional, Set, Tuple",
              "from typing import Any, Callable, Dict, List, Optional, Set, Tuple",
          )
          engine = replace_exact(
              engine,
              "from governance.access_matrix import AgentAccessMatrix",
              "from brain.action_policy import BrainActionAuthority\nfrom governance.access_matrix import AgentAccessMatrix",
          )
          engine = replace_exact(
              engine,
              '''        context_compiler: Optional[ContextCompiler] = None,
                  claim_verifier: Optional[BaseClaimVerifier] = None,
                  max_completed_runs_cache: int = 1000,''',
              '''        context_compiler: Optional[ContextCompiler] = None,
                  claim_verifier: Optional[BaseClaimVerifier] = None,
                  brain_action_authority_resolver: Optional[
                      Callable[[RuntimeContext, ToolRequest], Optional[BrainActionAuthority]]
                  ] = None,
                  max_completed_runs_cache: int = 1000,''',
          )
          engine = replace_exact(
              engine,
              '''        self.session_knowledge = session_knowledge or SessionKnowledgeStore()
                  self.claim_verifier = claim_verifier
                  self.max_completed_runs_cache = max_completed_runs_cache''',
              '''        self.session_knowledge = session_knowledge or SessionKnowledgeStore()
                  self.claim_verifier = claim_verifier
                  self.brain_action_authority_resolver = brain_action_authority_resolver
                  self.max_completed_runs_cache = max_completed_runs_cache''',
          )

          helper = '''
              def _execute_tool_request(
                  self,
                  context: RuntimeContext,
                  request: ToolRequest,
              ) -> ExecutionReceipt:
                  """Dispatch one ToolRequest through the trusted Brain authority seam.

                  Legacy Runtime callers remain compatible while no resolver is
                  configured. Once a trusted resolver is installed, missing, malformed,
                  or resolver-failed authority is terminal for this dispatch and can
                  never silently downgrade to the legacy ToolGateway path.
                  """
                  semantic_kwargs: Dict[str, Any] = {}
                  resolver = self.brain_action_authority_resolver
                  if resolver is not None:
                      try:
                          authority = resolver(context, request)
                      except Exception as exc:
                          raise RuntimeError(
                              "BRAIN_ACTION_AUTHORITY_REQUIRED: configured Runtime Brain "
                              "authority resolver failed before tool dispatch."
                          ) from exc
                      if not isinstance(authority, BrainActionAuthority):
                          raise RuntimeError(
                              "BRAIN_ACTION_AUTHORITY_REQUIRED: configured Runtime Brain "
                              "authority resolver must return canonical BrainActionAuthority."
                          )
                      semantic_kwargs = {
                          "action_intent": authority.action_intent,
                          "decision_request": authority.decision_request,
                      }

                  return self.tool_gateway.execute(request, **semantic_kwargs)


              @staticmethod
              def _ordered_unique_scope_keys(values: List[str]) -> List[str]:'''
          engine = replace_exact(
              engine,
              "\n\n    @staticmethod\n    def _ordered_unique_scope_keys(values: List[str]) -> List[str]:",
              helper,
          )

          dispatch_replacements = {
              "self.tool_gateway.execute(page_req)": "self._execute_tool_request(context, page_req)",
              "self.tool_gateway.execute(search_req)": "self._execute_tool_request(context, search_req)",
              "self.tool_gateway.execute(img_req)": "self._execute_tool_request(context, img_req)",
              "self.tool_gateway.execute(analytics_req)": "self._execute_tool_request(context, analytics_req)",
              "self.tool_gateway.execute(pub_req)": "self._execute_tool_request(context, pub_req)",
          }
          for old, new in dispatch_replacements.items():
              engine = replace_exact(engine, old, new)

          if engine.count("self.tool_gateway.execute(") != 1:
              raise SystemExit(
                  "PATCH_POSTCONDITION_FAILED: Runtime must have exactly one direct ToolGateway.execute call"
              )
          engine_path.write_text(engine, encoding="utf-8")

          Path(".github/workflows/tmp-apply-runtime-canonical-action-authority-fix.yml").unlink()

      - name: Verify patch shape
        shell: bash
        run: |
          python -m compileall -q brain runtime
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/tmp-apply-runtime-canonical-action-authority-fix.yml brain/action_policy.py runtime/engine.py "
          grep -q 'class BrainActionAuthority' brain/action_policy.py
          test "$(grep -c 'self.tool_gateway.execute(' runtime/engine.py)" -eq 1

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain/action_policy.py runtime/engine.py .github/workflows/tmp-apply-runtime-canonical-action-authority-fix.yml
          git commit -m "fix(brain): propagate canonical action authority through Runtime"
          git push origin HEAD:fix/brain-runtime-canonical-action-intent-handoff-v1
