name: Provider Preflight Consume Race Validation

on:
  push:
    branches:
      - fix/provider-preflight-consume-race-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-targeted:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Record identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          "github_sha=${{ github.sha }}" | Tee-Object -FilePath .ci-results/identity.txt
          git rev-parse HEAD 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append

      - name: Run consume race adversarial test
        shell: pwsh
        run: |
          python -m unittest -v tests.test_provider_preflight_consume_race 2>&1 | Tee-Object -FilePath .ci-results/consume-race.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-consume-race-red-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
