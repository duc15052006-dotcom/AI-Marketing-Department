name: Provider Preflight Consume Race Patch

on:
  push:
    branches:
      - fix/provider-preflight-consume-race-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact consume CAS patch
        shell: pwsh
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit production patch if changed
        shell: pwsh
        run: |
          if (git diff --quiet -- connectors/marketing/preflight.py) {
            Write-Host "No production diff to commit"
            exit 0
          }
          git diff --check
          git diff -- connectors/marketing/preflight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connectors/marketing/preflight.py
          git commit -m "fix(platform): make provider preflight consume atomic"
          git push origin HEAD:fix/provider-preflight-consume-race-v1
