name: Provider Preflight Consume Race Patch

on:
  push:
    branches:
      - fix/provider-preflight-consume-race-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact consume CAS patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("connectors/marketing/preflight.py")
          text = path.read_text(encoding="utf-8")
          old = '''            try:
              if self._conn is None:
                  return self._store_replace(consumed)
              with self._conn:
                  return self._store_replace(consumed)
          except sqlite3.Error as exc:
              raise ProviderPreflightError(
                  "PROVIDER_PREFLIGHT_CONSUME_FAILED: " + sanitize_sensitive_text(str(exc))
              ) from exc
'''
          new = '''            try:
              if self._conn is None:
                  return self._store_replace(consumed)
              normalized, encoded, encoded_hash = self._serialize(consumed)
              with self._conn:
                  cur = self._conn.execute(
                      "UPDATE provider_preflights SET state=?,expires_at=?,payload_json=?,payload_hash=? "
                      "WHERE preflight_id=? AND state=?",
                      (
                          normalized.state.value,
                          normalized.expires_at,
                          encoded,
                          encoded_hash,
                          normalized.preflight_id,
                          ProviderPreflightState.CLAIMED.value,
                      ),
                  )
                  if cur.rowcount != 1:
                      row = self._conn.execute(
                          "SELECT state FROM provider_preflights WHERE preflight_id=?",
                          (normalized.preflight_id,),
                      ).fetchone()
                      if row is None:
                          raise ProviderPreflightConflictError("PROVIDER_PREFLIGHT_NOT_FOUND")
                      raise ProviderPreflightConflictError(
                          f"PROVIDER_PREFLIGHT_NOT_CLAIMED: state={row['state']}"
                      )
              return copy.deepcopy(normalized)
          except sqlite3.Error as exc:
              raise ProviderPreflightError(
                  "PROVIDER_PREFLIGHT_CONSUME_FAILED: " + sanitize_sensitive_text(str(exc))
              ) from exc
'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("consume CAS patch applied")
          elif 'ProviderPreflightState.CLAIMED.value' in text and 'return copy.deepcopy(normalized)' in text:
              print("consume CAS patch already present")
          else:
              raise SystemExit("expected consume block not found; refusing broad edit")
          '@ | python -

      - name: Commit production patch if changed
        shell: pwsh
        run: |
          if (git diff --quiet -- connectors/marketing/preflight.py) {
            Write-Host "No production diff to commit"
            exit 0
          }
          git diff --check
          git diff -- connectors/marketing/preflight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connectors/marketing/preflight.py
          git commit -m "fix(platform): make provider preflight consume atomic"
          git push origin HEAD:fix/provider-preflight-consume-race-v1
