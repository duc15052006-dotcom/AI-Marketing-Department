name: Apply Model Gateway Midstream Error Health V1

on:
  push:
    branches:
      - test/model-gateway-midstream-error-health-v1

permissions:
  contents: write

concurrency:
  group: apply-model-gateway-midstream-error-health-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Apply minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")

          first_old = "\n".join([
              '                    if first_delta.finish_reason == "error":',
              '                        candidate_terminal_seen = True',
              '                        yield normalize_public_stream_delta(',
              '                            StreamDelta(content=first_delta.content, finish_reason=None),',
              '                            cand_provider,',
              '                            cand_model,',
              '                        )',
              '                        yield normalize_public_stream_delta(',
              '                            StreamDelta(',
              '                                content="",',
              '                                finish_reason="error",',
              '                                error=normalize_public_stream_error(first_delta.error, default_provider=cand_provider),',
              '                            ),',
              '                            cand_provider,',
              '                            cand_model,',
              '                        )',
              '                        return',
          ]) + "\n"
          first_new = "\n".join([
              '                    if first_delta.finish_reason == "error":',
              '                        candidate_terminal_seen = True',
              '                        terminal_err = normalize_public_stream_error(first_delta.error, default_provider=cand_provider)',
              '                        internal_code = stream_error_to_provider_error_code(terminal_err)',
              '                        self.config_service.record_error(cand_provider, internal_code)',
              '                        if internal_code == ProviderErrorCode.RATE_LIMIT_429:',
              '                            self.update_provider_health(cand_provider, ProviderHealth.RATE_LIMITED)',
              '                        elif internal_code == ProviderErrorCode.AUTH_401:',
              '                            self.update_provider_health(cand_provider, ProviderHealth.AUTH_ERROR)',
              '                        elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):',
              '                            self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)',
              '                        yield normalize_public_stream_delta(',
              '                            StreamDelta(content=first_delta.content, finish_reason=None),',
              '                            cand_provider,',
              '                            cand_model,',
              '                        )',
              '                        yield normalize_public_stream_delta(',
              '                            StreamDelta(',
              '                                content="",',
              '                                finish_reason="error",',
              '                                error=terminal_err,',
              '                            ),',
              '                            cand_provider,',
              '                            cand_model,',
              '                        )',
              '                        return',
          ]) + "\n"

          later_old = "\n".join([
              '                        if delta.finish_reason == "error":',
              '                            if delta.content:',
              '                                yield normalize_public_stream_delta(',
              '                                    StreamDelta(content=delta.content, finish_reason=None),',
              '                                    cand_provider,',
              '                                    cand_model,',
              '                                )',
              '                            yield normalize_public_stream_delta(',
              '                                StreamDelta(',
              '                                    content="",',
              '                                    finish_reason="error",',
              '                                    error=normalize_public_stream_error(delta.error, default_provider=cand_provider),',
              '                                ),',
              '                                cand_provider,',
              '                                cand_model,',
              '                            )',
              '                            return',
          ]) + "\n"
          later_new = "\n".join([
              '                        if delta.finish_reason == "error":',
              '                            terminal_err = normalize_public_stream_error(delta.error, default_provider=cand_provider)',
              '                            internal_code = stream_error_to_provider_error_code(terminal_err)',
              '                            self.config_service.record_error(cand_provider, internal_code)',
              '                            if internal_code == ProviderErrorCode.RATE_LIMIT_429:',
              '                                self.update_provider_health(cand_provider, ProviderHealth.RATE_LIMITED)',
              '                            elif internal_code == ProviderErrorCode.AUTH_401:',
              '                                self.update_provider_health(cand_provider, ProviderHealth.AUTH_ERROR)',
              '                            elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):',
              '                                self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)',
              '                            if delta.content:',
              '                                yield normalize_public_stream_delta(',
              '                                    StreamDelta(content=delta.content, finish_reason=None),',
              '                                    cand_provider,',
              '                                    cand_model,',
              '                                )',
              '                            yield normalize_public_stream_delta(',
              '                                StreamDelta(',
              '                                    content="",',
              '                                    finish_reason="error",',
              '                                    error=terminal_err,',
              '                                ),',
              '                                cand_provider,',
              '                                cand_model,',
              '                            )',
              '                            return',
          ]) + "\n"

          if first_new not in text:
              count = text.count(first_old)
              if count != 1:
                  raise SystemExit(f"expected exactly one first-visible error anchor, found {count}")
              text = text.replace(first_old, first_new, 1)
          if later_new not in text:
              count = text.count(later_old)
              if count != 1:
                  raise SystemExit(f"expected exactly one later-midstream error anchor, found {count}")
              text = text.replace(later_old, later_new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Run causal and structured-stream regressions after local patch
        run: |
          python -m unittest -v tests.test_model_gateway_midstream_error_health_v1
          python -m unittest -v tests.test_prod_structured_provider_stream_error_01
      - name: Commit production patch if needed
        shell: bash
        run: |
          if git diff --quiet -- integrations/models/gateway.py; then
            echo "No production diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): account midstream provider errors"
          git push origin HEAD:test/model-gateway-midstream-error-health-v1
