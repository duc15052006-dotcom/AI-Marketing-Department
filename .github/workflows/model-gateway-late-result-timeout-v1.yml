name: Model Gateway Late Result Timeout V1

on:
  push:
    branches:
      - test/model-gateway-late-result-timeout-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-gateway-late-result-timeout-v1-qualify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-production-fix:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(models) apply late result timeout fix')
    name: Apply minimal late-result deadline fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/model-gateway-late-result-timeout-v1

      - name: Patch post-provider deadline guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('integrations/models/gateway.py')
          text = path.read_text(encoding='utf-8')

          old_sync = '''            # Record fallback and resolution metadata\n            resp.metadata["resolved_provider"] = cand_provider\n'''
          new_sync = '''            # The gateway deadline remains authoritative even if an adapter\n            # ignores its delegated timeout and returns after the budget.\n            if (time.perf_counter() - start_time) >= total_timeout:\n                return ModelResponse(\n                    request_id=norm_req.request_id,\n                    provider=cand_provider,\n                    model_name=cand_model,\n                    status=ModelResponseStatus.TIMEOUT,\n                    error="TIMEOUT: Provider result arrived after the total gateway timeout budget.",\n                    usage=ModelUsage(usage_source="NOT_AVAILABLE"),\n                    latency_ms=(time.perf_counter() - start_time) * 1000.0,\n                )\n\n            # Record fallback and resolution metadata\n            resp.metadata["resolved_provider"] = cand_provider\n'''

          old_first = '''                stream_gen = adapter.generate_stream(req_copy)\n                first_delta = next(stream_gen, None)\n\n                if first_delta is None:\n'''
          new_first = '''                stream_gen = adapter.generate_stream(req_copy)\n                first_delta = next(stream_gen, None)\n\n                if (time.perf_counter() - start_time) >= total_timeout:\n                    close_stream = getattr(stream_gen, "close", None)\n                    if callable(close_stream):\n                        close_stream()\n                    yield normalize_public_stream_delta(\n                        StreamDelta(\n                            content="",\n                            finish_reason="error",\n                            error=ModelStreamError(\n                                code="TIMEOUT",\n                                category="TIMEOUT",\n                                safe_message="TIMEOUT: Provider stream result arrived after the total gateway timeout budget.",\n                                retryable=False,\n                                http_status=408,\n                            ),\n                        ),\n                        cand_provider,\n                        cand_model,\n                    )\n                    return\n\n                if first_delta is None:\n'''

          old_degrade = '''                        sync_resp = adapter.generate(req_copy)\n                        if sync_resp.status == ModelResponseStatus.SUCCESS:\n'''
          new_degrade = '''                        sync_resp = adapter.generate(req_copy)\n                        if (time.perf_counter() - start_time) >= total_timeout:\n                            yield normalize_public_stream_delta(\n                                StreamDelta(\n                                    content="",\n                                    finish_reason="error",\n                                    error=ModelStreamError(\n                                        code="TIMEOUT",\n                                        category="TIMEOUT",\n                                        safe_message="TIMEOUT: Provider fallback result arrived after the total gateway timeout budget.",\n                                        retryable=False,\n                                        http_status=408,\n                                    ),\n                                ),\n                                cand_provider,\n                                cand_model,\n                            )\n                            return\n                        if sync_resp.status == ModelResponseStatus.SUCCESS:\n'''

          old_loop = '''                for delta in stream_gen:\n                    if delta.content:\n'''
          new_loop = '''                for delta in stream_gen:\n                    if (time.perf_counter() - start_time) >= total_timeout:\n                        close_stream = getattr(stream_gen, "close", None)\n                        if callable(close_stream):\n                            close_stream()\n                        yield normalize_public_stream_delta(\n                            StreamDelta(\n                                content="",\n                                finish_reason="error",\n                                error=ModelStreamError(\n                                    code="TIMEOUT",\n                                    category="TIMEOUT",\n                                    safe_message="TIMEOUT: Provider stream result arrived after the total gateway timeout budget.",\n                                    retryable=False,\n                                    http_status=408,\n                                ),\n                            ),\n                            cand_provider,\n                            cand_model,\n                        )\n                        return\n                    if delta.content:\n'''

          for label, old in (("sync", old_sync), ("first", old_first), ("degrade", old_degrade), ("loop", old_loop)):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} locator count={count}; refusing patch')

          text = text.replace(old_sync, new_sync, 1)
          text = text.replace(old_first, new_first, 1)
          text = text.replace(old_degrade, new_degrade, 1)
          text = text.replace(old_loop, new_loop, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify causal regression before commit
        run: |
          python -m compileall -q integrations/models/gateway.py tests/test_model_gateway_late_result_timeout_v1.py
          python -m unittest -v tests.test_model_gateway_late_result_timeout_v1

      - name: Commit production fix only
        shell: bash
        run: |
          git diff -- integrations/models/gateway.py
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M integrations/models/gateway.py$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): reject provider results after gateway deadline"
          git push origin HEAD:test/model-gateway-late-result-timeout-v1

  focused-regression:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci(models) apply late result timeout fix')
    name: Ubuntu Python 3.12 focused — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: causal-late-result-timeout
            module: tests.test_model_gateway_late_result_timeout_v1
          - label: initial-timeout-budget
            module: tests.test_model_gateway_initial_timeout_budget_v1
          - label: stream-timeout-budget
            module: tests.test_model_gateway_stream_timeout_budget_v1
          - label: model-streaming
            module: tests.test_prod_model_streaming_01
          - label: structured-provider-stream-error
            module: tests.test_prod_structured_provider_stream_error_01
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile model and regression sources
        run: python -m compileall -q integrations/models tests/test_model_gateway_late_result_timeout_v1.py tests/test_model_gateway_initial_timeout_budget_v1.py tests/test_model_gateway_stream_timeout_budget_v1.py
      - name: Run focused regression — ${{ matrix.label }}
        run: python -m unittest -v ${{ matrix.module }}
      - name: Verify clean checkout after tests
        if: always()
        run: git diff --exit-code
