name: TEMP Apply Model Policy Default Fallback Authority V1

on:
  push:
    branches:
      - test/model-policy-default-fallback-authority-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Apply exact policy patch
        run: python .github/scripts/_tmp_apply_model_policy_default_fallback_authority_v1.py
      - name: Compile
        run: python -m compileall -q integrations/models tests
      - name: Run causal and certified Gateway regressions
        run: |
          python -m unittest -v tests.test_model_policy_default_fallback_authority_v1
          python -m unittest -v tests.test_model_gateway_implicit_policy_neutrality_v1
          python -m unittest -v tests.test_model_gateway_stream_degradation_exception_health_v1
          python -m unittest -v tests.test_model_gateway_post_dispatch_timeout_health_v2
          python -m unittest -v tests.test_model_gateway_permission_health_v1
      - name: Verify production diff scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "integrations/models/registry.py"
      - name: Commit production patch if needed
        shell: bash
        run: |
          if git diff --quiet -- integrations/models/registry.py; then
            echo "No production diff; already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/registry.py
          git commit -m "fix(models): leave default fallback authority to settings"
          git push origin HEAD:test/model-policy-default-fallback-authority-v1
