name: Non-Brain Explicit Fallback Authority V1

on:
  push:
    branches:
      - test/nonbrain-explicit-fallback-authority-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
  AI_MARKETING_MEMORY_EPHEMERAL: "1"
  AI_MARKETING_LEARNING_EPHEMERAL: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  focused-authority:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python --version

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile authority surface
        run: python -m compileall -q integrations/models tests/test_provider_bootstrap_hardening.py

      - name: Prove focused fallback authority GREEN
        run: python -m unittest -v tests.test_provider_bootstrap_hardening.TestProviderBootstrapHardening.test_provider_fallback_chain

      - name: Verify clean checkout
        if: always()
        shell: bash
        run: |
          git diff --exit-code
