name: Apply Runtime Checkpoint Deep Snapshot V1

on:
  push:
    branches:
      - fix/runtime-checkpoint-deep-snapshot-v1
    paths:
      - ".github/workflows/runtime-checkpoint-deep-snapshot-apply-v1.yml"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-production-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-checkpoint-deep-snapshot-v1
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          ACTUAL_BLOB="$(git hash-object runtime/context.py)"
          EXPECTED_BLOB="4a33366d438922646605a93053e0109e7d792b89"
          echo "expected_context_blob=$EXPECTED_BLOB"
          echo "actual_context_blob=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

      - name: Apply deep snapshot fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/context.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "import hashlib\nimport json\nimport uuid\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f"import anchor count={text.count(import_anchor)}")
          text = text.replace(import_anchor, "import copy\nimport hashlib\nimport json\nimport uuid\n", 1)

          snapshot_anchor = "            working_state_snapshot=dict(self.working_state),\n"
          if text.count(snapshot_anchor) != 1:
              raise SystemExit(f"snapshot anchor count={text.count(snapshot_anchor)}")
          text = text.replace(
              snapshot_anchor,
              "            working_state_snapshot=copy.deepcopy(self.working_state),\n",
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify production patch scope
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "runtime/context.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile patched context
        run: python -m py_compile runtime/context.py

      - name: Run targeted regressions before commit
        shell: bash
        run: |
          python -m unittest -v tests.test_runtime_checkpoint_deep_snapshot_v1
          python -m unittest discover -s tests -p "test_*context*.py" -v
          python -m unittest -v tests.test_structure

      - name: Commit production fix and remove temporary apply workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/context.py
          git rm .github/workflows/runtime-checkpoint-deep-snapshot-apply-v1.yml
          git diff --cached --check
          git commit -m "fix(runtime): deep-copy checkpoint working state"
          git push origin HEAD:fix/runtime-checkpoint-deep-snapshot-v1
