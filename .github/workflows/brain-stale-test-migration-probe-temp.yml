name: Brain Stale Test Migration Probe Temp

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Apply conservative test-only Content migration in worktree
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path('tests')
          replacements = (
              ('RuntimeStage.STRATEGIST', 'RuntimeStage.CONTENT'),
              ('execute_stage_strategist', 'execute_stage_content'),
              ('ctx.stage_outputs["strategist"]', 'ctx.stage_outputs["content"]'),
              ("ctx.stage_outputs['strategist']", "ctx.stage_outputs['content']"),
              ('stage_outputs["strategist"]', 'stage_outputs["content"]'),
              ("stage_outputs['strategist']", "stage_outputs['content']"),
              ('compile_grounded_package("strategist"', 'compile_grounded_package("content"'),
              ("compile_grounded_package('strategist'", "compile_grounded_package('content'"),
              ('prompts_for(gw, "strategist")', 'prompts_for(gw, "content")'),
              ("prompts_for(gw, 'strategist')", "prompts_for(gw, 'content')"),
              ('if l == "strategist"', 'if l == "content"'),
              ("if l == 'strategist'", "if l == 'content'"),
              ('("strategist", "Marketing Strategist")', '("content", "Content Strategy, Copywriting & Distribution")'),
              ("('strategist', 'Marketing Strategist')", "('content', 'Content Strategy, Copywriting & Distribution')"),
              ('{"cmo", "intelligence", "strategist", "creative", "performance"}', '{"cmo", "intelligence", "content", "creative", "performance"}'),
              ("{'cmo', 'intelligence', 'strategist', 'creative', 'performance'}", "{'cmo', 'intelligence', 'content', 'creative', 'performance'}"),
          )

          changed = []
          for path in root.glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())
          print('CHANGED_TEST_FILES=' + ','.join(changed))
          '@ | python -

      - name: Show migration diff
        shell: pwsh
        run: git diff -- tests | Out-File -Encoding utf8 migration.diff

      - name: Run full hermetic unittest discovery
        id: full
        shell: pwsh
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath full-unittest.log
          exit $LASTEXITCODE

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-stale-test-migration-probe-${{ github.sha }}
          path: |
            full-unittest.log
            migration.diff
          if-no-files-found: error
          retention-days: 7

      - name: Fail if full hermetic is not green
        if: steps.full.outcome != 'success'
        shell: pwsh
        run: exit 1
