name: Branch Fix Model Settings Call Count

on:
  push:
    branches:
      - fix/performance-two-pass-44

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/performance-two-pass-44
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Patch stale six-call invariant
        shell: pwsh
        run: |
          $path = "tests/test_prod_model_settings_01.py"
          $text = [System.IO.File]::ReadAllText($path)
          $old = '        self.assertEqual(mock_a.generate.call_count, 6)'
          $new = '        self.assertEqual(mock_a.generate.call_count, 7)'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "PATCH_ABORTED: expected exactly one stale six-call assertion, found $count" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          $lines = [System.IO.File]::ReadAllLines($path)
          if (-not ($lines -contains $new)) { throw "PATCH_ABORTED: seven-call assertion is not executable source" }
          python -m compileall -q tests/test_prod_model_settings_01.py tests/test_performance_two_pass_32.py tests/test_prod_runtime_progress_01.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused regressions
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01 tests.test_performance_two_pass_32 tests.test_prod_runtime_progress_01
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified assertion repair
        shell: pwsh
        run: |
          git diff --exit-code -- . ':!tests/test_prod_model_settings_01.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add tests/test_prod_model_settings_01.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align model settings call count with Performance 5A/5B"
          git push origin HEAD:fix/performance-two-pass-44
