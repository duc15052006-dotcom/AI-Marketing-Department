name: TMP Runtime Memory Write Scope RED

on:
  push:
    branches:
      - test/runtime-memory-write-scope-red-v1

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Run RED regression
        run: python -m unittest tests.test_runtime_memory_write_scope_authority_v1 -v
