name: One-shot Stale Brain Role References

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
    paths:
      - '.github/workflows/zz-one-shot-stale-brain-role-refs.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - name: Replace exact removed enum references
        run: python .github/scripts/zz_migrate_stale_brain_agent_refs.py

      - name: Compile Python sources
        run: python -m compileall -q brain runtime integrations tests

      - name: Run canonical identity and decision tests
        run: |
          python -m unittest -v tests.test_brain_canonical_agent_identity_v1
          python -m unittest -v tests.test_brain_decision_intelligence_v1

      - name: Commit migrated references
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.py' ':!/.github/scripts/zz_migrate_stale_brain_agent_refs.py'
          git commit -m "test(brain): migrate stale fixtures to Content identity"
          git push origin HEAD:fix/brain-content-canonical-role-v1
