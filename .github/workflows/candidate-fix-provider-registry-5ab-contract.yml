name: Candidate Fix Provider Registry 5A5B Contract

on:
  push:
    branches: [integration/final-main-reconciliation-v1]

permissions:
  contents: write

jobs:
  fix-provider-registry-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: '1'
      AI_MARKETING_MEMORY_EPHEMERAL: '1'
      AI_MARKETING_LEARNING_EPHEMERAL: '1'
      RUN_LIVE_PROVIDER_TESTS: '0'
      RUN_REAL_MODEL_TEST: '0'
      RUN_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact repair ancestry and untouched target blob
        shell: bash
        run: |
          set -euo pipefail
          expected='06900344811bc424c20342624a4ca01d732a2572'
          git merge-base --is-ancestor "$expected" HEAD
          expected_blob="$(git rev-parse "$expected:tests/test_prod_model_gateway_01_provider_registry.py")"
          current_blob="$(git rev-parse 'HEAD:tests/test_prod_model_gateway_01_provider_registry.py')"
          test "$current_blob" = "$expected_blob"
      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt
      - name: Patch only stale provider-registry model-call contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_prod_model_gateway_01_provider_registry.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '    def test_58_active_run_provider_disable_does_not_change_run_routing(self):'
          end_marker = '    def test_59_new_run_observes_provider_disable(self):'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          section = text[start:end]

          old_assert = 'self.assertEqual(mock_a.generate.call_count, 6)'
          new_assert = 'self.assertEqual(mock_a.generate.call_count, 7)'
          if section.count(old_assert) != 1:
              raise RuntimeError(f'expected exactly one stale assertion inside test_58, found {section.count(old_assert)}')

          old_comment = '# Provider A was invoked for all 6 stages of RUN-1'
          new_comment = '# Six logical stages include Performance 5A/5B, so RUN-1 makes seven model calls.'
          if section.count(old_comment) != 1:
              raise RuntimeError(f'expected exactly one stale comment inside test_58, found {section.count(old_comment)}')

          section = section.replace(old_assert, new_assert, 1).replace(old_comment, new_comment, 1)
          text = text[:start] + section + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run complete provider-registry regression
        shell: bash
        run: |
          python -m unittest -v tests.test_prod_model_gateway_01_provider_registry
      - name: Remove temporary workflow and commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/candidate-fix-provider-registry-5ab-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_prod_model_gateway_01_provider_registry.py .github/workflows/candidate-fix-provider-registry-5ab-contract.yml
          git diff --cached --check
          git commit -m "test(provider-registry): align active-run contract with Performance 5A/5B"
          git push origin HEAD:integration/final-main-reconciliation-v1
