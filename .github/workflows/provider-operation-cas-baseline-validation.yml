name: Provider Operation CAS Baseline Validation

# Temporary diagnostic harness for PR #172. The checkout is pinned to the exact
# pre-CAS baseline so no production code from the fix branch is under test.
on:
  push:
    branches:
      - validation/provider-operation-cas-baseline-e7f9c118

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7f9c118fcac3d3ec680da47b36a53f512972792
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run baseline provider operation regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_provider_operation_tracker_v1 `
            tests.test_provider_operation_tracker_adversarial_v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath full-hermetic-unittest.log
          $testExit = $LASTEXITCODE
          Write-Host "===== full hermetic unittest tail ====="
          Get-Content full-hermetic-unittest.log -Tail 300
          if ($testExit -ne 0) { exit $testExit }
      - name: Upload full hermetic unittest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-operation-cas-baseline-full-hermetic-log
          path: full-hermetic-unittest.log
          if-no-files-found: warn
          retention-days: 7
