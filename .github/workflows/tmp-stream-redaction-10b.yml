name: Temporary SSE Redaction Regression

on:
  push:
    branches: [fix/stream-error-redaction-10b]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stream-error-redaction-10b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile and diff check
        shell: pwsh
        run: |
          python -m py_compile app_api/streaming.py tests/test_stream_error_redaction_10.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run SSE security and regression suites
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_stream_error_redaction_10 `
            tests.test_prod_python_streaming_endpoint_01 `
            tests.test_prod_runtime_progress_01 `
            tests.test_prod_model_streaming_01 `
            tests.test_prod_structured_provider_stream_error_01 `
            tests.test_secret_sanitization_03
