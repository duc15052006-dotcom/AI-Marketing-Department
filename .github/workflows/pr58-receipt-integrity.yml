name: PR58 Receipt Integrity
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: '0'
      RUN_REAL_MODEL_TEST: '0'
      RUN_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/receipt-index-metadata-integrity-58
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Add adversarial regression
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Prove red before patch
        run: if python -m unittest -v tests.test_platform_durable_receipts_reconciliation_v1.DurableReceiptsReconciliationV1Tests.test_sqlite_receipt_index_column_tamper_is_detected; then echo 'Expected red regression but test passed'; exit 1; else echo 'RED CONFIRMED'; fi
      - name: Patch receipt decoder
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Run targeted regressions
        run: python -m unittest -v tests.test_platform_durable_receipts_reconciliation_v1 tests.test_tool_receipt_provenance_04
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr58-receipt-integrity.yml
          git add tools/receipts.py tests/test_platform_durable_receipts_reconciliation_v1.py
          git diff --cached --check
          git commit -m 'harden: bind receipt index metadata to payload hash'
          git push origin HEAD:fix/receipt-index-metadata-integrity-58
