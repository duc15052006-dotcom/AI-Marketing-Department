name: Brain Meta Learning Use Boundary Revalidation V1

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact CI identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile
        run: python -m py_compile brain/meta_learning.py tests/test_brain_meta_learning_use_boundary_revalidation_v1.py
      - name: Run meta-learning mutation and adjacent policy regressions
        run: |
          python -m unittest -v tests.test_brain_meta_learning_use_boundary_revalidation_v1
          python -m unittest -v tests.test_brain_meta_learning_policy_v1 tests.test_brain_metacognition_intelligence_v1
