name: Provider Preflight Claim Race Validation

on:
  push:
    branches:
      - fix/provider-preflight-claim-race-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-baseline-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: 613251aa43981a06d9c06e255ed97e533c50988e
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Record baseline identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          "workflow_sha=${{ github.sha }}" | Tee-Object -FilePath .ci-results/identity.txt
          "expected_baseline=613251aa43981a06d9c06e255ed97e533c50988e" | Tee-Object -FilePath .ci-results/identity.txt -Append
          git rev-parse HEAD 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ((git rev-parse HEAD).Trim() -ne "613251aa43981a06d9c06e255ed97e533c50988e") { throw "baseline SHA mismatch" }

      - name: Run exact baseline full hermetic unittest discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath .ci-results/baseline-full-hermetic-unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-claim-race-baseline-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
