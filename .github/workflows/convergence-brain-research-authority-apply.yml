          Path('tests/test_brain_research_authority_runtime_integration_v1.py').write_text(r'''from __future__ import annotations

import tempfile
import unittest
from pathlib import Path

from brain.action_policy import ActionDisposition
from brain.research_authority import BrainResearchAuthority, authorize_research_action
from runtime.brain_authority import RuntimeBrainResearchAuthorityResolver
from runtime.context import RuntimeContext
from runtime.engine import FiveAgentDepartmentRuntime
from tools.adapters import AdapterResult, BaseCapabilityAdapter
from tools.capabilities import CapabilityRegistry
from tools.receipts import ExecutionMode, ExecutionReceiptRepository, ExecutionStatus
from tools.tool_gateway import ToolGateway, ToolRequest


class CountingObservationAdapter(BaseCapabilityAdapter):
    def __init__(self) -> None:
        self.dispatch_count = 0

    @property
    def adapter_name(self) -> str:
        return "counting_observation_adapter"

    def execute(self, capability_id, parameters, timeout_seconds=30.0, *, run_id="", business_id="", project_id=""):
        self.dispatch_count += 1
        return AdapterResult(
            success=True,
            data={"observed": True},
            execution_mode=ExecutionMode.MOCK,
        )


class BrainResearchAuthorityRuntimeIntegrationV1Tests(unittest.TestCase):
    @staticmethod
    def _context() -> RuntimeContext:
        return RuntimeContext(
            run_id="RUN-RESEARCH-AUTH-1",
            objective="Assess market demand using source-backed evidence",
            business_id="BIZ-RESEARCH-AUTH-1",
        )

    @staticmethod
    def _request(capability_id: str = "web_search") -> ToolRequest:
        return ToolRequest(
            request_id="REQ-RESEARCH-AUTH-1",
            run_id="RUN-RESEARCH-AUTH-1",
            agent_id="intelligence",
            capability_id=capability_id,
            parameters={"query": "market demand"},
            business_id="BIZ-RESEARCH-AUTH-1",
        )

    def test_resolver_builds_canonical_research_authority(self):
        resolver = RuntimeBrainResearchAuthorityResolver(CapabilityRegistry())
        authority = resolver(self._context(), self._request())
        self.assertIsInstance(authority, BrainResearchAuthority)
        authorization = authorize_research_action(authority)
        self.assertEqual(authorization.disposition, ActionDisposition.ALLOW)
        self.assertIsNone(authority.action_intent.decision_id)

    def test_runtime_forwards_research_authority_and_dispatches_once(self):
        with tempfile.TemporaryDirectory() as tmp:
            registry = CapabilityRegistry()
            repo = ExecutionReceiptRepository(database_path=Path(tmp) / "receipts.sqlite3")
            gateway = ToolGateway(capability_registry=registry, receipt_repository=repo)
            adapter = CountingObservationAdapter()
            gateway.bind_adapter_alias("search_adapter", adapter)
            runtime = FiveAgentDepartmentRuntime(
                tool_gateway=gateway,
                brain_research_authority_resolver=RuntimeBrainResearchAuthorityResolver(registry),
            )
            try:
                receipt = runtime._execute_tool_request(self._context(), self._request())
            finally:
                repo.close()
        self.assertEqual(receipt.status, ExecutionStatus.SUCCESS)
        self.assertEqual(adapter.dispatch_count, 1)

    def test_research_authority_cannot_authorize_create_capability(self):
        with tempfile.TemporaryDirectory() as tmp:
            registry = CapabilityRegistry()
            resolver = RuntimeBrainResearchAuthorityResolver(registry)
            authority = resolver(self._context(), self._request())
            repo = ExecutionReceiptRepository(database_path=Path(tmp) / "receipts.sqlite3")
            gateway = ToolGateway(capability_registry=registry, receipt_repository=repo)
            try:
                receipt = gateway.execute(
                    ToolRequest(
                        request_id="REQ-CREATE-1",
                        run_id="RUN-RESEARCH-AUTH-1",
                        agent_id="intelligence",
                        capability_id="text_generation_support",
                        parameters={},
                        business_id="BIZ-RESEARCH-AUTH-1",
                    ),
                    research_authority=authority,
                )
            finally:
                repo.close()
        self.assertEqual(receipt.status, ExecutionStatus.BLOCKED)
        self.assertEqual(receipt.error_class, "BRAIN_RESEARCH_DENIED")

    def test_production_backend_wires_research_resolver(self):
        source = Path('app_api/server.py').read_text(encoding='utf-8')
        self.assertIn(
            'brain_research_authority_resolver=RuntimeBrainResearchAuthorityResolver(self.cap_registry)',
            source,
        )


if __name__ == '__main__':
    unittest.main()
''', encoding='utf-8')
