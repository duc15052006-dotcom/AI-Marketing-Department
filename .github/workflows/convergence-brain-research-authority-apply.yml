     business_id=effective_business_id, project_id=effective_project_id,\n                    )\n                )\n            if (\n                binding_assessment.disposition != CapabilityBindingDisposition.BOUND\n                or binding_assessment.intent_id != research_intent.intent_id\n                or binding_assessment.capability_id != cap.capability_id\n                or not isinstance(research_authorization, ActionAuthorization)\n                or research_authorization.intent_id != research_intent.intent_id\n                or research_authorization.disposition != ActionDisposition.ALLOW\n            ):\n                reason = (\n                    binding_assessment.reason\n                    if binding_assessment.disposition != CapabilityBindingDisposition.BOUND\n                    else getattr(research_authorization, "reason", "RESEARCH_AUTHORIZATION_INVALID")\n                )\n                return self.receipt_repository.save_receipt(\n                    self._error_receipt(\n                        request, provider=cap.provider, request_hash=req_hash,\n                        started_at=start_time, status=ExecutionStatus.BLOCKED,\n                        error_class="BRAIN_RESEARCH_DENIED", error_message=reason,\n                        business_id=effective_business_id, project_id=effective_project_id,\n                    )\n                )\n            semantic_intent_id = research_intent.intent_id\n\n        semantic_context_present = (\n            action_intent is not None or decision_request is not None\n        )\n''',
