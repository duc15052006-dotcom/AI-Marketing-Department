name: Convergence Brain Research Authority Apply

on:
  pull_request:
    branches:
      - integration/brain-nonbrain-convergence-v1
    paths:
      - ".github/workflows/convergence-brain-research-authority-apply.yml"

permissions:
  contents: write

jobs:
  validate-and-apply-source-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/brain-nonbrain-mergework-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering convergence SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact branch and stale-run guards
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "integration/brain-nonbrain-mergework-v1"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch origin integration/brain-nonbrain-mergework-v1
          test "$(git rev-parse origin/integration/brain-nonbrain-mergework-v1)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" != "main"

      - name: Install repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply Brain research authority migration slice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('brain/research_authority.py').write_text(r'''"""Canonical Brain authority for epistemic evidence-gathering actions.

Research authority is deliberately separate from Decision authority.  A decision
cannot require evidence and simultaneously be the authority to acquire the first
piece of that evidence.  This module therefore authorizes only a canonical
RESEARCH cognitive phase tied to an explicit blocking EvidenceNeed.  It never
executes tools, chooses providers, grants publish/write authority, or substitutes
for DecisionEvaluation on consequential actions.
"""

from __future__ import annotations

from dataclasses import dataclass

from brain.action_policy import ActionAuthorization, ActionDisposition
from brain.cognitive_loop import (
    CognitiveCycleRequest,
    CognitiveDirectiveKind,
    CognitivePhase,
    derive_cognitive_cycle,
)
from brain.contracts import ActionIntent


@dataclass(frozen=True)
class BrainResearchAuthority:
    """Exact semantic envelope authorizing one evidence-acquisition intent."""

    action_intent: ActionIntent
    cycle_request: CognitiveCycleRequest
    evidence_need_id: str

    def __post_init__(self) -> None:
        if not isinstance(self.action_intent, ActionIntent):
            raise ValueError("action_intent must be an ActionIntent")
        if not isinstance(self.cycle_request, CognitiveCycleRequest):
            raise ValueError("cycle_request must be a CognitiveCycleRequest")
        need_id = str(self.evidence_need_id or "").strip()
        if not need_id:
            raise ValueError("evidence_need_id must be non-empty")
        object.__setattr__(self, "evidence_need_id", need_id)

        if self.action_intent.decision_id is not None:
            raise ValueError(
                "research ActionIntent must not masquerade as Decision authority"
            )
        if self.action_intent.evidence_required:
            raise ValueError(
                "research ActionIntent cannot require pre-existing decision evidence"
            )
        if self.action_intent.goal_id != self.cycle_request.goal.goal_id:
            raise ValueError(
                "research ActionIntent goal_id must match cognitive cycle goal"
            )

        matching_intents = [
            item
            for item in self.cycle_request.action_intents
            if item.intent_id == self.action_intent.intent_id
        ]
        if len(matching_intents) != 1 or (
            matching_intents[0].model_dump() != self.action_intent.model_dump()
        ):
            raise ValueError(
                "research ActionIntent must be retained exactly in the cognitive request"
            )

        matching_needs = [
            item
            for item in self.cycle_request.evidence_needs
            if item.need_id == need_id
        ]
        if len(matching_needs) != 1:
            raise ValueError(
                "evidence_need_id must identify exactly one canonical EvidenceNeed"
            )
        if matching_needs[0].goal_id != self.action_intent.goal_id:
            raise ValueError(
                "EvidenceNeed goal_id must match research ActionIntent goal_id"
            )


def authorize_research_action(
    authority: BrainResearchAuthority,
) -> ActionAuthorization:
    """Recompute canonical cognition and authorize only an explicit RESEARCH need."""

    if not isinstance(authority, BrainResearchAuthority):
        raise ValueError("authority must be a BrainResearchAuthority")

    intent = authority.action_intent

    def block(reason: str) -> ActionAuthorization:
        return ActionAuthorization(
            intent_id=intent.intent_id,
            disposition=ActionDisposition.BLOCK,
            reason=reason,
        )

    cycle = derive_cognitive_cycle(authority.cycle_request)
    if cycle.phase != CognitivePhase.RESEARCH:
        return block(
            "RESEARCH_PHASE_REQUIRED: canonical cognition did not select RESEARCH."
        )

    targeted = {
        target_id
        for directive in cycle.directives
        if directive.kind == CognitiveDirectiveKind.RESEARCH
        for target_id in directive.target_ids
    }
    if authority.evidence_need_id not in targeted:
        return block(
            "EVIDENCE_NEED_NOT_TARGETED: canonical RESEARCH directive did not target the bound EvidenceNeed."
        )

    return ActionAuthorization(
        intent_id=intent.intent_id,
        disposition=ActionDisposition.ALLOW,
        reason=(
            "CANONICAL_RESEARCH_NEED: Brain RESEARCH phase explicitly requires "
            "the bound evidence acquisition."
        ),
    )
''', encoding='utf-8')

          Path('runtime/brain_authority.py').write_text(r'''"""Production bridge from trusted RuntimeContext to canonical Brain research authority.

The bridge is intentionally narrow.  It may translate a proposed read-only
observation into an explicit Brain EvidenceNeed, but it cannot authorize CREATE,
PUBLISH, external writes, high-risk operations, or any consequential action.
Those require the canonical Decision authority path.
"""

from __future__ import annotations

import hashlib
from typing import Optional

from brain.contracts import ActionIntent, BrainAgentId, EvidenceNeed, GoalSpec
from brain.cognitive_loop import CognitiveCycleRequest
from brain.research_authority import BrainResearchAuthority
from runtime.context import RuntimeContext
from tools.capabilities import (
    CapabilityCategory,
    CapabilityRegistry,
    EvidenceRole,
    PermissionLevel,
    RiskLevel,
)
from tools.tool_gateway import ToolRequest


class RuntimeBrainResearchAuthorityResolver:
    """Build canonical research authority only for trusted non-consequential observations."""

    def __init__(self, capability_registry: CapabilityRegistry) -> None:
        if not isinstance(capability_registry, CapabilityRegistry):
            raise ValueError("capability_registry must be a CapabilityRegistry")
        self._registry = capability_registry

    @staticmethod
    def _stable_id(prefix: str, value: str) -> str:
        digest = hashlib.sha256(value.encode("utf-8")).hexdigest()[:20].upper()
        return f"{prefix}-{digest}"

    @staticmethod
    def _is_epistemic_observation(capability) -> bool:
        write_permissions = {
            PermissionLevel.EXTERNAL_WRITE,
            PermissionLevel.PUBLISH,
            PermissionLevel.FINANCIAL_OR_HIGH_RISK,
        }
        return bool(
            capability.evidence_role == EvidenceRole.OBSERVATION
            and capability.category != CapabilityCategory.PUBLISH
            and not capability.human_approval_required
            and capability.risk_level not in (RiskLevel.HIGH, RiskLevel.CRITICAL)
            and not any(
                permission in write_permissions
                for permission in capability.required_permissions
            )
        )

    def __call__(
        self,
        context: RuntimeContext,
        request: ToolRequest,
    ) -> Optional[BrainResearchAuthority]:
        capability = self._registry.get_capability(request.capability_id)
        if capability is None or not self._is_epistemic_observation(capability):
            return None

        semantic_needs = sorted(
            {
                str(value).strip().upper()
                for value in capability.semantic_needs
                if str(value).strip()
            }
        )
        if len(semantic_needs) != 1:
            raise RuntimeError(
                "BRAIN_RESEARCH_AUTHORITY_REQUIRED: observational capability must declare exactly one semantic need"
            )

        try:
            owner = BrainAgentId(str(request.agent_id or "").strip().upper())
        except ValueError as exc:
            raise RuntimeError(
                "BRAIN_RESEARCH_AUTHORITY_REQUIRED: requesting agent is not canonical"
            ) from exc

        goal_id = self._stable_id(
            "GOAL",
            f"{context.run_id}\x1f{context.objective}",
        )
        base = f"{context.run_id}\x1f{request.request_id}\x1f{request.capability_id}"
        need_id = self._stable_id("NEED", base)
        intent_id = self._stable_id("INTENT", base)
        cycle_id = self._stable_id("CYCLE", base)

        goal = GoalSpec(
            goal_id=goal_id,
            objective=context.objective,
            owner_agent=BrainAgentId.CMO,
            success_criteria=[],
            constraints=list(context.constraints),
        )
        need = EvidenceNeed(
            need_id=need_id,
            goal_id=goal_id,
            question=(
                "Gather trustworthy observation evidence needed to reduce uncertainty "
                f"for the active objective: {context.objective}"
            ),
            why_needed=(
                "Downstream reasoning must be grounded in external observation before "
                "claims or consequential decisions are authorized."
            ),
            blocking=True,
            evidence_refs=[],
        )
        intent = ActionIntent(
            intent_id=intent_id,
            goal_id=goal_id,
            owner_agent=owner,
            purpose="Acquire evidence for the canonical Brain EvidenceNeed",
            capability_need=semantic_needs[0],
            expected_observation=(
                "A source-backed observation relevant to the active marketing objective"
            ),
            decision_id=None,
            evidence_required=False,
            constraints=list(context.constraints),
        )
        cycle_request = CognitiveCycleRequest(
            cycle_id=cycle_id,
            goal=goal,
            evidence_needs=[need],
            unknowns=[],
            plan=None,
            decisions=[],
            action_intents=[intent],
            reflection_reports=[],
        )
        return BrainResearchAuthority(
            action_intent=intent,
            cycle_request=cycle_request,
            evidence_need_id=need_id,
        )
''', encoding='utf-8')

