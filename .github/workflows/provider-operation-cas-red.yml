name: Provider Operation CAS RED

# Temporary branch-local harness used only to capture RED/GREEN evidence for PR #172.
on:
  push:
    branches:
      - fix/provider-operation-concurrent-update-cas

permissions:
  contents: read

jobs:
  red-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run targeted adversarial regression
        shell: pwsh
        run: python -m unittest -v tests.test_provider_operation_tracker_concurrency_adversarial_v1
