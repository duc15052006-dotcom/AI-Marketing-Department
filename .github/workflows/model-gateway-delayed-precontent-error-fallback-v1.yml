name: Model Gateway Delayed Precontent Error Fallback V1

on:
  push:
    branches:
      - test/model-gateway-delayed-precontent-error-fallback-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-gateway-delayed-precontent-error-fallback-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    name: Ubuntu Python 3.12 apply minimal fix and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        run: |
          echo "github_sha=${{ github.sha }}"
          echo "github_ref=${{ github.ref }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply minimal delayed-precontent fallback patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          marker = "candidate_fallback_error: Optional[ModelStreamError] = None"
          if any(marker in line for line in lines):
              print("Production fix already present; no patch needed.")
              raise SystemExit(0)

          state_idx = next(
              i for i in range(1, len(lines))
              if lines[i].strip() == "candidate_terminal_seen = False"
              and lines[i - 1].strip() == "candidate_visible_content = False"
          )
          state_indent = lines[state_idx][: len(lines[state_idx]) - len(lines[state_idx].lstrip())]
          lines.insert(state_idx + 1, f"{state_indent}{marker}\n")

          stream_idx = next(i for i, line in enumerate(lines) if line.strip() == "for delta in stream_gen:")
          error_idx = next(
              i for i in range(stream_idx + 1, len(lines))
              if lines[i].strip() == 'if delta.finish_reason == "error":'
          )
          error_indent = lines[error_idx][: len(lines[error_idx]) - len(lines[error_idx].lstrip())]
          else_idx = next(
              i for i in range(error_idx + 1, len(lines))
              if lines[i].strip() == "else:"
              and lines[i].startswith(error_indent)
              and len(lines[i]) - len(lines[i].lstrip()) == len(error_indent)
          )

          I = error_indent
          J = I + "    "
          K = J + "    "
          L = K + "    "
          replacement = [
              f'{I}if delta.finish_reason == "error":\n',
              f"{J}cand_err = normalize_public_stream_error(delta.error, default_provider=cand_provider)\n",
              f"{J}if not candidate_visible_content:\n",
              f"{K}last_error = cand_err\n",
              f"{K}last_error_provider = cand_provider\n",
              f"{K}last_error_model = cand_model\n",
              f"{K}internal_code = stream_error_to_provider_error_code(cand_err)\n",
              f"{K}self.config_service.record_error(cand_provider, internal_code)\n",
              f"{K}if internal_code == ProviderErrorCode.RATE_LIMIT_429:\n",
              f"{L}self.update_provider_health(cand_provider, ProviderHealth.RATE_LIMITED)\n",
              f"{K}elif internal_code == ProviderErrorCode.AUTH_401:\n",
              f"{L}self.update_provider_health(cand_provider, ProviderHealth.AUTH_ERROR)\n",
              f"{K}elif internal_code in (ProviderErrorCode.TIMEOUT, ProviderErrorCode.NETWORK_ERROR):\n",
              f"{L}self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE)\n",
              f"{K}if strict_model_pin or len(candidates) == 1:\n",
              f"{L}yield normalize_public_stream_delta(delta, cand_provider, cand_model)\n",
              f"{L}return\n",
              f"{K}candidate_fallback_error = cand_err\n",
              f"{K}break\n",
              f"{J}if delta.content:\n",
              f"{K}yield normalize_public_stream_delta(\n",
              f"{L}StreamDelta(content=delta.content, finish_reason=None),\n",
              f"{L}cand_provider,\n",
              f"{L}cand_model,\n",
              f"{K})\n",
              f"{J}yield normalize_public_stream_delta(\n",
              f"{K}StreamDelta(\n",
              f'{L}content="",\n',
              f'{L}finish_reason="error",\n',
              f"{L}error=cand_err,\n",
              f"{K}),\n",
              f"{K}cand_provider,\n",
              f"{K}cand_model,\n",
              f"{J})\n",
              f"{J}return\n",
          ]
          lines[error_idx:else_idx] = replacement

          eof_idx = next(
              i for i in range(stream_idx + 1, len(lines))
              if "# 6. Generator finished. Check if candidate finished without a terminal delta" in lines[i]
          )
          eof_indent = lines[eof_idx][: len(lines[eof_idx]) - len(lines[eof_idx].lstrip())]
          lines[eof_idx:eof_idx] = [
              f"{eof_indent}if candidate_fallback_error is not None:\n",
              f"{eof_indent}    continue\n",
              "\n",
          ]

          path.write_text("".join(lines), encoding="utf-8")
          print("Applied delayed pre-content stream error fallback patch.")
          PY

      - name: Compile causal sources
        run: python -m compileall -q integrations/models tests/test_model_gateway_stream_delayed_precontent_error_fallback_v1.py

      - name: Run causal regression
        run: python -m unittest -v tests.test_model_gateway_stream_delayed_precontent_error_fallback_v1

      - name: Show production diff
        run: git diff -- integrations/models/gateway.py

      - name: Commit production fix when needed
        run: |
          if git diff --quiet -- integrations/models/gateway.py; then
            echo "Production fix already present on this exact head."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): fallback after delayed precontent stream error"
          git push origin HEAD:${GITHUB_REF_NAME}
