name: One-shot Repair Agent Semantic Boundaries

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
    paths:
      - '.github/workflows/zz-one-shot-agent-semantic-boundary-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brain-content-canonical-role-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply semantic role-boundary repair
        run: python .github/scripts/zz_repair_agent_semantic_boundaries.py

      - name: Compile affected tests and Brain contracts
        run: python -m compileall -q brain tests

      - name: Run role-boundary regressions
        run: |
          python -m unittest -v \
            tests.test_agent_prompt_semantic_role_boundaries_v1 \
            tests.test_agent_manifests \
            tests.test_brain_five_agent_dna_contract_v1 \
            tests.test_brain_canonical_agent_identity_v1

      - name: Remove one-shot repair tooling
        run: |
          rm .github/scripts/zz_repair_agent_semantic_boundaries.py
          rm .github/workflows/zz-one-shot-agent-semantic-boundary-repair.yml

      - name: Commit verified semantic boundary repair atomically
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git commit -m "fix(brain): separate Content and Creative ownership"
          git push origin HEAD:fix/brain-content-canonical-role-v1
