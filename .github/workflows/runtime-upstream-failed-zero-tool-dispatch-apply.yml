name: Apply Runtime Upstream Failed Zero Tool Dispatch V1

on:
  push:
    branches:
      - fix/runtime-upstream-failed-zero-tool-dispatch-v1
    paths:
      - ".github/workflows/runtime-upstream-failed-zero-tool-dispatch-apply.yml"
      - ".github/scripts/apply_upstream_failed_zero_dispatch_v1.py"

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact preimage
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          actual="$(git hash-object runtime/engine.py)"
          expected="6981e4e68a1786a9565364f306c939005c224fce"
          echo "expected_engine_blob=$expected"
          echo "actual_engine_blob=$actual"
          test "$actual" = "$expected"
      - name: Apply guarded fail-closed patch
        run: python .github/scripts/apply_upstream_failed_zero_dispatch_v1.py
      - name: Verify production patch scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "runtime/engine.py"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run targeted regression before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_upstream_failed_zero_tool_dispatch_v1 \
            tests.test_runtime_intelligence_adaptive_fanout_v1
      - name: Commit production fix and remove temporary apply harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-upstream-failed-zero-tool-dispatch-apply.yml
          git rm .github/scripts/apply_upstream_failed_zero_dispatch_v1.py
          git add runtime/engine.py
          git diff --cached --check
          git commit -m "fix(runtime): stop failed stages before tool dispatch"
          git push origin HEAD:fix/runtime-upstream-failed-zero-tool-dispatch-v1
