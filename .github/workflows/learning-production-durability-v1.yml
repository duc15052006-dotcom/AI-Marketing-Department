name: Learning Production Durability V1

on:
  pull_request:
    paths:
      - "memory/learning.py"
      - "memory/sqlite_learning_repository.py"
      - "tests/test_production_learning_restart_durability_adversarial_v1.py"
      - ".github/workflows/learning-production-durability-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-production-durability-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learning-durability:
    name: Production learning restart durability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      AI_MARKETING_MEMORY_EPHEMERAL: "1"
      AI_MARKETING_LEARNING_EPHEMERAL: "1"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact CI identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_head_sha=${expected}"
          echo "actual_head_sha=${actual}"
          test "${actual}" = "${expected}"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile and run learning durability regressions
        run: |
          python -m compileall -q memory tests/test_production_learning_restart_durability_adversarial_v1.py
          python -m unittest -v \
            tests.test_production_learning_restart_durability_adversarial_v1 \
            tests.test_phase1a_runtime_integrity \
            tests.test_phase1b_grounded_context \
            tests.test_phase5_1_foundation \
            tests.test_phase5_2_runtime_integration \
            tests.test_phase6_1_v1_connectors_and_workspace \
            tests.test_phase6_2_pilot_and_v1_release
