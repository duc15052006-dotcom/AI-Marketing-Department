name: Brain Content Final Test Migration V2

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/brain-content-canonical-role-v1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply fail-closed canonical Content test migration
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/brain_content_final_test_migration.py

      - name: Compile migrated regression surface
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q runtime schemas tests

      - name: Run focused regression set
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            test_collaboration_adversarial_final.py \
            test_collaboration_definition.py \
            test_collaboration_integrity_audit.py \
            test_model_execution_bridge.py \
            test_phase1a_runtime_integrity.py \
            test_schemas.py \
            test_prod_core_authority_01a.py \
            test_prod_runtime_01_single_run_authority.py \
            test_applicationization_v1.py \
            test_chat_first_app_v1.py \
            test_chat_persistence_v1.py \
            test_phase5_1_foundation.py \
            test_phase5_2_runtime_integration.py \
            test_phase6_1_v1_connectors_and_workspace.py \
            test_phase6_2_pilot_and_v1_release.py; do
            python -m unittest discover -s tests -p "$pattern" -v
          done

      - name: Commit clean migration and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/brain-content-final-test-migration.yml
          rm -f .github/scripts/brain_content_final_test_migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests .github/workflows/brain-content-final-test-migration.yml .github/scripts/brain_content_final_test_migration.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No migration changes produced"; exit 1; }
          git commit -m "test(brain): complete canonical Content regression migration"
          git push origin HEAD:fix/brain-content-canonical-role-v1
