name: Runtime Citation Ownership Isolation V1

on:
  pull_request:
    branches:
      - fix/runtime-sealed-receipt-scope-isolation-v1
    paths:
      - "runtime/engine.py"
      - "tests/test_runtime_lineage_citation_run_isolation_v1.py"
      - "tests/test_runtime_evidence_citation_provenance_v1.py"
      - ".github/workflows/runtime-citation-ownership-isolation-v1.yml"

permissions:
  contents: write

jobs:
  runtime-citation-ownership-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head identity
        shell: bash
        run: |
          mkdir -p .ci-results
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED" "$ACTUAL" | tee .ci-results/identity.txt
          test "$ACTUAL" = "$EXPECTED"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply atomic citation ownership claim patch once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")
          marker = "# Commit citation ownership only after artifact integrity sealing succeeds."
          if marker in text:
              print("atomic citation ownership marker already present; no-op")
              raise SystemExit(0)

          premature_claim = (
              "            for citation_id in sealed_citation_ids:\n"
              "                self._citation_owner_by_id[citation_id] = context.run_id\n"
              "\n"
          )
          if text.count(premature_claim) != 1:
              raise SystemExit(f"unexpected premature claim count: {text.count(premature_claim)}")
          text = text.replace(premature_claim, "", 1)

          hash_anchor = "            artifact.final_artifact_hash = artifact.compute_artifact_hash()\n\n"
          committed_claim = (
              hash_anchor
              + "            # Commit citation ownership only after artifact integrity sealing succeeds.\n"
              + "            # A failed artifact construction/hash must not poison ownership.\n"
              + "            for citation_id in sealed_citation_ids:\n"
              + "                self._citation_owner_by_id[citation_id] = context.run_id\n"
              + "\n"
          )
          if text.count(hash_anchor) != 1:
              raise SystemExit(f"unexpected artifact hash anchor count: {text.count(hash_anchor)}")
          text = text.replace(hash_anchor, committed_claim, 1)

          path.write_text(text, encoding="utf-8")
          print("atomic citation ownership claim patch applied")
          PY
          git diff --check
          git diff -- runtime/engine.py | tee .ci-results/production-patch.diff

      - name: Compile patched production source
        run: python -m py_compile runtime/engine.py

      - name: Run citation ownership regressions
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_runtime_lineage_citation_run_isolation_v1 \
            tests.test_runtime_evidence_citation_provenance_v1 \
            2>&1 | tee .ci-results/targeted-test.log

      - name: Commit and push atomicity patch when present
        shell: bash
        run: |
          if git diff --quiet -- runtime/engine.py; then
            echo "No production diff to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git commit -m "fix(runtime): claim citation ownership after artifact seal"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-citation-ownership-isolation-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true

# TEMPORARY ONE-SHOT ATOMICITY PATCHER: remove contents:write and patch/push
# steps immediately after the guarded production commit lands. Final exact-head
# GREEN evidence must come from the cleaned read-only workflow.
