name: Runtime Citation Ownership Isolation V1

on:
  pull_request:
    branches:
      - fix/runtime-sealed-receipt-scope-isolation-v1
    paths:
      - "runtime/engine.py"
      - "tests/test_runtime_lineage_citation_run_isolation_v1.py"
      - "tests/test_runtime_evidence_citation_provenance_v1.py"
      - ".github/workflows/runtime-citation-ownership-isolation-v1.yml"

permissions:
  contents: read

jobs:
  runtime-citation-ownership-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head identity
        shell: bash
        run: |
          mkdir -p .ci-results
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED" "$ACTUAL" | tee .ci-results/identity.txt
          test "$ACTUAL" = "$EXPECTED"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile touched source and regressions
        shell: bash
        run: |
          python -m py_compile \
            runtime/engine.py \
            tests/test_runtime_lineage_citation_run_isolation_v1.py \
            tests/test_runtime_evidence_citation_provenance_v1.py \
            2>&1 | tee .ci-results/compile.log

      - name: Run citation ownership regressions
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_runtime_lineage_citation_run_isolation_v1 \
            tests.test_runtime_evidence_citation_provenance_v1 \
            2>&1 | tee .ci-results/targeted-test.log

      - name: Upload exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-citation-ownership-isolation-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
