name: Runtime Citation Ownership Isolation V1

on:
  pull_request:
    branches:
      - fix/runtime-sealed-receipt-scope-isolation-v1
    paths:
      - "runtime/engine.py"
      - "tests/test_runtime_lineage_citation_run_isolation_v1.py"
      - "tests/test_runtime_evidence_citation_provenance_v1.py"
      - ".github/workflows/runtime-citation-ownership-isolation-v1.yml"

permissions:
  contents: write

jobs:
  runtime-citation-ownership-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head identity
        shell: bash
        run: |
          mkdir -p .ci-results
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED" "$ACTUAL" | tee .ci-results/identity.txt
          test "$ACTUAL" = "$EXPECTED"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply exact citation ownership production patch once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/engine.py")
          text = path.read_text(encoding="utf-8")
          marker = "self._citation_owner_by_id: Dict[str, str] = {}"
          if marker in text:
              print("citation ownership production marker already present; no-op")
              raise SystemExit(0)

          init_anchor = "        self._executed_tool_idempotency_keys: Dict[str, ExecutionReceipt] = {}\n"
          init_replacement = (
              init_anchor
              + "        # Runtime-lifetime citation ownership authority. This registry is\n"
              + "        # deliberately independent of the bounded completed-artifact cache so\n"
              + "        # ownership cannot disappear after cache eviction.\n"
              + "        self._citation_owner_by_id: Dict[str, str] = {}\n"
          )
          if text.count(init_anchor) != 1:
              raise SystemExit(f"unexpected init anchor count: {text.count(init_anchor)}")
          text = text.replace(init_anchor, init_replacement, 1)

          artifact_anchor = "            artifact = DepartmentRunArtifact(\n"
          canonical_block = (
              "            # Mutable RuntimeContext.knowledge_refs is not ownership authority.\n"
              "            # Seal only citations known to this runtime and not already owned by\n"
              "            # another run. Claim ownership atomically under the runtime lock.\n"
              "            known_citation_ids = {\n"
              "                str(citation.citation_id).strip()\n"
              "                for citation in self.lineage_inspector.get_all_citations()\n"
              "                if str(citation.citation_id).strip()\n"
              "            }\n"
              "            sealed_citation_ids: List[str] = []\n"
              "            seen_citation_ids: Set[str] = set()\n"
              "            for citation_ref in context.knowledge_refs:\n"
              "                citation_id = str(citation_ref or \"\").strip()\n"
              "                if not citation_id or citation_id in seen_citation_ids:\n"
              "                    continue\n"
              "                if citation_id not in known_citation_ids:\n"
              "                    continue\n"
              "                owner_run_id = self._citation_owner_by_id.get(citation_id)\n"
              "                if owner_run_id is not None and owner_run_id != context.run_id:\n"
              "                    continue\n"
              "                sealed_citation_ids.append(citation_id)\n"
              "                seen_citation_ids.add(citation_id)\n"
              "\n"
              "            for citation_id in sealed_citation_ids:\n"
              "                self._citation_owner_by_id[citation_id] = context.run_id\n"
              "\n"
          )
          if text.count(artifact_anchor) != 1:
              raise SystemExit(f"unexpected artifact anchor count: {text.count(artifact_anchor)}")
          text = text.replace(artifact_anchor, canonical_block + artifact_anchor, 1)

          knowledge_anchor = "                knowledge_used=context.knowledge_refs,\n"
          if text.count(knowledge_anchor) != 1:
              raise SystemExit(f"unexpected knowledge anchor count: {text.count(knowledge_anchor)}")
          text = text.replace(
              knowledge_anchor,
              "                knowledge_used=list(sealed_citation_ids),\n",
              1,
          )

          lineage_anchor = (
              "                    \"citations\": [\n"
              "              c.citation_id\n"
              "              for c in self.lineage_inspector.get_all_citations()\n"
              "              if c.citation_id in context.knowledge_refs\n"
              "          ],\n"
          )
          if text.count(lineage_anchor) != 1:
              raise SystemExit(f"unexpected lineage anchor count: {text.count(lineage_anchor)}")
          text = text.replace(
              lineage_anchor,
              "                    \"citations\": list(sealed_citation_ids),\n",
              1,
          )

          path.write_text(text, encoding="utf-8")
          print("exact citation ownership production patch applied")
          PY
          git diff --check
          git diff -- runtime/engine.py | tee .ci-results/production-patch.diff

      - name: Compile patched production source
        run: python -m py_compile runtime/engine.py

      - name: Run citation ownership regressions
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_runtime_lineage_citation_run_isolation_v1 \
            tests.test_runtime_evidence_citation_provenance_v1 \
            2>&1 | tee .ci-results/targeted-test.log

      - name: Commit and push production patch when present
        shell: bash
        run: |
          if git diff --quiet -- runtime/engine.py; then
            echo "No production diff to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git commit -m "fix(runtime): bind sealed citations to runtime ownership"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-citation-ownership-isolation-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true

# TEMPORARY ONE-SHOT PATCHER: remove contents:write and the patch/push steps
# immediately after the guarded production commit lands. Exact-head GREEN
# evidence must come from a subsequent run where the patcher is a no-op or gone.
