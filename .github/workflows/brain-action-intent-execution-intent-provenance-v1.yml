name: Brain ActionIntent ExecutionIntent Provenance V1

on:
  pull_request:
    branches:
      - fix/brain-action-intent-receipt-provenance-v1
    paths:
      - "tools/receipts.py"
      - "tools/tool_gateway.py"
      - "brain/action_policy.py"
      - "brain/contracts.py"
      - "brain/decisions.py"
      - "tests/test_brain_action_intent_execution_intent_provenance_v1.py"
      - "tests/test_brain_action_intent_receipt_provenance_v1.py"
      - "tests/test_brain_canonical_action_intent_tool_gateway_v1.py"
      - "tests/test_receipt_intent_authority_correlation_v1.py"
      - "tests/test_receipt_approval_provenance_binding_v1.py"
      - "tests/test_receipt_single_intent_ownership_v1.py"
      - ".github/workflows/brain-action-intent-execution-intent-provenance-v1.yml"

permissions:
  contents: read

jobs:
  action-intent-execution-intent-provenance-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head identity
        shell: bash
        run: |
          mkdir -p .ci-results
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED" "$ACTUAL" | tee .ci-results/identity.txt
          test "$ACTUAL" = "$EXPECTED"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile touched production source
        run: |
          python -m py_compile tools/receipts.py tools/tool_gateway.py

      - name: Run ActionIntent ExecutionIntent provenance regressions
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_brain_action_intent_execution_intent_provenance_v1 \
            tests.test_brain_action_intent_receipt_provenance_v1 \
            tests.test_brain_canonical_action_intent_tool_gateway_v1 \
            tests.test_receipt_intent_authority_correlation_v1 \
            tests.test_receipt_approval_provenance_binding_v1 \
            tests.test_receipt_single_intent_ownership_v1 \
            2>&1 | tee .ci-results/targeted-test.log

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-action-intent-execution-intent-provenance-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
