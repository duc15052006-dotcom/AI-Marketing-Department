name: TMP PR89 Trusted Scope Repair V8

on:
  push:
    branches:
      - test/pr89-trusted-scope-repair-v8

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate repair
        shell: pwsh
        run: python scripts/tmp_pr89_repair.py
      - name: Compile candidate patch
        shell: pwsh
        run: python -m py_compile runtime/context.py runtime/scope_bridge.py runtime/engine.py workspace/operator.py tests/test_runtime_trusted_legacy_scope_authority_v1.py tests/test_phase6_2_pilot_and_v1_release.py
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Run targeted regressions
        shell: pwsh
        run: python -m unittest tests.test_runtime_builder_canonical_lineage_scope_v1 tests.test_runtime_trusted_legacy_scope_authority_v1 tests.test_context_compiler_dual_scope_read_v1 tests.test_runtime_canonical_scope_plan_v1 tests.test_runtime_builder_scope_isolation_v1 tests.test_phase6_2_pilot_and_v1_release -v
      - name: Verify patch hygiene
        shell: pwsh
        run: git diff --check
      - name: Commit validated candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/context.py runtime/scope_bridge.py runtime/engine.py workspace/operator.py tests/test_runtime_trusted_legacy_scope_authority_v1.py
          git commit -m "test: validated PR89 trusted legacy scope repair"
          git push origin HEAD:test/pr89-trusted-scope-repair-v8
