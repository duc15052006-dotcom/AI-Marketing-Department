name: ToolGateway business approval scope V1
on:
  pull_request:
    paths:
      - 'app_api/server.py'
      - 'tools/security.py'
      - 'tools/tool_gateway.py'
      - 'tests/test_tool_gateway_business_approval_scope_v1.py'
      - '.github/workflows/tool-gateway-business-approval-scope-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tool-gateway-business-scope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-head:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_LIVE_PROVIDER_TESTS: '0'
      RUN_REAL_MODEL_TEST: '0'
      RUN_LIVE_MODEL_TESTS: '0'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify exact head
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "HEAD mismatch: $actual != $expected" }
          python --version
          python -m compileall -q tools tests/test_tool_gateway_business_approval_scope_v1.py
      - name: Targeted authority regression
        run: python -m unittest -v tests.test_tool_gateway_business_approval_scope_v1 tests.test_tool_gateway_idempotency_01
      - name: Full offline regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
