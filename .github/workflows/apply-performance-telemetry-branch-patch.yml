name: Apply Performance Telemetry Branch Patch

on:
  push:
    branches: [fix/performance-real-telemetry-42]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[performance-telemetry-patched]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/performance-real-telemetry-42
          fetch-depth: 0

      - name: Apply exact Performance telemetry patch
        run: python scripts/_patch_performance_telemetry_42.py

      - name: Verify exact patch and focused regressions
        shell: bash
        run: |
          git diff --check
          git diff -- runtime/engine.py
          grep -q 'NON_REAL_TELEMETRY_IGNORED' runtime/engine.py
          grep -q 'analytics_data_status' runtime/engine.py
          python -m py_compile runtime/engine.py tests/test_performance_real_telemetry_30.py
          python -m unittest tests.test_performance_real_telemetry_30 -v

      - name: Commit branch-only patch and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/apply-performance-telemetry-branch-patch.yml
          rm scripts/_patch_performance_telemetry_42.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py .github/workflows/apply-performance-telemetry-branch-patch.yml scripts/_patch_performance_telemetry_42.py
          git commit -m "Use observed campaign telemetry in Performance stage [performance-telemetry-patched]"
          git push origin HEAD:fix/performance-real-telemetry-42
