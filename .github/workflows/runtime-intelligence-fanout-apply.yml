name: Runtime Intelligence Fanout Guarded Apply

on:
  push:
    branches:
      - feat/runtime-intelligence-adaptive-fanout-v1
    paths:
      - ".github/workflows/runtime-intelligence-fanout-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-intelligence-adaptive-fanout-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify RED head ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor c02cda2c61811dbe2c7967e6b4de66f7d417b2b2 HEAD
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Apply exact guarded patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_patch.py
          python /tmp/apply_patch.py
          python -m compileall -q runtime/engine.py
          python -m unittest -v tests.test_runtime_intelligence_adaptive_fanout_v1
      - name: Commit production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py
          git commit -m "feat(runtime): fan out intelligence research safely"
          git push origin HEAD:feat/runtime-intelligence-adaptive-fanout-v1
