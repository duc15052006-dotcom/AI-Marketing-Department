name: Bootstrap Research Agenda Use Boundary Fix V1

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/brain-research-agenda-use-boundary-revalidation-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Apply minimal production patch and remove bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('brain/hypotheses.py')
          text = path.read_text(encoding='utf-8')
          old = '''    request = copy.deepcopy(request)\n    active = set(request.portfolio.active_hypothesis_ids)'''
          new = '''    # ResearchAgendaRequest is mutable, so construction-time validation is not\n    # an authority boundary. Rebuild the complete semantic envelope from its\n    # current serialized state before portfolio/probe state influences research.\n    request = ResearchAgendaRequest(**copy.deepcopy(request.model_dump()))\n    active = set(request.portfolio.active_hypothesis_ids)'''
          if old not in text:
              raise SystemExit('expected research-agenda use-boundary pattern not found')
          if text.count(old) != 1:
              raise SystemExit('research-agenda patch target is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/bootstrap-research-agenda-use-boundary-fix-v1.yml

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(brain): revalidate research agenda at use boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
