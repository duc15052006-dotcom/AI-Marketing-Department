name: Apply Runtime Intelligence Adaptive Fanout V1

on:
  push:
    branches:
      - feat/runtime-intelligence-adaptive-fanout-v1
    paths:
      - ".github/workflows/runtime-intelligence-adaptive-fanout-apply-v1.yml"

permissions:
  contents: write

jobs:
  apply-production-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-intelligence-adaptive-fanout-v1
          fetch-depth: 0

      - name: Verify exact production source blob
        shell: bash
        run: |
          ACTUAL="$(git hash-object runtime/engine.py)"
          EXPECTED="2c787800cc0291ba08e70b6d7152c5a3e93d94cd"
          echo "expected_engine_blob=$EXPECTED"
          echo "actual_engine_blob=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply exact Intelligence fanout integration
        run: python .github/scripts/apply_intelligence_fanout_v1.py

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "runtime/engine.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run targeted integration regressions before commit
        run: |
          python -m unittest -v \
            tests.test_runtime_intelligence_adaptive_fanout_v1 \
            tests.test_runtime_dependency_scheduler_v1 \
            tests.test_prod_research_grounding_01b \
            tests.test_prod_research_quality_01b

      - name: Commit production integration and remove temporary apply files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-intelligence-adaptive-fanout-apply-v1.yml
          git rm .github/scripts/apply_intelligence_fanout_v1.py
          git add runtime/engine.py
          git diff --cached --check
          git commit -m "feat(runtime): fan out intelligence research safely"
          git push origin HEAD:feat/runtime-intelligence-adaptive-fanout-v1
