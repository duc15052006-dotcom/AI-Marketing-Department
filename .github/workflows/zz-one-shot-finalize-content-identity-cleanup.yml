name: One-shot Finalize Content Identity Cleanup

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
    paths:
      - '.github/workflows/zz-one-shot-finalize-content-identity-cleanup.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact gate identity
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}"
          echo "exact_gate_sha=$actual"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply final Content identity cleanup
        run: python .github/scripts/zz_finalize_content_identity_cleanup.py

      - name: Compile affected sources and tests
        run: python -m compileall -q brain runtime tests

      - name: Run focused canonical role regressions
        run: |
          python -m unittest -v \
            tests.test_agent_prompt_semantic_role_boundaries_v1 \
            tests.test_agent_manifests \
            tests.test_brain_five_agent_dna_contract_v1 \
            tests.test_brain_canonical_agent_identity_v1 \
            tests.test_brain_learning_consolidation_v1 \
            tests.test_creative_prerequisite_tool_gate_adversarial_v1 \
            tests.test_creative_performance_true_handoff \
            tests.test_brain_runtime_canonical_action_intent_handoff_v1

      - name: Run complete Brain namespace regression
        run: python -m unittest discover -v -s tests -p 'test_brain*.py'

      - name: Remove one-shot repair tooling
        run: |
          rm .github/scripts/zz_finalize_content_identity_cleanup.py
          rm .github/workflows/zz-one-shot-finalize-content-identity-cleanup.yml

      - name: Commit verified cleanup atomically
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git commit -m "fix(brain): finish canonical Content cleanup"
          git push origin HEAD:fix/brain-content-canonical-role-v1
