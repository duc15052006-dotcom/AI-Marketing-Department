name: Provider Operation Scope Isolation Validation

# Temporary branch-local harness used only to capture RED/GREEN evidence.
on:
  push:
    branches:
      - fix/provider-operation-scope-fault-isolation

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run scope isolation adversarial test
        shell: pwsh
        run: |
          python -m unittest -v tests.test_provider_operation_scope_fault_isolation_adversarial_v1 2>&1 | Tee-Object -FilePath scope-isolation-targeted.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
      - name: Run provider operation regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_provider_operation_tracker_v1 `
            tests.test_provider_operation_tracker_adversarial_v1 `
            tests.test_provider_operation_scope_fault_isolation_adversarial_v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath full-hermetic-unittest.log
          $testExit = $LASTEXITCODE
          Write-Host "===== full hermetic unittest tail ====="
          Get-Content full-hermetic-unittest.log -Tail 300
          if ($testExit -ne 0) { exit $testExit }
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-operation-scope-isolation-validation-logs
          path: |
            scope-isolation-targeted.log
            full-hermetic-unittest.log
          if-no-files-found: warn
          retention-days: 7
