name: Apply Model Gateway Stream Consumer Cancel V1

on:
  push:
    branches:
      - test/model-gateway-stream-consumer-cancel-v1
    paths:
      - .github/workflows/apply-model-gateway-stream-consumer-cancel-v1.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: test/model-gateway-stream-consumer-cancel-v1
          fetch-depth: 0

      - name: Apply minimal cancellation propagation fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")

          before_init = '''            # 5. Execute Streaming with Fallback Semantics\n            candidate_visible_content = False\n            candidate_terminal_seen = False\n\n            try:\n                stream_gen = adapter.generate_stream(req_copy)\n'''
          after_init = '''            # 5. Execute Streaming with Fallback Semantics\n            candidate_visible_content = False\n            candidate_terminal_seen = False\n            stream_gen = None\n\n            try:\n                stream_gen = adapter.generate_stream(req_copy)\n'''
          if text.count(before_init) != 1:
              raise SystemExit(f"expected exactly one stream init anchor, found {text.count(before_init)}")
          text = text.replace(before_init, after_init, 1)

          before_except = '''            except Exception as e:\n                is_timeout = is_timeout_exception(e)\n'''
          after_except = '''            except GeneratorExit:\n                # Consumer cancellation must propagate to the active provider stream\n                # so abandoned provider I/O cannot continue consuming tokens/cost.\n                close_stream = getattr(stream_gen, "close", None) if stream_gen is not None else None\n                if callable(close_stream):\n                    try:\n                        close_stream()\n                    except Exception:\n                        logger.debug(\n                            "Provider stream close failed during consumer cancellation for %s::%s",\n                            cand_provider,\n                            cand_model,\n                            exc_info=True,\n                        )\n                raise\n\n            except Exception as e:\n                is_timeout = is_timeout_exception(e)\n'''
          if text.count(before_except) != 1:
              raise SystemExit(f"expected exactly one stream exception anchor, found {text.count(before_except)}")
          text = text.replace(before_except, after_except, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit production fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git diff --cached --check
          git commit -m "fix(models): close provider stream on consumer cancellation"
          git push origin HEAD:test/model-gateway-stream-consumer-cancel-v1
