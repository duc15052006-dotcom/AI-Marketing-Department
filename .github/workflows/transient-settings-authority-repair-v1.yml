name: Transient Settings Authority Repair V1

on:
  push:
    branches:
      - test/nonbrain-transient-settings-authority-v1

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
  AI_MARKETING_MEMORY_EPHEMERAL: "1"
  AI_MARKETING_LEARNING_EPHEMERAL: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  red-green-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact head
        shell: pwsh
        run: |
          $expected = "${{ github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "EXACT_HEAD_MISMATCH: expected $expected actual $actual" }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Prove stale contract is RED
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01.TestProdModelSettings01.test_23_transient_test_connection_success
          if ($LASTEXITCODE -eq 0) {
            throw "EXPECTED_CAUSAL_RED_BUT_TEST_PASSED"
          }
          Write-Host "CAUSAL_RED_CONFIRMED"
          exit 0

      - name: Apply provider-neutral invariant repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tests/test_prod_model_settings_01.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''    def test_23_transient_test_connection_success(self):
              """Verify Test Connection executes against target without persisting or modifying policy."""
              # Mock adapter generate response
          '''
          replacement = '''    def test_23_transient_test_connection_success(self):
              """Verify Test Connection executes against target without persisting or modifying policy."""
              expected_global_target = (
                  self.gateway.model_policy.global_target.provider_id,
                  self.gateway.model_policy.global_target.model_id,
              )

              # Mock adapter generate response
          '''
          stale_assertion = '            self.assertEqual(self.gateway.model_policy.global_target.provider_id, "gemini")\n'
          neutral_assertion = '''            self.assertEqual(
                  (
                      self.gateway.model_policy.global_target.provider_id,
                      self.gateway.model_policy.global_target.model_id,
                  ),
                  expected_global_target,
              )
          '''

          if text.count(anchor) != 1:
              raise SystemExit(f"ANCHOR_COUNT={text.count(anchor)}")
          if text.count(stale_assertion) != 1:
              raise SystemExit(f"STALE_ASSERTION_COUNT={text.count(stale_assertion)}")

          text = text.replace(anchor, replacement, 1)
          text = text.replace(stale_assertion, neutral_assertion, 1)
          path.write_text(text, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove focused GREEN
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01.TestProdModelSettings01.test_23_transient_test_connection_success
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile production and tests
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connections connectors creative_engine governance integrations knowledge memory observability runtime schemas scripts tools workspace tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic Windows discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit certified one-file repair and remove temporary harness
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_prod_model_settings_01.py
          git rm .github/workflows/transient-settings-authority-repair-v1.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test(models): preserve configured target after transient probe"
          git push origin HEAD:test/nonbrain-transient-settings-authority-v1
