name: Temporary Release Rust Escape Repair

on:
  push:
    branches: [release/v1-productization-final]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1-productization-final
          fetch-depth: 0

      - name: Repair and verify Rust test helper escaping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/main.rs")
          text = path.read_text(encoding="utf-8")
          old1 = r'b\"\r\n\r\n\"'
          new1 = r'b"\r\n\r\n"'
          old2 = r'eq_ignore_ascii_case(\"content-length\")'
          new2 = r'eq_ignore_ascii_case("content-length")'

          if old1 not in text:
              pos = text.find("request.windows(4)")
              nearby = text[pos:pos + 180] if pos >= 0 else "<anchor missing>"
              raise SystemExit(f"byte-string escape anchor not found; nearby={nearby!r}")
          if old2 not in text:
              raise SystemExit("content-length escape anchor not found")

          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          if old1 in text or old2 in text:
              raise SystemExit("malformed Rust escaping remains after repair")
          if new1 not in text or new2 not in text:
              raise SystemExit("repaired Rust anchors not present")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check
          git diff -- src-tauri/src/main.rs

      - name: Commit Rust escape repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/main.rs
          git commit -m "test(desktop): fix Windows mock request helper escaping"
          git push origin HEAD:release/v1-productization-final
