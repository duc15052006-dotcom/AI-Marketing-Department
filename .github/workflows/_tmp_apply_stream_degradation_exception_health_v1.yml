name: TEMP Apply Stream Degradation Exception Health V1

on:
  push:
    branches:
      - test/model-gateway-stream-degradation-exception-health-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/model-gateway-stream-degradation-exception-health-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Apply exact fail-closed production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    except Exception as sync_e:
                        sync_err = ModelStreamError(
                            code="STREAM_INTERNAL_ERROR",
                            category="INTERNAL",
                            safe_message=f"STREAM_INTERNAL_ERROR: Internal model invocation failure on '{cand_provider}'.",
                            retryable=False,
                            http_status=None,
                        )
                        last_error = sync_err
                        last_error_provider = cand_provider
                        last_error_model = cand_model
                        if strict_model_pin or len(candidates) == 1:
                            yield normalize_public_stream_delta(
                                StreamDelta(content="", finish_reason="error", error=sync_err),
                                cand_provider,
                                cand_model,
                            )
                            return
                        continue
'''
          new = '''                    except Exception as sync_e:
                        if is_timeout_exception(sync_e):
                            sync_err = ModelStreamError(
                                code="TIMEOUT",
                                category="TIMEOUT",
                                safe_message=f"TIMEOUT: Synchronous degradation call to '{cand_provider}' timed out.",
                                retryable=True,
                                http_status=408,
                            )
                            internal_code = ProviderErrorCode.TIMEOUT
                        elif is_network_exception(sync_e):
                            sync_err = ModelStreamError(
                                code="NETWORK_ERROR",
                                category="NETWORK",
                                safe_message=f"NETWORK_ERROR: Network connection failure during synchronous degradation for '{cand_provider}'.",
                                retryable=True,
                                http_status=None,
                            )
                            internal_code = ProviderErrorCode.NETWORK_ERROR
                        else:
                            sync_err = ModelStreamError(
                                code="STREAM_INTERNAL_ERROR",
                                category="INTERNAL",
                                safe_message=f"STREAM_INTERNAL_ERROR: Internal model invocation failure on '{cand_provider}'.",
                                retryable=False,
                                http_status=None,
                            )
                            internal_code = None

                        if internal_code is not None:
                            self.config_service.record_error(cand_provider, internal_code)
                            self.update_provider_health(cand_provider, ProviderHealth.UNAVAILABLE, detail=sync_err.safe_message)
                        last_error = sync_err
                        last_error_provider = cand_provider
                        last_error_model = cand_model
                        if strict_model_pin or len(candidates) == 1:
                            yield normalize_public_stream_delta(
                                StreamDelta(content="", finish_reason="error", error=sync_err),
                                cand_provider,
                                cand_model,
                            )
                            return
                        continue
'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one old degradation exception block, found {text.count(old)}")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("applied production patch")
          elif new in text:
              print("production patch already present")
          else:
              raise SystemExit("fail-closed: expected degradation exception block not found")
          PY
      - name: Compile and run causal plus gateway regressions
        run: |
          python -m compileall -q integrations/models tests/test_model_gateway_stream_degradation_exception_health_v1.py
          python -m unittest -v \
            tests.test_model_gateway_stream_degradation_exception_health_v1 \
            tests.test_model_gateway_post_dispatch_timeout_health_v2 \
            tests.test_model_gateway_stream_exception_health_v1 \
            tests.test_prod_structured_provider_stream_error_01
      - name: Commit production patch if changed
        shell: bash
        run: |
          if git diff --quiet -- integrations/models/gateway.py; then
            echo "No production diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git commit -m "fix(models): classify degradation transport exceptions"
          git push origin HEAD:test/model-gateway-stream-degradation-exception-health-v1
