name: TEMP Converge Certified Gateway V1

on:
  push:
    branches:
      - integration/nonbrain-convergence-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-converge-certified-gateway-v1
  cancel-in-progress: true

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          echo "integration_head=$(git rev-parse HEAD)"
          git fetch origin 25f4ea1a29fa16246908de2573b9f49850bf671b
          git cat-file -e 25f4ea1a29fa16246908de2573b9f49850bf671b^{commit}
          echo "certified_gateway_head=25f4ea1a29fa16246908de2573b9f49850bf671b"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Stage only certified production Gateway file
        shell: bash
        run: |
          set -euo pipefail
          git show 25f4ea1a29fa16246908de2573b9f49850bf671b:integrations/models/gateway.py > /tmp/certified_gateway.py
          cp /tmp/certified_gateway.py integrations/models/gateway.py
          if git diff --quiet -- integrations/models/gateway.py; then
            echo "Gateway already matches certified donor."
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "integrations/models/gateway.py"
          ! git diff --name-only | grep -q '^brain/'

      - name: Import certified Gateway regressions into checkout only
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            tests/test_model_gateway_implicit_policy_neutrality_v1.py \
            tests/test_model_gateway_stream_degradation_exception_health_v1.py \
            tests/test_model_gateway_post_dispatch_timeout_health_v2.py \
            tests/test_model_gateway_permission_health_v1.py \
            tests/test_model_gateway_midstream_error_health_v1.py \
            tests/test_model_gateway_stream_exception_health_v1.py \
            tests/test_model_gateway_sync_rate_limit_health_v1.py \
            tests/test_model_gateway_stream_consumer_cancel_v1.py \
            tests/test_model_gateway_late_result_timeout_v1.py \
            tests/test_model_gateway_initial_timeout_budget_v1.py \
            tests/test_model_gateway_stream_timeout_budget_v1.py; do
            git show 25f4ea1a29fa16246908de2573b9f49850bf671b:$f > $f
          done

      - name: Compile and run certified Gateway matrix before commit
        run: |
          python -m compileall -q integrations/models tests
          python -m unittest -v \
            tests.test_model_gateway_implicit_policy_neutrality_v1 \
            tests.test_model_gateway_stream_degradation_exception_health_v1 \
            tests.test_model_gateway_post_dispatch_timeout_health_v2 \
            tests.test_model_gateway_permission_health_v1 \
            tests.test_model_gateway_midstream_error_health_v1 \
            tests.test_model_gateway_stream_exception_health_v1 \
            tests.test_model_gateway_sync_rate_limit_health_v1 \
            tests.test_model_gateway_stream_consumer_cancel_v1 \
            tests.test_model_gateway_late_result_timeout_v1 \
            tests.test_model_gateway_initial_timeout_budget_v1 \
            tests.test_model_gateway_stream_timeout_budget_v1

      - name: Restore checkout and restage only certified Gateway
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          cp /tmp/certified_gateway.py integrations/models/gateway.py
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "integrations/models/gateway.py"
          ! git diff --name-only | grep -q '^brain/'

      - name: Commit certified Gateway convergence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- integrations/models/gateway.py; then
            echo "No Gateway convergence diff to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/models/gateway.py
          git commit -m 'fix(integration): converge certified Gateway hardening'
          git push origin HEAD:integration/nonbrain-convergence-v1
