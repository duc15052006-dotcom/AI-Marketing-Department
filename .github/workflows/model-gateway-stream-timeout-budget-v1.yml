name: Model Gateway Stream Timeout Budget V1

on:
  push:
    branches:
      - test/model-gateway-stream-timeout-budget-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-gateway-stream-timeout-budget-v1-qualify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regression:
    name: Ubuntu Python 3.12 focused model regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        run: |
          echo "github_sha=${{ github.sha }}"
          echo "github_ref=${{ github.ref }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile model and regression sources
        run: |
          python -m compileall -q integrations/models tests/test_model_gateway_stream_timeout_budget_v1.py

      - name: Causal — stream timeout budget
        id: causal
        continue-on-error: true
        run: python -m unittest -v tests.test_model_gateway_stream_timeout_budget_v1

      - name: Adjacent — provider registry
        id: provider_registry
        continue-on-error: true
        run: python -m unittest -v tests.test_prod_model_gateway_01_provider_registry

      - name: Adjacent — model streaming
        id: model_streaming
        continue-on-error: true
        run: python -m unittest -v tests.test_prod_model_streaming_01

      - name: Adjacent — structured provider stream error
        id: structured_stream_error
        continue-on-error: true
        run: python -m unittest -v tests.test_prod_structured_provider_stream_error_01

      - name: Adjacent — model settings
        id: model_settings
        continue-on-error: true
        run: python -m unittest -v tests.test_prod_model_settings_01

      - name: Gate focused regressions
        if: always()
        run: |
          echo "causal=${{ steps.causal.outcome }}"
          echo "provider_registry=${{ steps.provider_registry.outcome }}"
          echo "model_streaming=${{ steps.model_streaming.outcome }}"
          echo "structured_stream_error=${{ steps.structured_stream_error.outcome }}"
          echo "model_settings=${{ steps.model_settings.outcome }}"
          if [[ "${{ steps.causal.outcome }}" != "success" || \
                "${{ steps.provider_registry.outcome }}" != "success" || \
                "${{ steps.model_streaming.outcome }}" != "success" || \
                "${{ steps.structured_stream_error.outcome }}" != "success" || \
                "${{ steps.model_settings.outcome }}" != "success" ]]; then
            exit 1
          fi

      - name: Verify clean checkout after tests
        run: git diff --exit-code

  full-hermetic-windows:
    name: Windows Python 3.12 full hermetic discovery
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record exact-head identity
        shell: pwsh
        run: |
          "github_sha=${{ github.sha }}"
          "github_ref=${{ github.ref }}"
          python --version
          git rev-parse HEAD

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connectors creative_engine governance integrations knowledge memory runtime schemas scripts tools workspace tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean checkout after tests
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
