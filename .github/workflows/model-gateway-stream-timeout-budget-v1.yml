name: Model Gateway Stream Timeout Budget V1

on:
  push:
    branches:
      - test/model-gateway-stream-timeout-budget-v1

permissions:
  contents: write

concurrency:
  group: model-gateway-stream-timeout-budget-v1-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-shot-fix:
    name: Apply minimal stream timeout budget fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply deterministic minimal patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integrations/models/gateway.py")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)

          loop_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == "for cand_idx, (cand_provider, cand_model) in enumerate(candidates):"
          ]
          if len(loop_matches) != 1:
              raise SystemExit(f"expected exactly one streaming candidate loop, found {len(loop_matches)}")

          loop_idx = loop_matches[0]
          window_end = min(len(lines), loop_idx + 20)
          if any("Gateway stream timeout budget exhausted across fallback candidates." in line for line in lines[loop_idx:window_end]):
              raise SystemExit("stream timeout guard already present; refusing duplicate patch")

          remaining_matches = [
              i for i in range(loop_idx + 1, window_end)
              if lines[i].strip() == "remaining_timeout = total_timeout - elapsed"
          ]
          if len(remaining_matches) != 1:
              raise SystemExit(
                  f"expected exactly one remaining-time calculation in streaming loop, found {len(remaining_matches)}"
              )

          idx = remaining_matches[0]
          indent = lines[idx][: len(lines[idx]) - len(lines[idx].lstrip())]
          guard = [
              f"{indent}if remaining_timeout <= 0.001 and cand_idx > 0:\n",
              f"{indent}    logger.warning(\"Gateway stream timeout budget exhausted across fallback candidates.\")\n",
              f"{indent}    break\n",
          ]
          lines[idx + 1:idx + 1] = guard
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Verify causal regression
        run: |
          python -m unittest -v tests.test_model_gateway_stream_timeout_budget_v1
          python -m compileall -q integrations/models/gateway.py tests/test_model_gateway_stream_timeout_budget_v1.py
          git diff --check

      - name: Commit minimal production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/models/gateway.py
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "expected production diff missing"
            exit 1
          fi
          git commit -m "fix(models): stop stream fallback after timeout budget"
          git push origin HEAD:test/model-gateway-stream-timeout-budget-v1
