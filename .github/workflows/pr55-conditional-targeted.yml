name: PR55 Conditional Authorization Targeted

on:
  push:
    branches:
      - fix/conditional-approval-deployment-gate-55

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conditional-approval-deployment-gate-55
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Apply guarded conditional authorization patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          engine = Path('runtime/engine.py')
          text = engine.read_text(encoding='utf-8-sig')

          old = '        approved_for_deployment = audit_res.authorization_status in ("APPROVED", "APPROVED_WITH_CONDITIONS")'
          new = '\n'.join([
              '        authorization_status = audit_res.authorization_status',
              '        approved_for_deployment = authorization_status == "APPROVED"',
              '        conditional_approval = authorization_status == "APPROVED_WITH_CONDITIONS"',
          ])
          if text.count(old) != 1:
              raise SystemExit(f'expected one Final CMO deployment allowlist line, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '        if not approved_for_deployment:'
          new = '        if not approved_for_deployment and not conditional_approval:'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Final CMO rejection branch, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '            "status": "READY_FOR_DEPLOYMENT" if approved_for_deployment else "NOT_READY",'
          new = '            "status": "READY_FOR_DEPLOYMENT" if approved_for_deployment else ("READY_FOR_HUMAN_APPROVAL" if conditional_approval else "NOT_READY"),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Final CMO readiness line, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '            "reason": "" if approved_for_deployment else "; ".join(audit_res.blocking_reasons)[:300],'
          new = '            "reason": "" if approved_for_deployment else ("CONDITIONS_REMAIN_UNRESOLVED" if conditional_approval else "; ".join(audit_res.blocking_reasons)[:300]),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Final CMO reason line, found {text.count(old)}')
          text = text.replace(old, new, 1)
          engine.write_text(text, encoding='utf-8')

          governed = Path('governance/runtime_engine.py')
          text = governed.read_text(encoding='utf-8-sig')
          anchor = '        # 2. Permission Mode Evaluation\n'
          insert = '''        # Non-terminal claim authorization states never grant autonomous\n        # execution authority. Only explicit APPROVED reaches the permission\n        # mode gate; PENDING/conditional states remain human-gated.\n        if self.final_authorization != "APPROVED":\n            return {\n                "decision": "READY_FOR_HUMAN_APPROVAL",\n                "action_id": getattr(action_request, "action_id", "ACT-001"),\n                "reason": (\n                    "Final claim authorization is not fully approved; "\n                    f"current state={self.final_authorization}. Human resolution/sign-off is required."\n                ),\n                "approval_state": ApprovalState.PENDING_APPROVAL,\n            }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one permission-mode anchor, found {text.count(anchor)}')
          text = text.replace(anchor, insert + anchor, 1)
          governed.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile runtime/engine.py governance/runtime_engine.py tests/test_conditional_approval_no_deploy_55.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- runtime/engine.py governance/runtime_engine.py
      - name: Run targeted conditional authorization suites
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_conditional_approval_no_deploy_55 `
            tests.test_phase4_2_2_runtime_enforcement `
            tests.test_cmo_claim_and_approval_discipline `
            tests.test_cmo_governance_contracts `
            tests.test_prod_sec_01_api_and_approval_boundary
      - name: Commit tested production patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py governance/runtime_engine.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "harden: require full approval before deployment"
          git push origin HEAD:fix/conditional-approval-deployment-gate-55
