name: PR55 Conditional Authorization Targeted

on:
  push:
    branches:
      - fix/conditional-approval-deployment-gate-55

permissions:
  contents: read

jobs:
  targeted:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run targeted conditional authorization regression
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_conditional_approval_no_deploy_55 `
            tests.test_phase4_2_2_runtime_enforcement `
            tests.test_cmo_claim_and_approval_discipline `
            tests.test_cmo_governance_contracts
