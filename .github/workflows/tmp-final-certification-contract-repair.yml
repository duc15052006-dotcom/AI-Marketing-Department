name: Temporary Final Certification Contract Repair

on:
  push:
    branches:
      - integration/final-main-reconciliation-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: integration/final-main-reconciliation-v1
          fetch-depth: 0

      - name: Apply exact repairs and restore clean workflow
        shell: python
        run: |
          import base64
          from pathlib import Path
          tests = Path('tests/test_collaboration_integrity_audit.py')
          text = tests.read_text(encoding='utf-8')
          old_approval = '        self.assertIn(final_out["approval_status"], ("APPROVED", "APPROVED_WITH_CONDITIONS"))\n        self.assertEqual(final_out["status"], "READY_FOR_DEPLOYMENT")'
          new_approval = '        self.assertIn(final_out["approval_status"], ("APPROVED", "APPROVED_WITH_CONDITIONS"))\n        expected_status = (\n            "READY_FOR_DEPLOYMENT"\n            if final_out["approval_status"] == "APPROVED"\n            else "READY_FOR_HUMAN_APPROVAL"\n        )\n        self.assertEqual(final_out["status"], expected_status)'
          if text.count(old_approval) != 1:
              raise SystemExit(f'expected one stale conditional-approval assertion, found {text.count(old_approval)}')
          text = text.replace(old_approval, new_approval)
          old_perf = '        self.assertEqual(ctx.stage_outputs["performance"]["funnel_kpi"], replies["performance"])'
          new_perf = '        perf = ctx.stage_outputs["performance"]\n        self.assertEqual(perf["measurement_attribution"], replies["performance"])\n        self.assertEqual(perf["experimentation_governance"], replies["performance"])\n        self.assertEqual(perf["field_origins"]["measurement_attribution"], "AGENT_DERIVED")\n        self.assertEqual(perf["field_origins"]["experimentation_governance"], "AGENT_DERIVED")\n        self.assertEqual(perf["field_origins"]["funnel_kpi"], "DETERMINISTIC_COMPUTED")\n        self.assertIn("## Pass 5A — Measurement & Attribution", perf["funnel_kpi"])\n        self.assertIn("## Pass 5B — Experimentation & Governance", perf["funnel_kpi"])\n        self.assertEqual(perf["funnel_kpi"].count(replies["performance"]), 2)'
          if text.count(old_perf) != 1:
              raise SystemExit(f'expected one stale Performance raw-output assertion, found {text.count(old_perf)}')
          tests.write_text(text.replace(old_perf, new_perf), encoding='utf-8')
          world_b64 = ''
          Path('.github/workflows/brain-world-state-reasoning-v1.yml').write_bytes(base64.b64decode(world_b64))
          Path('.github/workflows/tmp-final-certification-contract-repair.yml').unlink()

      - name: Commit clean root-cause repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_collaboration_integrity_audit.py .github/workflows/brain-world-state-reasoning-v1.yml .github/workflows/tmp-final-certification-contract-repair.yml
          git diff --cached --check
          git commit -m "test(ci): align certification contracts with canonical runtime"
          git push origin HEAD:integration/final-main-reconciliation-v1
