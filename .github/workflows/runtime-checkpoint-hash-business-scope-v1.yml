# Exact-head qualification for checkpoint business-scope hash integrity.
name: Runtime Checkpoint Hash Business Scope V1

on:
  pull_request:
    paths:
      - "runtime/context.py"
      - "tests/test_runtime_checkpoint_hash_business_scope_v1.py"
      - ".github/workflows/runtime-checkpoint-hash-business-scope-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUN_LIVE_PROVIDER_TESTS: "0"
  RUN_REAL_MODEL_TEST: "0"
  RUN_LIVE_MODEL_TESTS: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  guarded-production-apply:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/runtime-checkpoint-hash-business-scope-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard exact production preimage
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git hash-object runtime/context.py)"
          EXPECTED="fb9263d5ff1e027523ee3245375e0fb05efdd4fa"
          echo "expected_context_blob=$EXPECTED"
          echo "actual_context_blob=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git status --porcelain)"

      - name: Apply business-scope hash patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("runtime/context.py")
          text = path.read_text(encoding="utf-8")
          old = '''        pending_approval_id = self.pending_approval_id or ""\n        raw = f"{self.run_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{pending_approval_id}:{working_state_json}"\n'''
          new = '''        pending_approval_id = self.pending_approval_id or ""\n        business_id = self.business_id or ""\n        raw = f"{self.run_id}:{business_id}:{self.stage.value}:{self.status.value}:{json.dumps(self.completed_stages)}:{json.dumps(self.receipt_ids)}:{self.approval_state.value}:{pending_approval_id}:{working_state_json}"\n'''
          if text.count(old) != 1:
              raise SystemExit(f"PATCH_GUARD_FAILED: expected one exact hash anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          test "$(git diff --name-only | tr -d '\r')" = "runtime/context.py"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile touched production source
        run: python -m py_compile runtime/context.py

      - name: Run guarded targeted regressions
        run: |
          python -m unittest -v \
            tests.test_runtime_checkpoint_hash_business_scope_v1 \
            tests.test_runtime_checkpoint_hash_pending_approval_v1 \
            tests.test_runtime_checkpoint_hash_working_state_v1 \
            tests.test_runtime_checkpoint_deep_snapshot_v1 \
            tests.test_structure

      - name: Commit production fix and remove unused apply workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-checkpoint-hash-business-scope-apply.yml
          git add runtime/context.py
          echo "staged files:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/runtime-checkpoint-hash-business-scope-apply.yml runtime/context.py "
          git commit -m "fix(runtime): bind checkpoint hash to business scope"
          git push origin HEAD:fix/runtime-checkpoint-hash-business-scope-v1

  checkpoint-hash-business-scope-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify exact head identity
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run checkpoint scope/hash regressions
        run: |
          python -m unittest -v \
            tests.test_runtime_checkpoint_hash_business_scope_v1 \
            tests.test_runtime_checkpoint_hash_pending_approval_v1 \
            tests.test_runtime_checkpoint_hash_working_state_v1 \
            tests.test_runtime_checkpoint_deep_snapshot_v1

  full-hermetic-regression:
    name: Windows Python 3.12 full hermetic regression
    runs-on: windows-latest
    timeout-minutes: 60
    needs: checkpoint-hash-business-scope-regression
    steps:
      - name: Checkout exact PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Record and verify CI identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $actual = git rev-parse HEAD
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          "expected_sha=$expected" | Tee-Object -FilePath .ci-results/identity.txt
          "actual_sha=$actual" | Tee-Object -FilePath .ci-results/identity.txt -Append
          "runner_os=${{ runner.os }}" | Tee-Object -FilePath .ci-results/identity.txt -Append
          python --version 2>&1 | Tee-Object -FilePath .ci-results/identity.txt -Append
          if ($actual -ne $expected) { throw "HEAD_MISMATCH: expected=$expected actual=$actual" }

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app_api chat config connectors creative_engine governance integrations knowledge memory runtime schemas scripts tools workspace tests 2>&1 | Tee-Object -FilePath .ci-results/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repair regressions
        timeout-minutes: 12
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_structure `
            tests.test_prod_verifier_02_sidecar_boundary.TestImportFirewall `
            tests.test_tool_gateway_idempotency_01 `
            tests.test_free_only_cost_authority_02 `
            tests.test_secret_sanitization_03 `
            tests.test_settings_connection_redaction_03b `
            tests.test_tool_receipt_provenance_04 `
            tests.test_local_openai_noauth_05 `
            tests.test_local_noauth_diagnostics_05c `
            tests.test_sse_parser_06 `
            tests.test_sse_response_wrapper_06b `
            tests.test_provider_response_schema_07 `
            tests.test_governance_import_cycle_11 `
            tests.test_stream_error_redaction_10 `
            tests.test_creative_performance_true_handoff `
            2>&1 | Tee-Object -FilePath .ci-results/repair-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified streaming regressions
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_prod_model_streaming_01 `
            tests.test_prod_structured_provider_stream_error_01 `
            tests.test_prod_python_streaming_endpoint_01 `
            tests.test_prod_runtime_progress_01 `
            2>&1 | Tee-Object -FilePath .ci-results/streaming-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified model settings regressions
        timeout-minutes: 20
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01 `
            2>&1 | Tee-Object -FilePath .ci-results/model-settings-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run certified provider registry regressions
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_gateway_01_provider_registry `
            2>&1 | Tee-Object -FilePath .ci-results/provider-registry-regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full hermetic unittest discovery
        timeout-minutes: 35
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | Tee-Object -FilePath .ci-results/full-unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-hash-business-scope-full-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
