name: One-shot Finalize Content Model Settings Contract

on:
  push:
    branches:
      - fix/brain-content-canonical-role-v1
    paths:
      - .github/workflows/_tmp_finalize_content_model_settings.yml
      - scripts/_tmp_finalize_content_model_settings.py

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-content-model-settings
  cancel-in-progress: false

jobs:
  repair-and-certify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUN_LIVE_PROVIDER_TESTS: "0"
      RUN_REAL_MODEL_TEST: "0"
      RUN_LIVE_MODEL_TESTS: "0"
      AI_MARKETING_KNOWLEDGE_EPHEMERAL: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact gate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply guarded Content model-settings migration
        shell: pwsh
        run: |
          python scripts/_tmp_finalize_content_model_settings.py
          python -m compileall -q tests/test_prod_model_settings_01.py

      - name: Run certified model settings regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_prod_model_settings_01

      - name: Run canonical Windows full hermetic discovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test*.py"

      - name: Commit only after all certification passes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_finalize_content_model_settings.yml scripts/_tmp_finalize_content_model_settings.py
          git add tests/test_prod_model_settings_01.py
          git diff --cached --check
          git commit -m "test(brain): finish canonical Content model settings contract"
          git push origin HEAD:fix/brain-content-canonical-role-v1
