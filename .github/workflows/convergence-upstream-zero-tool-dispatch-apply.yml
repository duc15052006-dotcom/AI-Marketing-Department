name: Convergence Content Failure Lineage Gate Apply

on:
  pull_request:
    branches:
      - integration/brain-nonbrain-convergence-v1
    paths:
      - ".github/workflows/convergence-upstream-zero-tool-dispatch-apply.yml"

permissions:
  contents: write

jobs:
  validate-and-apply-source-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/brain-nonbrain-mergework-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering convergence SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact branch and stale-run guards
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "integration/brain-nonbrain-mergework-v1"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch origin integration/brain-nonbrain-mergework-v1
          test "$(git rev-parse origin/integration/brain-nonbrain-mergework-v1)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" != "main"

      - name: Install repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply Content prerequisite lineage gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          engine = Path("runtime/engine.py")
          text = engine.read_text(encoding="utf-8")
          gate = base64.b64decode("").decode("utf-8")
          marker = "# Content prerequisite is terminal before lineage/context mutation."
          anchor = '        k_res, m_res = self._build_stage_lineage_context("content", context, include_memory=True)\n\n        # Grounded Context Compilation is the authoritative model-input boundary.\n'
          if marker not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("Content gate anchor missing or non-unique")
              text = text.replace(anchor, gate + anchor, 1)
              engine.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_runtime_upstream_failed_zero_tool_dispatch_convergence_v1.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_method = base64.b64decode("").decode("utf-8")
          test_marker = "def test_content_does_not_mutate_lineage_after_intelligence_failure"
          test_anchor = "    def test_creative_does_not_generate_asset_after_content_failure(self) -> None:\n"
          if test_marker not in test_text:
              if test_text.count(test_anchor) != 1:
                  raise SystemExit("Content regression anchor missing or non-unique")
              test_text = test_text.replace(test_anchor, test_method + test_anchor, 1)
              test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Validate Content fail-closed hardening
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q runtime/engine.py tests/test_runtime_upstream_failed_zero_tool_dispatch_convergence_v1.py
          python -m unittest -v tests.test_runtime_upstream_failed_zero_tool_dispatch_convergence_v1
          python -m unittest discover -s tests -p 'test_creative_prerequisite_tool_gate_v1.py' -v

      - name: Commit source-only hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/brain-nonbrain-mergework-v1
          test "$(git rev-parse origin/integration/brain-nonbrain-mergework-v1)" = "${{ github.event.pull_request.head.sha }}"
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | awk '{print $2}' | sort | paste -sd ',' -)" = "runtime/engine.py,tests/test_runtime_upstream_failed_zero_tool_dispatch_convergence_v1.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/engine.py tests/test_runtime_upstream_failed_zero_tool_dispatch_convergence_v1.py
          git diff --cached --check
          git commit -m "fix(runtime): stop Content lineage after upstream failure"
          git push origin HEAD:integration/brain-nonbrain-mergework-v1
