name: Full Hardening V2

on:
  push:
    branches:
      - phase/full-hardening-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-hardening-v2-certification
  cancel-in-progress: true

jobs:
  harden-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Apply reviewed residual hardening in certification workspace
        run: |
          python scripts/residual_hardening_v3.py
          python scripts/progress_truth_patch.py
          python scripts/security_boundary_patch.py
          python scripts/test_contract_alignment_v4.py
          python scripts/batch1_error_truth.py

      - name: Compile production Python
        run: python -m compileall -q runtime chat app_api integrations tools connectors

      - name: Focused hardening contracts
        run: |
          pytest -q \
            tests/test_prod_structured_provider_stream_error_01.py \
            tests/test_batch1_error_truth.py \
            tests/test_full_hardening_v2.py \
            tests/test_creative_performance_true_handoff.py \
            tests/test_prod_truth_01_execution_truthfulness.py \
            tests/test_prod_research_evidence_01a.py \
            tests/test_prod_core_authority_01b.py \
            tests/test_prod_runtime_01_single_run_authority.py \
            tests/test_prod_vietnamese_input_tolerance_01.py

      - name: Static truth and authority checks
        shell: bash
        run: |
          ! grep -R --line-number 'target_value.*150\.0' runtime/engine.py
          ! grep -R --line-number 'STREAM_GENERATION_FAILED' runtime/engine.py
          ! grep -R --line-number '"status": "RENDERED"' tools/adapters.py
          ! grep -R --line-number '"p_value": 0\.008' connectors/analytics_connector.py
          ! grep -R --line-number '"value": 3\.45' tools/adapters.py
          ! grep -R --line-number 'PREMATURE_EOF_BEFORE_TERMINAL' frontend/src
          ! grep -n 'item.error = str(e)' runtime/queue.py
          ! grep -n '_fail_closed_audit("AUDIT_GATE_ERROR", str' runtime/engine.py
          ! grep -R --line-number 'WinError 10061' chat runtime app_api frontend/src
          python - <<'PY'
          from runtime.agent_skills import PERMANENT_AGENT_IDS, get_agent_skill_contract
          assert PERMANENT_AGENT_IDS == ('cmo','intelligence','strategist','creative','performance')
          assert get_agent_skill_contract('final_cmo').agent_id == 'cmo'
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Diff whitespace validation
        run: git diff --check

      - name: Full Python regression sweep
        run: pytest -q tests

      - name: Optional Rust/Tauri check
        shell: bash
        run: |
          cargo_file="$(find . -name Cargo.toml -not -path './.git/*' -print -quit || true)"
          if [ -n "$cargo_file" ]; then
            cargo_dir="$(dirname "$cargo_file")"
            echo "Checking Rust project at $cargo_dir"
            (cd "$cargo_dir" && cargo check && cargo test)
          else
            echo "No Cargo.toml found in repository; native Tauri validation remains a Windows UAT requirement."
          fi
